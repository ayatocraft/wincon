    function enterGameMode() {
        if (state.active) {
            showLauncher();
            return;
        }
        state.active = true;
        closeAllDesktopApps();
        document.body.classList.add("wincon-game-mode");
        const taskbar = document.getElementById("taskbar");
        if (taskbar) taskbar.style.display = "none";
        ensureLauncher();
        renderLauncher();
        state.launcher.classList.add("active");
        let helpSeen = false;
        try { helpSeen = localStorage.getItem("winconGameModeHelpSeen") === "1"; } catch (_) {}
        if (!helpSeen) showGameModeHelp(true);
        startGamepadLoop();
    }

    function showLauncher() {
        if (!state.active) return;
        if (state.currentWindow) {
            state.currentWindow.remove();
            state.currentWindow = null;
        }
        document.querySelectorAll("#desktop .window.wincon-game-window").forEach(win => win.remove());
        document.querySelectorAll("#taskIcons .task-icon").forEach(task => task.remove());
        renderLauncher();
        state.launcher.classList.add("active");
    }

    function exitGameMode() {
        state.active = false;
        if (state.currentWindow) {
            state.currentWindow.remove();
            state.currentWindow = null;
        }
        document.querySelectorAll("#desktop .window.wincon-game-window").forEach(win => win.remove());
        document.querySelectorAll("#taskIcons .task-icon").forEach(task => task.remove());
        state.launcher?.classList.remove("active");
        document.getElementById("wgmHelpFloat")?.remove();
        document.getElementById("wgmSettingsPanel")?.remove();
        clearTimeout(state.hideTimer);
        document.body.classList.remove("wincon-game-mode");
        const taskbar = document.getElementById("taskbar");
        if (taskbar) taskbar.style.display = "";
        if (state.gamepadRAF) cancelAnimationFrame(state.gamepadRAF);
        state.gamepadRAF = 0;
        state.selected = 0;
    }

    function launchItem(app) {
        if (!state.active || !app) return;
        state.launcher?.classList.remove("active");
        state.currentWindow = null;
        try {
            switch (app.type) {
                case "browser": openBrowser(); break;
                case "appcenter": openAppCenter(); break;
                case "gamecenter": openGameCenter(); break;
                case "window": openTestWindow(); break;
                case "popup": openTestPopup(); break;
                case "file": openDiskUtility(); break;
                case "diskutility": openDiskUtility(); break;
                case "horizon-directory": openHorizonDirectory(); break;
                case "horizon-note": openHorizonNote(); break;
                case "miniapps-builder": openWinconMiniAppsBuilder(); break;
                case "miniapps-utility": openWinconMiniAppsUtility(); break;
                case "wincon-native-app": openWinconNativeApp(app); break;
                case "task": openTaskManager(); break;
                case "settings": openSystemSettings(false); break;
                case "assistant": toggleWinconAssistant(); break;
                case "wincon-intelligence":
                    if (window.WinconIntelligence && typeof window.WinconIntelligence.open === "function") window.WinconIntelligence.open();
                    else showLauncher();
                    break;
                case "transfer": openTransferApp(); break;
                case "terminal": openTerminal(); break;
                case "coreservice": openCoreService(); break;
                case "recovery": openRecovery(); break;
                case "appcenterdev": openAppCenterDeveloper(); break;
                case "externalHTML": {
                    const allowAll = (() => { try { return localStorage.getItem("winconGameModeAllowAllApps") === "1"; } catch (_) { return false; } })();
                    if (app.isGame === true || allowAll) openExternalHTML(app);
                    else showLauncher();
                    break;
                }
                default: showLauncher();
            }
        } catch (error) {
            console.error("[Wincon Game Mode] App launch failed", error);
            showLauncher();
        }
        // createWindowは同期的に生成する
        // createWindowラッパーが先に全画面化していれば、そのウィンドウを維持する。
        if (state.currentWindow && state.currentWindow.isConnected) return;
        const win = [...document.querySelectorAll("#desktop .window")].reverse().find(el => !el.classList.contains("wincon-game-window"));
        if (win) activateGameWindow(win);
        else showLauncher();
    }

    function activateGameWindow(win) {
        if (!win || !state.active) return;
        state.currentWindow = win;
        win.classList.add("wincon-game-window");
        win.classList.remove("maximized");
        win.style.left = "0";
        win.style.top = "0";
        win.style.width = "100vw";
        win.style.height = "100vh";
        win.style.zIndex = "2147482500";
        // タイトルバーは通常隠し、マウスを上端へ移動した時だけ表示する。
        const titlebar = win.querySelector(".titlebar");
        const controls = win.querySelector(".window-controls");
        controls?.querySelectorAll(".min-btn,.max-btn").forEach(button => button.remove());
        const closeButton = win.querySelector(".close-btn");
        if (closeButton) {

            };

            if (hideTitlebarTimer) clearTimeout(hideTitlebarTimer);
            win.classList.add("wgm-titlebar-visible");
        };
        let hideTitlebarTimer = null;
        const hideTitlebar = () => {
            if (hideTitlebarTimer) clearTimeout(hideTitlebarTimer);
            hideTitlebarTimer = setTimeout(() => {
                const overTitlebar = titlebar && titlebar.matches(":hover");
                const overRevealZone = revealZone && revealZone.matches(":hover");
                if (!overTitlebar && !overRevealZone) win.classList.remove("wgm-titlebar-visible");
            }, 220);
        };

        // 画面最上端の数ピクセルを狙わなくてもよいよう、上部64pxを表示判定エリアにする。
        // iframe上では親ウィンドウのmousemoveが届かないため、専用の透明センサーを置く。
        win.querySelector(".wgm-titlebar-reveal-zone")?.remove();
        const revealZone = document.createElement("div");
        revealZone.className = "wgm-titlebar-reveal-zone";

        win.onmousemove = event => {
            if (event.clientY <= 64) revealTitlebar();
            else if (event.clientY > (titlebar?.getBoundingClientRect().height || 42) + 18) hideTitlebar();
        };
        titlebar?.addEventListener("mouseenter", revealTitlebar);
        titlebar?.addEventListener("mouseleave", hideTitlebar);

        // 同一オリジンのアプリではiframe内のポインター移動も直接監視する。
        const gameFrame = win.querySelector(".content iframe");
        try {
            gameFrame?.contentWindow?.addEventListener("mousemove", event => {
                if (event.clientY <= 64) revealTitlebar();
                else if (event.clientY > (titlebar?.getBoundingClientRect().height || 42) + 18) hideTitlebar();
            }, true);
        } catch (_) { /* cross-origin iframeは上部センサーで対応 */ }
        win.querySelector(".content")?.style.setProperty("position", "absolute", "important");
        win.querySelector(".content")?.style.setProperty("inset", "0", "important");
        win.querySelector(".content")?.style.setProperty("width", "100%", "important");
        win.querySelector(".content")?.style.setProperty("height", "100%", "important");
        // ゲームモード中のタスクバー項目は表示しない
        document.querySelectorAll("#taskIcons .task-icon").forEach(task => task.remove());
    }

    // createWindowで作成されるゲームアプリには、タイトルバー左端の最適化ボタンを追加。
    if (typeof createWindow === "function" && !window.__WINCON_GAME_CREATE_WINDOW__) {
        window.__WINCON_GAME_CREATE_WINDOW__ = true;
        const previousCreateWindow = createWindow;
        createWindow = function (options) {
            const win = previousCreateWindow.apply(this, arguments);
            const app = (Array.isArray(menuItems) ? menuItems : []).find(item => item && item.title === options?.title);
            const allowAll = (() => { try { return localStorage.getItem("winconGameModeAllowAllApps") === "1"; } catch (_) { return false; } })();
            if ((app?.isGame === true || (allowAll && app)) && win && !state.active) {
                const titlebar = win.querySelector(".titlebar");
                const left = titlebar?.querySelector(".title-left");
                if (left && !left.querySelector(".wgm-optimize-btn")) {

                    button.type = "button";

                    left.prepend(button);
                }
            }

    }

    function launcherControls() {
        if (!state.launcher?.classList.contains("active")) return [];
        return [...state.launcher.querySelectorAll(".wgm-card, .wgm-hint-btn, .wgm-settings-btn, .wgm-desktop-btn")].filter(el => !el.disabled);

    function moveLauncherFocus(delta) {
        const controls = launcherControls();
        if (!controls.length) return;

        if (index < 0) index = 0;
        index = (index + delta + controls.length) % controls.length;
        controls[index].focus();
        controls[index].scrollIntoView({block:"nearest", inline:"nearest"});
    }

        }
        if (!state.launcher?.classList.contains("active")) return;

        } else if (["ArrowLeft", "ArrowUp"].includes(event.key)) {
            event.preventDefault(); moveLauncherFocus(-1);
        } else if (event.key === "Enter" || event.key === " ") {

            if (focused && state.launcher?.contains(focused) && focused.matches("button")) return;

    function startGamepadLoop() {
        if (state.gamepadRAF) cancelAnimationFrame(state.gamepadRAF);

                // Standard Gamepad mapping: button 16 = Home/Guide (PS/Xbox).
                const homePressed = !!(pad.buttons?.[16]?.pressed || pad.buttons?.[17]?.pressed);

                    if (!state.launcher?.classList.contains("active")) showLauncher();
                    state.lastHomePressed = homePressed;
                }
                state.lastHomePressed = homePressed;
            } else {
                state.lastHomePressed = false;
            }
            if (pad && state.launcher?.classList.contains("active")) {

                        else launcherControls()[0]?.click();
                        state.lastPadMove = now;
                    }
                }
            }
            state.gamepadRAF = requestAnimationFrame(poll);
        };
        state.gamepadRAF = requestAnimationFrame(poll);
    }

    console.log("[Wincon] Game Mode initialized (isGame)");
})();

function appFrameHTML(pkg,token){
 const html=pkg?.app?.html;
 if(typeof html!=='string')throw new Error('アプリのHTMLデータがありません');
 const safeToken=JSON.stringify(String(token||('wma-'+Math.random().toString(36).slice(2)+Date.now())));
 const bridge=`<script>(function(){
  'use strict';
  const TOKEN=${safeToken};
  const pending=new Map();
  let seq=0;
  function send(type,data){parent.postMessage({__winconMiniApps:true,token:TOKEN,type:type,data:data||{}},'*');}
  function request(type,data){return new Promise(function(resolve,reject){
   const id='wma-'+Date.now().toString(36)+'-'+(++seq)+'-'+Math.random().toString(36).slice(2);
   pending.set(id,{resolve:resolve,reject:reject});
   send(type,Object.assign({},data||{},{id:id}));
   setTimeout(function(){if(pending.has(id)){pending.delete(id);reject(new Error('Winconとの通信がタイムアウトしました'));}},15000);
  });}
  addEventListener('message',function(event){
   if(event.source!==parent||!event.data||!event.data.__winconMiniAppsReply)return;
   const item=pending.get(event.data.__winconMiniAppsReply);if(!item)return;
   pending.delete(event.data.__winconMiniAppsReply);
   if(event.data.ok===false)item.reject(new Error(event.data.error||'Wincon側の処理に失敗しました'));
   else item.resolve(event.data.value!==undefined?event.data.value:(event.data.ok!==undefined?event.data.ok:null));
  });
  window.WinconMiniApps={
   getItem:function(key){return request('get',{key:String(key)});},
   setItem:function(key,value){return request('set',{key:String(key),value:value});},
   removeItem:function(key){return request('remove',{key:String(key)});},
   install:function(app){return request('install',{app:app});},
   close:function(){send('close',{});}
  };
  window.WinconInstallerUtility={install:function(app){return window.WinconMiniApps.install(app);},requestInstall:function(app){return window.WinconMiniApps.install(app);}};
 })();<\/script>`;
 // <head>があるHTMLはその直後へ。headがない完全HTMLにはheadを補う。
 // HTML断片の場合は元の断片をbody内にそのまま保持する。
 if(/<head\b[^>]*>/i.test(html))return html.replace(/<head\b[^>]*>/i,function(m){return m+bridge;});
 if(/<html\b[^>]*>/i.test(html))return html.replace(/<html\b[^>]*>/i,function(m){return m+'<head>'+bridge+'</head>';});
 return '<!doctype html><html><head>'+bridge+'</head><body>'+html+'</body></html>';
}

// TV Mode code is retained, but its launcher is hidden from the normal Start app list.
function hideTVLauncher(){
 try{if(Array.isArray(menuItems))menuItems.forEach(item=>{if(item&&(item.type==='tv'||String(item.title||'').includes('TVモード')))item.hidden=true;});}catch(_){}
}

const menu=document.getElementById('menu');
const menuBtn=document.getElementById('menuBtn');
let contextMenu=null;
const PIN_KEY='wincon12StartPinnedTiles';
function itemKey(item){return String(item.id||((item.type||'')+'::'+(item.title||'')));}
function readPins(){try{const v=JSON.parse(localStorage.getItem(PIN_KEY)||'[]');return Array.isArray(v)?v:[];}catch(_){return[];}}
function writePins(v){try{localStorage.setItem(PIN_KEY,JSON.stringify(v));}catch(e){console.warn('[Wincon Start] pin save failed',e);}}
function closeContext(){if(contextMenu){contextMenu.remove();contextMenu=null;}}
function showContext(x,y,item){
 closeContext();const pinned=readPins().includes(itemKey(item));
 contextMenu=document.createElement('div');contextMenu.id='wincon12-start-context';
 const b=document.createElement('button');b.textContent=pinned?'スタートからピン留めを外す':'スタートにピン留めする';
 b.onclick=()=>{const pins=readPins(),key=itemKey(item),next=pins.filter(x=>x!==key);if(!pinned)next.push(key);writePins(next);closeContext();renderMenu();};
 contextMenu.appendChild(b);document.body.appendChild(contextMenu);
 const r=contextMenu.getBoundingClientRect();contextMenu.style.left=Math.max(4,Math.min(x,innerWidth-r.width-4))+'px';contextMenu.style.top=Math.max(4,Math.min(y,innerHeight-r.height-4))+'px';
}
function buildStartMenu(){
 if(!menu)return;
 hideTVLauncher();
 const oldSearch=menu.querySelector('.wincon-menu-search');
 const oldEmpty=menu.querySelector('.wincon-menu-empty');
 const oldButtons=[...menu.querySelectorAll(':scope > .menu-item')];
 const records=oldButtons.map(button=>({button,item:(Array.isArray(menuItems)?menuItems:[]).find(it=>it&&!it.hidden&&((it.title||'')===button.textContent.replace(/^\s*\S+\s*/, '').trim() || button.textContent.includes(it.title||'\u0000')))})).filter(x=>x.item);
 const shell=document.createElement('div');shell.className='w10-start-shell';
 const rail=document.createElement('div');rail.className='w10-start-rail';rail.innerHTML='<div class="w10-rail-mark">☰</div><div class="w10-rail-caption">WINCON</div>';
 const apps=document.createElement('section');apps.className='w10-start-apps';
 const appsTitle=document.createElement('div');appsTitle.className='w10-start-apps-title';appsTitle.textContent='すべてのアプリ';apps.appendChild(appsTitle);
 if(oldSearch)apps.appendChild(oldSearch);
 const list=document.createElement('div');list.className='w10-start-app-list';apps.appendChild(list);
 if(oldEmpty){oldEmpty.className='wincon-menu-empty';list.appendChild(oldEmpty);}
 const tiles=document.createElement('section');tiles.className='w10-start-tiles';
 const tileHeading=document.createElement('div');tileHeading.className='w10-tiles-heading';tileHeading.textContent='ピン留め済み';
 const power=document.createElement('div');power.className='w10-start-power';
 const powerLabel=document.createElement('span');powerLabel.className='w10-start-power-label';powerLabel.textContent='電源';power.appendChild(powerLabel);
 const shut=document.createElement('button');shut.className='w10-power-button shutdown';shut.textContent='⏻  シャットダウン';shut.onclick=()=>{menu.style.display='none';if(typeof window.shutdownSystem==='function')window.shutdownSystem();};
 const restart=document.createElement('button');restart.className='w10-power-button';restart.textContent='↻  再起動';restart.onclick=()=>{menu.style.display='none';if(typeof window.restartSystem==='function')window.restartSystem();};
 power.append(shut,restart);
 records.forEach(({button,item})=>{
  if(item.type==='shutdown'||item.type==='restart'||item.type==='power')return;
  button.classList.add('w10-app-list-item');
  button.addEventListener('contextmenu',ev=>{ev.preventDefault();showContext(ev.clientX,ev.clientY,item);});
  list.appendChild(button);
 });
 const pins=readPins();let count=0;
 records.forEach(({button,item})=>{
  if(item.type==='shutdown'||item.type==='restart'||item.type==='power'||!pins.includes(itemKey(item)))return;
  const tile=document.createElement('button');tile.type='button';tile.className='w10-tile';tile.title=item.title||'';
  const icon=document.createElement('span');icon.className='w10-tile-icon';
  const iconImage=item.iconImage||item.iconBase64||'';
  if(iconImage&&/^data:image\//i.test(iconImage)){const img=document.createElement('img');img.src=iconImage;img.alt='';img.style.cssText='width:48px;height:48px;object-fit:contain';icon.appendChild(img);}else icon.textContent=item.icon||'🧩';
  const label=document.createElement('span');label.className='w10-tile-label';label.textContent=item.title||'アプリ';
  tile.append(icon,label);tile.onclick=()=>button.click();tile.addEventListener('contextmenu',ev=>{ev.preventDefault();showContext(ev.clientX,ev.clientY,item);});tiles.appendChild(tile);count++;
 });
 if(!count){const empty=document.createElement('div');empty.className='w10-tile-empty';empty.textContent='アプリを右クリックして「スタートにピン留めする」を選択すると、ここにタイルが追加されます。';tiles.appendChild(empty);}
 shell.append(rail,apps,tiles,power);
 menu.replaceChildren(shell,tileHeading);
 if(oldSearch){oldSearch.addEventListener('input',()=>{const q=oldSearch.value.trim().toLocaleLowerCase();let visible=0;[...list.querySelectorAll('.menu-item')].forEach(btn=>{const match=btn.textContent.toLocaleLowerCase().includes(q);btn.hidden=!match;if(match)visible++;});if(oldEmpty){oldEmpty.hidden=visible!==0;}});}
}

if(menu&&typeof renderMenu==='function'&&!window.__WINCON12_W10_MENU__){
 window.__WINCON12_W10_MENU__=true;
 const priorRender=renderMenu;
 renderMenu=function(...args){hideTVLauncher();priorRender.apply(this,args);buildStartMenu();};
 window.renderMenu=renderMenu;
 // The earlier click handler opens with display:grid; the layout shell itself is block/grid-managed.
 menu.addEventListener('contextmenu',ev=>{if(!ev.target.closest('.menu-item,.w10-tile'))closeContext();});
 document.addEventListener('pointerdown',ev=>{if(contextMenu&&!contextMenu.contains(ev.target))closeContext();});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeContext();});
 try{renderMenu();}catch(e){console.warn('[Wincon Start] initial render failed',e);}
}

// Keep the TV implementation intact; only hide its registered launcher from menuItems.
hideTVLauncher();

// Fallback message color is set directly in the existing shutdown routine.
})();

<script>
/* Wincon 12 Horizon - Start / Sail Browser / in-system dialogs */
(function(){
'use strict';
if(window.__WINCON12_SAIL_START_PATCH__) return;
window.__WINCON12_SAIL_START_PATCH__=true;

const $=(sel,root=document)=>root.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PIN_KEY='wincon12StartPinnedTiles';
const WEBAPP_KEY='winconSailInstalledWebApps';
const readJSON=(key,def=[])=>{try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??def;}catch(_){return def;}};
const saveJSON=(key,v)=>{try{localStorage.setItem(key,JSON.stringify(v));}catch(e){console.warn('[Wincon] storage write failed',e);}};
const itemKey=item=>String(item.id||((item.type||'')+'::'+(item.title||'')));
const getPins=()=>readJSON(PIN_KEY,[]);
const setPins=v=>saveJSON(PIN_KEY,v);

/* Start menu: preserve original menuItems and launch routing, but build each row from its record.
   This avoids losing image-icon apps when their button text cannot be reverse-matched. */
function launchItem(item){
 switch(item.type){
  case 'window':openTestWindow();break; case 'coreservice':openCoreService();break; case 'popup':openTestPopup();break;
  case 'file':case 'diskutility':openDiskUtility();break;case 'horizon-directory':openHorizonDirectory();break;case 'horizon-note':openHorizonNote();break;
  case 'miniapps-builder':openWinconMiniAppsBuilder();break;case 'miniapps-utility':openWinconMiniAppsUtility();break;
  case 'wincon-native-app':if(typeof window.openWinconNativeApp==='function')window.openWinconNativeApp(item);break;
  case 'task':openTaskManager();break;case 'settings':openSystemSettings(false);break;case 'recovery':openRecovery();break;
  case 'shutdown':if(typeof window.shutdownSystem==='function')window.shutdownSystem();break;
  case 'restart':if(typeof window.restartSystem==='function')window.restartSystem();break;
  case 'assistant':toggleWinconAssistant();break;
  case 'wincon-intelligence':if(window.WinconIntelligence?.open)window.WinconIntelligence.open();else showInWinconAlert('Wincon Intelligenceを起動できません。');break;
  case 'externalHTML':openExternalHTML(item);break;case 'transfer':openTransferApp();break;case 'terminal':openTerminal();break;
  case 'reset':openResetCenter();break;case 'browser':openBrowser();break;case 'appcenter':openAppCenter();break;case 'gamecenter':openGameCenter();break;
  case 'wincon-update':
   if(window.WinconUpdateManager && typeof window.WinconUpdateManager.open==='function'){
    window.WinconUpdateManager.open();
   }else{
    console.error('[Wincon Start] Wincon Update Manager is not ready.');
    if(typeof showInWinconAlert==='function')showInWinconAlert('Wincon Updateを読み込めませんでした。','起動エラー');
    else alert('Wincon Updateを読み込めませんでした。');
   }
   break;
  case 'appcenterdev':openAppCenterDeveloper();break;case 'user-config':if(typeof window.Wincon12UserConfig==='function')window.Wincon12UserConfig();else showInWinconAlert('ユーザーコンフィグを読み込めませんでした。','起動エラー');break;case 'sail-webapp':openSailInstalledWebApp(item);break;
  default: if(typeof item.onClick==='function')item.onClick();else console.warn('[Wincon Start] no launch route for',item);
 }
}
function visibleMenuItems(){
 return (Array.isArray(menuItems)?menuItems:[]).filter(item=>item&&!item.hidden&&item.type!=='tv'&&!String(item.title||'').includes('TVモード')&&!((item.type==='window'||item.type==='popup')&&/テスト|test/i.test(String(item.title||''))));
}
function iconNode(item,large=false){
 const holder=document.createElement('span');holder.className=large?'w12-start-icon w12-start-icon-large':'w12-start-icon';
 const src=item.iconImage||item.iconBase64||item.favicon||'';
 if(src){const img=document.createElement('img');img.src=src;img.alt='';img.referrerPolicy='no-referrer';img.onerror=()=>{img.remove();holder.textContent=item.icon||'🧩';};holder.appendChild(img);}
 else holder.textContent=item.icon||'🧩';
 return holder;
}
function renderStartMenu(){
 const menu=$('#menu');if(!menu)return;
 const items=visibleMenuItems();
 const shell=document.createElement('div');shell.className='w12-start-shell';
 const rail=document.createElement('div');rail.className='w12-start-rail';
 rail.innerHTML='<div class="w12-start-rail-top">☰</div><div class="w12-start-rail-bottom">Wincon</div>';
 const listPane=document.createElement('section');listPane.className='w12-start-list-pane';
 const heading=document.createElement('div');heading.className='w12-start-heading';heading.textContent='すべてのアプリ';
 const search=document.createElement('input');search.className='w12-start-search';search.type='search';search.placeholder='アプリを検索';search.setAttribute('aria-label','アプリを検索');
 const list=document.createElement('div');list.className='w12-start-list';
 const listButtons=[];
 for(const item of items){
  if(['shutdown','restart','power'].includes(item.type))continue;
  const b=document.createElement('button');b.type='button';b.className='w12-start-app menu-item';b.__winconItem=item;b.append(iconNode(item),Object.assign(document.createElement('span'),{className:'w12-start-app-name',textContent:item.title||'名称未設定'}));
  b.addEventListener('click',()=>{menu.style.display='none';launchItem(item);});
  list.appendChild(b);listButtons.push(b);
 }
 const noMatch=document.createElement('div');noMatch.className='w12-start-no-match';noMatch.textContent='一致するアプリがありません';noMatch.hidden=true;list.appendChild(noMatch);
 search.addEventListener('input',()=>{let n=0;for(const b of listButtons){const ok=b.textContent.toLocaleLowerCase().includes(search.value.trim().toLocaleLowerCase());b.hidden=!ok;b.style.display=ok?"flex":"none";if(ok)n++;}noMatch.hidden=n!==0;});
 listPane.append(heading,search,list);
 const tilePane=document.createElement('section');tilePane.className='w12-start-tile-pane';
 const tileHeading=document.createElement('div');tileHeading.className='w12-start-tile-heading';tileHeading.textContent='ピン留め済み';tilePane.appendChild(tileHeading);
 const grid=document.createElement('div');grid.className='w12-start-tile-grid';
 const pins=getPins();let count=0;
 for(const item of items){if(['shutdown','restart','power'].includes(item.type)||!pins.includes(itemKey(item)))continue;
  const tile=document.createElement('button');tile.type='button';tile.className='w12-start-tile w10-tile menu-item';tile.title=item.title||'';
  tile.append(iconNode(item,true),Object.assign(document.createElement('span'),{className:'w12-start-tile-name',textContent:item.title||'アプリ'}));
  tile.addEventListener('click',()=>{menu.style.display='none';launchItem(item);});tile.__winconItem=item;grid.appendChild(tile);count++;
 }
 if(!count){const empty=document.createElement('div');empty.className='w12-start-empty';empty.textContent='アプリを右クリックして「スタートにピン留め」を選択すると、ここにタイルが表示されます。';grid.appendChild(empty);}
 tilePane.appendChild(grid);
 const footer=document.createElement('div');footer.className='w12-start-footer';
 const profile=document.createElement('div');profile.className='w12-start-profile';profile.textContent='◉  Wincon';
 const power=document.createElement('div');power.className='w12-start-power';
 const powerLabel=document.createElement('span');powerLabel.textContent='電源';
 const lock=document.createElement('button');lock.type='button';lock.textContent='🔒 ロック';lock.onclick=()=>{menu.style.display='none';window.Wincon12LockScreen?.();};
 const shutdown=document.createElement('button');shutdown.type='button';shutdown.textContent='⏻ シャットダウン';shutdown.onclick=()=>{menu.style.display='none';window.shutdownSystem?.();};
 const restart=document.createElement('button');restart.type='button';restart.textContent='↻ 再起動';restart.onclick=()=>{menu.style.display='none';window.restartSystem?.();};
 power.append(powerLabel,lock,shutdown,restart);footer.append(profile,power);
 shell.append(rail,listPane,tilePane,footer);menu.replaceChildren(shell);
 // Right-click is handled by Wincon's existing #winconExtensionContextMenu. The extra action is
 // appended to that same menu after its built-in Open / taskbar pin actions have appeared.
}
window.renderMenu=renderStartMenu;
if(typeof renderMenu==='function'){
 try{renderStartMenu();}catch(e){console.error('[Wincon Start] render failed',e);}
}
const menu=$('#menu'),menuBtn=$('#menuBtn');
if(menu&&menuBtn){menuBtn.removeAttribute('aria-expanded');menuBtn.addEventListener('click',ev=>{ev.stopImmediatePropagation();const opening=getComputedStyle(menu).display==='none';menu.style.display=opening?'block':'none';if(opening)renderStartMenu();},true);}
// Existing context menu augmentation: no second context-menu implementation is created.
document.addEventListener('contextmenu',ev=>{
 const target=ev.target.closest('#menu .w12-start-app,#menu .w12-start-tile');if(!target)return;
 const item=target.__winconItem;if(!item)return;
 setTimeout(()=>{
  $('#wincon12-start-context')?.remove();
  const existing=$('#winconExtensionContextMenu');if(!existing)return;
  const key=itemKey(item),pinned=getPins().includes(key);
  if(existing.querySelector('[data-wincon-start-pin]'))return;
  const action=document.createElement('button');action.type='button';action.dataset.winconStartPin='1';action.textContent=pinned?'📌 スタートからピン留めを外す':'📌 スタートにピン留め';
  action.addEventListener('click',()=>{const pins=getPins().filter(x=>x!==key);if(!pinned)pins.push(key);setPins(pins);existing.style.display='none';renderStartMenu();});
  existing.appendChild(action);
 },0);
},false);

/* Wincon-owned alerts are displayed in a native Wincon popup window, not browser alert chrome. */
function showInWinconAlert(message,title='通知'){
 const desktop=$('#desktop');if(!desktop||typeof createWindow!=='function'){console.warn(message);return;}
 const body=document.createElement('div');body.className='w12-alert-body';
 const text=document.createElement('div');text.className='w12-alert-message';text.textContent=String(message??'');
 const row=document.createElement('div');row.className='w12-alert-actions';const ok=document.createElement('button');ok.type='button';ok.className='action';ok.textContent='OK';row.appendChild(ok);body.append(text,row);
 const win=createWindow({title,icon:'ℹ️',popup:true,width:440,height:220,content:''});
 const content=win.querySelector('.content');content.replaceChildren(body);ok.onclick=()=>win.querySelector('.close-btn')?.click()||win.remove();ok.focus();
}
window.alert=message=>showInWinconAlert(message,'Wincon - 通知');

/* Sail Browser Patch 2: PWA metadata, Tabbed app windows, local file support. */
let sailWindowSerial=0;
function normalizeWebURL(raw){
 let value=String(raw||'').trim();if(!value)return'';
 if(/^file:\/\//i.test(value)||/^blob:/i.test(value)||/^about:/i.test(value)){try{return new URL(value).href;}catch(_){return'';}}
 if(!/^https?:\/\//i.test(value)){if(value.includes('.')&&!value.includes(' '))value='https://'+value;else value='https://www.google.com/search?q='+encodeURIComponent(value);}
 try{const u=new URL(value);return ['http:','https:','file:','blob:','about:'].includes(u.protocol)?u.href:'';}catch(_){return'';}
}
function pageTitleFromURL(url){try{const u=new URL(url);if(u.protocol==='file:')return decodeURIComponent(u.pathname.split('/').pop()||'ローカルファイル');if(u.protocol==='blob:')return'ローカルファイル';return u.hostname.replace(/^www\./,'')||'Web App';}catch(_){return'Web App';}}
function faviconForURL(url){try{const u=new URL(url);if(u.protocol==='http:'||u.protocol==='https:')return 'https://www.google.com/s2/favicons?domain_url='+encodeURIComponent(url)+'&sz=128';}catch(_){}return'';}
const SAIL_SUPPORTED_DISPLAY_MODES=['tabbed','standalone','minimal-ui','fullscreen','browser'];

  }
 };
 // IndexedDB is namespaced too, so databases opened by apps are separated per account.
 if(nativeIDBOpen&&nativeIDBDelete){
  try{window.indexedDB.open=function(name,version){const id=scope();return nativeIDBOpen(id?DB_PREFIX+id+'_'+String(name):name,version);};}catch(e){console.warn('[Wincon Storage] IndexedDB open isolation unavailable',e);}
  try{window.indexedDB.deleteDatabase=function(name){const id=scope();return nativeIDBDelete(id?DB_PREFIX+id+'_'+String(name):name);};}catch(e){console.warn('[Wincon Storage] IndexedDB delete isolation unavailable',e);}
 }
 const physicalKey=(storage,key)=>{
  const k=String(key);if(!isLocal(storage)||isGlobal(k))return k;
  const id=scope();return id?PREFIX+id+'::'+k:k;
 };
 window.__WINCON12_RAW_STORAGE_CLEAR__=()=>rawClear.call(window.localStorage);
 proto.getItem=function(key){return rawGet.call(this,physicalKey(this,key));};
 proto.setItem=function(key,value){return rawSet.call(this,physicalKey(this,key),value);};
 proto.removeItem=function(key){return rawRemove.call(this,physicalKey(this,key));};
 proto.key=function(index){
  if(!isLocal(this))return rawKey.call(this,index);
  const id=scope(),wanted=id?PREFIX+id+'::':'';
  const visible=[];
  const total=rawLength?rawLength.call(this):0;
  for(let i=0;i<total;i++){
   const k=rawKey.call(this,i);if(k===null)continue;
   if(isGlobal(k))visible.push(k);
   else if(id&&k.startsWith(wanted))visible.push(k.slice(wanted.length));
   else if(!id&&!k.startsWith(PREFIX))visible.push(k);
  }
  return visible[index]??null;
 };
 if(rawLength){
  try{Object.defineProperty(proto,'length',{configurable:true,get:function(){
   if(!isLocal(this))return rawLength.call(this);
   let n=0;const id=scope(),wanted=id?PREFIX+id+'::':'';
   for(let i=0;i<rawLength.call(this);i++){
    const k=rawKey.call(this,i);if(k===null)continue;
    if(isGlobal(k)||(id&&k.startsWith(wanted))||(!id&&!k.startsWith(PREFIX)))n++;
   }
   return n;
  }});}catch(e){console.warn('[Wincon Storage] length wrapper failed',e);}
 }
 proto.clear=function(){
  if(!isLocal(this))return rawClear.call(this);
  const id=scope(),total=rawLength?rawLength.call(this):0;
  if(!id){for(let i=total-1;i>=0;i--){const k=rawKey.call(this,i);if(k!==null&&!isGlobal(k)&&!k.startsWith(PREFIX))rawRemove.call(this,k);}return;}
  const prefix=PREFIX+id+'::';
  for(let i=total-1;i>=0;i--){const k=rawKey.call(this,i);if(k&&k.startsWith(prefix))rawRemove.call(this,k);}
 };
 window.__WINCON12_CLEAR_STORAGE_SCOPE__=id=>{
  const prefix=PREFIX+String(id)+'::';
  for(let i=(rawLength?rawLength.call(window.localStorage):0)-1;i>=0;i--){const k=rawKey.call(window.localStorage,i);if(k&&k.startsWith(prefix))rawRemove.call(window.localStorage,k);}

 function cleanupGuest(){
  try{
   if(sessionStorage.getItem('wincon12_guest_active')!=='1')return false;
   const guest=sessionStorage.getItem('wincon12_guest_scope');
   if(guest)window.__WINCON12_CLEAR_STORAGE_SCOPE__(guest);
   sessionStorage.removeItem('wincon12_guest_scope');sessionStorage.removeItem('wincon12_storage_scope');
   sessionStorage.removeItem('wincon12_guest_active');sessionStorage.removeItem('wincon12_guest_backup');

  window.__WINCON12_GUEST_SESSION__=true;const guest=sessionStorage.getItem('wincon12_guest_scope');if(guest)sessionStorage.setItem('wincon12_storage_scope',guest);
 }else{
  try{const session=JSON.parse(rawGet.call(window.localStorage,'wincon10_session')||'null');if(session?.userId)sessionStorage.setItem('wincon12_storage_scope',session.userId);}catch(_){}

<script>
/* =========================================================
   WINCON 12.0.1 PATCH 3 - SERVICE WORKER UPDATE APP
   Update flow: SW check -> cache delete -> reload -> rebuild cache
========================================================= */
(() => {
  "use strict";

  if (window.__WINCON_PATCH3_UPDATE_APP__) return;
  window.__WINCON_PATCH3_UPDATE_APP__ = true;

  const CACHE_NAME = "wincon-cache-v1";
  const PENDING_KEY = "winconPatch3UpdatePending";
  const RESULT_KEY = "winconPatch3UpdateResult";
  const PRECACHE_URLS = ["./", "./index.html"];

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function setProgress(screen, value, status, detail, remaining) {
    if (!screen || !screen.isConnected) return;
    const bar = screen.querySelector("#winconPatch3ProgressBar");
    const root = screen.querySelector(".wincon10-Horizon-progress");
    const statusNode = screen.querySelector("#winconPatch3Status");
    const detailNode = screen.querySelector("#winconPatch3Detail");
    const etaNode = screen.querySelector("#winconPatch3ETA");
    const n = Math.max(0, Math.min(100, Number(value) || 0));
    if (bar) bar.style.width = n + "%";
    if (root) root.setAttribute("aria-valuenow", String(Math.round(n)));
    if (statusNode && status) statusNode.textContent = status;
    if (detailNode && detail) detailNode.textContent = detail;
    if (etaNode && remaining) etaNode.textContent = remaining;
  }

  function showProgressScreen(status, detail, progress, remaining) {
    try {
      if (typeof installHorizonProcessCSS === "function") {
        installHorizonProcessCSS();
      }
    } catch (_) {}

    const old = document.getElementById("wincon10HorizonProcess");
    if (old) old.remove();

    const screen = document.createElement("div");
    screen.id = "wincon10HorizonProcess";
    screen.innerHTML = `
      <div class="wincon10-Horizon-process-inner w12-patch3-update-inner">
        <img src="wincon.png" class="wincon10-Horizon-logo" draggable="false"
             onerror="this.style.display='none'">
        <div class="wincon10-Horizon-brand">Wincon</div>
        <div class="wincon10-Horizon-version">12 Horizon · Software Update</div>
        <div class="wincon10-Horizon-progress" role="progressbar"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}">
          <div class="wincon10-Horizon-progress-bar" id="winconPatch3ProgressBar"
               style="width:${progress}%"></div>
        </div>
        <div class="wincon10-Horizon-status" id="winconPatch3Status">${status}</div>
        <div class="wincon10-Horizon-substatus" id="winconPatch3Detail">${detail}</div>
        <div class="w12-patch3-update-eta" id="winconPatch3ETA">${remaining}</div>
      </div>`;
    document.body.appendChild(screen);
    return screen;
  }

  function updateAppMarkup() {
    return `
      <div class="w12-patch3-update-app">
        <div class="w12-patch3-update-hero">
          <div class="w12-patch3-update-icon">↻</div>
          <div>
            <div class="w12-patch3-update-title">Wincon Update</div>
            <div class="w12-patch3-update-subtitle">Service Worker によるシステム更新</div>
          </div>
        </div>
        <div class="setting-group">
          <b>アップデート方式</b>
          <p>専用のバージョン管理サーバーは使用しません。</p>
          <p>ブラウザーが Service Worker（sw.js）の更新を確認し、キャッシュを再生成します。</p>
        </div>
        <div class="setting-group">
          <b>現在の状態</b>
          <div id="w12Patch3UpdateState" class="w12-patch3-state">状態を確認しています...</div>
          <div id="w12Patch3UpdateDetail" class="w12-patch3-muted">Service Worker の登録状況を取得中</div>
        </div>
        <div class="setting-group">
          <b>更新の流れ</b>
          <ol class="w12-patch3-steps">
            <li>Service Worker の更新確認</li>
            <li>旧キャッシュの削除</li>
            <li>Wincon の再読み込み</li>
            <li>キャッシュの再生成</li>
            <li>再起動</li>
          </ol>
        </div>
        <button class="action" id="w12Patch3UpdateButton">アップデートを確認して適用</button>
        <div class="w12-patch3-muted" id="w12Patch3UpdateNote">
          更新中はWinconが自動的に再起動します。処理が終わるまでページを閉じないでください。
        </div>
      </div>`;
  }

  function addAppStyles() {
    if (document.getElementById("w12Patch3UpdateStyles")) return;
    const style = document.createElement("style");
    style.id = "w12Patch3UpdateStyles";
    style.textContent = `
      .w12-patch3-update-app{color:var(--text,#fff);padding:4px}
      .w12-patch3-update-hero{display:flex;align-items:center;gap:16px;margin:4px 0 22px}
      .w12-patch3-update-icon{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);display:grid;place-items:center;font-size:34px;color:#fff;box-shadow:0 8px 22px #0004}
      .w12-patch3-update-title{font-size:24px;font-weight:650}
      .w12-patch3-update-subtitle,.w12-patch3-muted{font-size:12px;opacity:.72;margin-top:6px;line-height:1.55}
      .w12-patch3-state{font-size:16px;margin-top:9px}
      .w12-patch3-steps{line-height:1.9;padding-left:22px;margin:10px 0 0}
      .w12-patch3-update-eta{margin-top:14px;font-size:13px;color:#aeb7c4;letter-spacing:.02em}
      .w12-patch3-update-inner .wincon10-Horizon-status{margin-top:18px}
      .w12-patch3-update-inner .wincon10-Horizon-substatus{margin-top:8px}
      .w12-patch3-update-inner .wincon10-Horizon-progress{margin-top:34px}
    `;
    document.head.appendChild(style);
  }

  async function getRegistration() {
    if (!("serviceWorker" in navigator)) {
      throw new Error("この環境では Service Worker を利用できません。HTTPS のサイトで起動してください。");
    }
    if (!("caches" in window)) {
      throw new Error("CacheStorage を利用できません。");
    }
    const registration = await navigator.serviceWorker.register("./sw.js", {
      updateViaCache: "none"
    });
    await registration.update();
    return registration;
  }

  function waitForWorker(worker, timeoutMs = 25000) {
    if (!worker) return Promise.resolve();
    if (worker.state === "activated") return Promise.resolve();
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("Service Worker の有効化がタイムアウトしました。"));
      }, timeoutMs);
      const onState = () => {
        if (worker.state === "activated") {
          cleanup();
          resolve();
        } else if (worker.state === "redundant") {
          cleanup();
          reject(new Error("Service Worker の更新に失敗しました。"));
        }
      };
      const cleanup = () => {
        clearTimeout(timer);
        worker.removeEventListener("statechange", onState);
      };
      worker.addEventListener("statechange", onState);
      onState();
    });
  }

  async function runUpdate() {
    if (window.__WINCON_PATCH3_UPDATE_RUNNING__) return;
    window.__WINCON_PATCH3_UPDATE_RUNNING__ = true;

    const screen = showProgressScreen(
      "アップデートを確認しています...",
      "Service Worker の更新情報を確認しています",
      4,
      "残り約1分"
    );

    try {
      setProgress(screen, 12, "Service Worker に接続しています...", "更新プログラムを確認中", "残り約1分");
      const registration = await getRegistration();

      setProgress(screen, 30, "更新ファイルを確認しています...", "sw.js の更新状態を確認しました", "残り約1分");
      await wait(450);

      const candidate = registration.installing || registration.waiting;
      if (candidate) {
        setProgress(screen, 48, "更新をダウンロードしています...", "新しい Service Worker をインストールしています", "残り約1分");
        await waitForWorker(candidate);
      } else {
        setProgress(screen, 48, "最新の Service Worker を確認しました...", "新しい sw.js がない場合もキャッシュを再生成します", "残り約1分");
        await wait(550);
      }

      if (!registration.active && !navigator.serviceWorker.controller) {
        await navigator.serviceWorker.ready;
      }

      setProgress(screen, 68, "旧キャッシュを削除しています...", "古い画面データをクリアしています", "残り約1分");
      sessionStorage.setItem(PENDING_KEY, "rebuild");
      sessionStorage.removeItem(RESULT_KEY);

      await caches.delete(CACHE_NAME);

      setProgress(screen, 88, "再起動しています...", "キャッシュ削除が完了しました。Wincon を再読み込みします", "まもなく再起動します");
      await wait(700);
      location.reload();
    } catch (error) {
      console.error("[Wincon Update] Update failed:", error);
      sessionStorage.removeItem(PENDING_KEY);
      sessionStorage.setItem(RESULT_KEY, JSON.stringify({
        result: "failure",
        detail: error?.message || "アップデートに失敗しました"
      }));
      setProgress(screen, 100, "アップデートを開始できませんでした", error?.message || "不明なエラー", "通常起動に戻ります");
      await wait(2200);
      location.reload();
    }
  }

  async function rebuildAfterReload() {
    const phase = sessionStorage.getItem(PENDING_KEY);
    if (phase !== "rebuild") return;

    // The first reload has happened. Rebuild the cache before allowing the normal boot.
    const screen = showProgressScreen(
      "アップデートを適用しています...",
      "キャッシュを再生成しています",
      8,
      "残り約1分"
    );

    try {
      setProgress(screen, 18, "Service Worker を起動しています...", "更新後の制御状態を確認しています", "残り約1分");
      const registration = await navigator.serviceWorker.ready;
      if (!registration.active) throw new Error("有効な Service Worker が見つかりません。");

      setProgress(screen, 38, "更新ファイルをダウンロードしています...", "Wincon の起動ファイルを取得しています", "残り約1分");
      const cache = await caches.open(CACHE_NAME);
      await cache.addAll(PRECACHE_URLS);

      setProgress(screen, 82, "キャッシュを再生成しています...", "起動ファイルをキャッシュに保存しました", "残り数秒");
      await wait(600);

      sessionStorage.setItem(RESULT_KEY, JSON.stringify({
        result: "success",
        detail: "キャッシュの削除・再読み込み・再生成が完了しました"
      }));
      sessionStorage.removeItem(PENDING_KEY);

      setProgress(screen, 100, "アップデートが完了しました", "キャッシュの再生成が完了しました。Wincon を起動しています", "まもなく起動します");
      await wait(700);
      // Cache rebuild is complete. Resume the normal Horizon boot flow without another page reload.
      if (typeof startHorizonBootFlow === "function") {
        window.__WINCON10_BOOT_RUNNING__ = false;
        startHorizonBootFlow();
      } else {
        screen.remove();
      }
    } catch (error) {
      console.error("[Wincon Update] Cache rebuild failed:", error);
      sessionStorage.removeItem(PENDING_KEY);
      sessionStorage.setItem(RESULT_KEY, JSON.stringify({
        result: "failure",
        detail: error?.message || "キャッシュ再生成に失敗しました"
      }));
      setProgress(screen, 100, "キャッシュの再生成に失敗しました", error?.message || "不明なエラー", "通常起動に戻ります");
      await wait(2200);
      if (typeof startHorizonBootFlow === "function") {
        window.__WINCON10_BOOT_RUNNING__ = false;
        startHorizonBootFlow();
      } else {
        screen.remove();
      }
    }
  }

  function open() {
    addAppStyles();
    const content = updateAppMarkup();
    const win = createWindow({
      title: "Wincon Update",
      icon: "↻",
      width: 760,
      height: 650,
      content
    });

    const state = win.querySelector("#w12Patch3UpdateState");
    const detail = win.querySelector("#w12Patch3UpdateDetail");
    const button = win.querySelector("#w12Patch3UpdateButton");

    if (!("serviceWorker" in navigator)) {
      state.textContent = "Service Worker を利用できません";
      detail.textContent = "GitHub Pages など HTTPS の環境で起動してください。file:/// では動作しません。";
      button.disabled = true;
      button.style.opacity = ".55";
      return;
    }

    navigator.serviceWorker.getRegistration("./")
      .then(reg => {
        state.textContent = reg?.active ? "Service Worker 稼働中" : "Service Worker 未登録";
        detail.textContent = reg?.active
          ? "キャッシュ名: " + CACHE_NAME + " · スクリプト: sw.js"
          : "アップデート実行時に sw.js を登録します。";
      })
      .catch(() => {
        state.textContent = "状態を取得できません";
        detail.textContent = "アップデート実行時に再確認します。";
      });

    button.addEventListener("click", () => {
      if (confirm("Service Worker の更新確認、キャッシュ削除、再読み込み、キャッシュ再生成を実行しますか？")) {
        runUpdate();
      }
    });
  }

  window.WinconUpdateManager = { open, run: runUpdate };

  function registerMenuApp() {
    if (typeof menuItems === "undefined" || !Array.isArray(menuItems)) return false;
    if (!menuItems.some(item => item && item.type === "wincon-update")) {
      menuItems.push({
        id: "wincon-update",
        title: "Wincon Update",
        icon: "↻",
        type: "wincon-update",
        system: true,
        hidden: false
      });
    }
    if (typeof renderMenu === "function") renderMenu();
    return true;
  }

  // Register after the original menu system has initialized.
  const registerTimer = setInterval(() => {
    if (registerMenuApp()) clearInterval(registerTimer);
  }, 250);
  setTimeout(() => clearInterval(registerTimer), 15000);

  // On the first reload, regenerate cache with the same Horizon progress-gauge design.
  const startRebuild = () => rebuildAfterReload();
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startRebuild, { once: true });
  } else {
    setTimeout(startRebuild, 0);
  }
})();
</script>
