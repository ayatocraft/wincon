<style>

*{

padding:0;

body{

#desktop{

inset:0;

}

.window{

align-items:center;

#menu{

bottom:62px;

height:520px;
background:#2d333c;
border-radius:16px;

overflow:auto;

#contextMenu{

background:#2c313b;

overflow:hidden;
display:none;
z-index:999999999;

height:42px;
display:flex;
align-items:center;
padding:0 12px;
cursor:pointer;
}

.context-item:hover{
background:#4c5769;
}

.action{
width:100%;
height:42px;
border:none;
border-radius:10px;

color:white;
cursor:pointer;
}

.setting-group{
background:#343b46;
padding:12px;

input,
select,
textarea{
width:100%;
height:42px;
border:none;
border-radius:10px;

color:white;
padding:0 10px;
margin-top:8px;

textarea{

padding:10px;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

.resize-handle{

bottom:0;

height:18px;

}

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
        try {
            await navigator.serviceWorker.register("./sw.js");
            console.log("Service Worker登録完了");
        } catch (e) {
            console.error("Service Worker登録失敗", e);
        }
    });
}
const ENTERPRISE_STORAGE_KEY="winconEnterpriseApps";
const ably = new Ably.Realtime({
  token:"YOUR_TOKEN"
});

const ablyChannel =
ably.channels.get(
  "wincon-appcenter"
);
function loadEnterpriseApps(){

try{

const data=JSON.parse(
localStorage.getItem(
ENTERPRISE_STORAGE_KEY
)||"[]"
);

if(Array.isArray(data)){
window.__WINCON_ENTERPRISE_APPS__=data;
}

}catch(e){

window.__WINCON_ENTERPRISE_APPS__=[];

}

}

function saveEnterpriseApps(){

localStorage.setItem(
ENTERPRISE_STORAGE_KEY,
JSON.stringify(
window.__WINCON_ENTERPRISE_APPS__
)
);

}

const desktop=document.getElementById("desktop");
const menu=document.getElementById("menu");
const contextMenu=document.getElementById("contextMenu");
const taskIcons=document.getElementById("taskIcons");

let zIndexCounter=100;

window.__WINCON_ENTERPRISE_APPS__=
window.__WINCON_ENTERPRISE_APPS__||[];
loadEnterpriseApps();
let menuItems=JSON.parse(
localStorage.getItem("winconMenuItems")||"null"
)||[
{
title:"テストウィンドウ",
icon:"🪟",
type:"window"
},
{
title:"テストポップアップ",
icon:"⚠️",
type:"popup"
},
{
  title:"Sail Browser Beta",
  icon:"🌐",
  type:"browser",
  system:true
},
{
title:"ファイル",
icon:"📁",
type:"file",
system:true
},
{
  title:"Module Center",
  icon:"📦",
  type:"appcenter",
  system:true
},
{
  title:"Module Center Developer",
  icon:"🛠️",
  type:"appcenterdev",
  system:true
},
{
title:"タスクマネージャ",
icon:"📊",
type:"task",
system:true
},
{
id: "wincon-assistant",
title: "Wincon Assistant",
icon: "🤖",
type: "assistant",
system: true,
hidden:true
},
{
title:"システム設定",
icon:"⚙️",
type:"settings",
system:true
},
{
title:"リカバリ",
icon:"🛠️",
type:"recovery",
system:true,
hidden:true
},
{
title:"電源を切る",
icon:"⏻",
type:"shutdown",
system:true
},
{
title:"お引越し",
icon:"📦",
type:"transfer",
system:true,
hidden:true
},

{
  title:"ターミナル",
  icon:"⌨️",
  type:"terminal",
  system:true
},
,{
  title:"Wincon Core Service",
  icon:"⚙️",
  type:"coreservice",
  system:true,
  hidden:true
},

{
  title:"Wincon Reset Center",
  icon:"🧹",
  type:"reset",
  system:true,
  hidden:true
}
];

function mergeEnterpriseApps(){

if(
!Array.isArray(
window.__WINCON_ENTERPRISE_APPS__
)
){
window.__WINCON_ENTERPRISE_APPS__=[];
}

menuItems=
menuItems.filter(
m=>!m.enterprise
);

window.__WINCON_ENTERPRISE_APPS__
.forEach(app=>{

menuItems.unshift({
...app,
enterprise:true
});

});

}

function boot(){

mergeEnterpriseApps();

renderMenu();

restoreState();

setupSecurityShortcut();

startTutorial();

}

setTimeout(()=>{

const bootScreen=document.getElementById("bootScreen");

if(bootScreen){
bootScreen.remove();
}

boot();

},1200);

function setupSecurityShortcut(){

window.addEventListener("keydown",e=>{

if(e.ctrlKey&&e.shiftKey){
openSecurityOptions();
}

if(e.key==="Escape"){
openSystemSettings(true);
}

});

}
function fullFactoryReset(){

if(
!confirm(
"完全初期化しますか？企業モジュールも削除されます。"
)
){
return;
}

localStorage.clear();

location.reload();

}
let hiddenCommand="";

window.addEventListener(
"keydown",
e=>{

hiddenCommand+=e.key;

hiddenCommand=
hiddenCommand.slice(-20);

if(
hiddenCommand
.toLowerCase()
.includes("fullreset")
){

fullFactoryReset();

}

}
);
document.getElementById("menuBtn").onclick=()=>{

menu.style.display=
menu.style.display==="flex"
?"none"
:"flex";

};

function renderMenu(){

menu.innerHTML="";

menuItems.forEach(item=>{

if(item.hidden)return;

const btn=document.createElement("button");

btn.className="menu-item";

btn.innerHTML=
`${item.icon} ${item.title}`;

btn.onclick=()=>{

menu.style.display="none";

switch(item.type){

case "window":
openTestWindow();
break;

case "popup":
openTestPopup();
break;

case "file":
openFileManager();
break;

case "task":
openTaskManager();
break;

case "settings":
openSystemSettings(false);
break;

case "recovery":
openRecovery();
break;

case "shutdown":
shutdownSystem();
break;
        
case "assistant":
toggleWinconAssistant();
break;
        
case "externalHTML":
openExternalHTML(item);
break;

case "transfer":
openTransferApp();
break;

case "terminal":
openTerminal();
break;

case "reset":
openResetCenter();
break;

case "browser":
openBrowser();
break;
case "appcenter":
  openAppCenter();
  break;

case "appcenterdev":
  openAppCenterDeveloper();
  break;
}

};

menu.appendChild(btn);

});

}

function createWindow(options){

const {
title="Window",
icon="🪟",
content="",
width=700,
height=450,
popup=false,
safe=false
}=options;

const win=document.createElement("div");

win.className="window";

win.style.width=(popup?420:width)+"px";
win.style.height=(popup?240:height)+"px";

win.style.left=
Math.random()*240+80+"px";

win.style.top=
Math.random()*120+60+"px";

win.style.zIndex=++zIndexCounter;

win.dataset.title=title;

win.innerHTML=`

<div class="titlebar">

<div class="title-left">
<div>${icon}</div>
<div>${title}</div>
</div>

<div class="window-controls">

${popup?"":`
<button class="win-btn min-btn">
<i class="fa-solid fa-minus"></i>
</button>
`}

${popup||safe?"":`
<button class="win-btn max-btn">
<i class="fa-regular fa-square"></i>
</button>
`}

${safe?"":`
<button class="win-btn close-btn">
<i class="fa-solid fa-xmark"></i>
</button>
`}

</div>

</div>

<div class="content">
${content}
</div>

${popup?"":"<div class='resize-handle'></div>"}

`;

desktop.appendChild(win);

const task=document.createElement("div");

task.className="task-icon";
task.innerHTML=icon;
task.title=title;

taskIcons.appendChild(task);

task.onclick=()=>{

win.style.display="flex";

task.classList.remove("minimized");

win.style.zIndex=++zIndexCounter;

};

const titlebar=win.querySelector(".titlebar");

let dragging=false;
let offsetX=0;
let offsetY=0;

titlebar.addEventListener("mousedown",e=>{

dragging=true;

offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;

win.style.zIndex=++zIndexCounter;

});

window.addEventListener("mousemove",e=>{

if(!dragging)return;

if(win.classList.contains("maximized"))
return;

win.style.left=
e.clientX-offsetX+"px";

win.style.top=
e.clientY-offsetY+"px";

});

window.addEventListener("mouseup",()=>{
dragging=false;
});

const resize=win.querySelector(".resize-handle");

if(resize){

let resizing=false;
let startX,startY,startW,startH;

resize.addEventListener("mousedown",e=>{

resizing=true;

startX=e.clientX;
startY=e.clientY;

startW=win.offsetWidth;
startH=win.offsetHeight;

e.preventDefault();

});

window.addEventListener("mousemove",e=>{

if(!resizing)return;

win.style.width=
startW+(e.clientX-startX)+"px";

win.style.height=
startH+(e.clientY-startY)+"px";

});

window.addEventListener("mouseup",()=>{
resizing=false;
});

}

const closeBtn=win.querySelector(".close-btn");
const maxBtn=win.querySelector(".max-btn");
const minBtn=win.querySelector(".min-btn");

if(closeBtn){

closeBtn.onclick=()=>{

task.remove();
win.remove();

saveState();

};

}

if(maxBtn){

maxBtn.onclick=()=>{

win.classList.toggle("maximized");

};

}

if(minBtn){

minBtn.onclick=()=>{

win.style.display="none";

task.classList.add("minimized");

};

}

saveState();

return win;

}

title:"テストウィンドウ",
icon:"🪟",
content:"<h1>Wincon テスト版</h1>"

function openTaskManager(){

createWindow({
title:"タスクマネージャ",
icon:"📊",
width:850,
height:600,
content:`<h1>Task Manager</h1><br><div id='taskList'></div>`
});

setTimeout(()=>{

const list=document.getElementById("taskList");

function render(){

list.innerHTML="";

document.querySelectorAll(".window")
.forEach(win=>{

const div=document.createElement("div");

div.className="setting-group";

div.innerHTML=`

<b>${win.dataset.title}</b>

<br><br>

CPU: ${Math.floor(Math.random()*70)}%

<br>

RAM: ${Math.floor(Math.random()*1300)}MB

<br><br>

<button class='action'>
強制終了
</button>

`;

div.querySelector("button")
.onclick=()=>{

const title=win.dataset.title;

document.querySelectorAll(".task-icon")
.forEach(icon=>{

if(icon.title===title){
icon.remove();
}

});

win.remove();

render();

saveState();

};

list.appendChild(div);

});

}

render();

setInterval(render,2000);

},100);

}

createWindow({
title:"ファイル",
icon:"📁",
width:900,
height:650,
content:`

<h1>Files</h1>

<br>

<div class='setting-group'>

使用容量:
${Math.floor(

<div class='setting-group'>

async function installApp(id){

    console.log(
        "ID",
        id
    );


    const app =
    window.storeApps.find(
        a => a.id === id
    );


    if(!app){

        alert(
            "モジュールが見つかりません"
        );

        return;

    }


    // ==========================
    // Wincon UAC
    // ==========================

    const allowed =
    await requestWinconUAC({

        title:
        app.title,

        icon:
        app.icon || "📦",

        description:
        "このモジュールをWinconにインストールし、" +
        "メニューとモジュール情報を変更します。"

    });


    // 拒否された

    if(!allowed){

        console.log(
            "UAC denied"
        );

        return;

    }


    // ==========================
    // インストール実行
    // ==========================

    const exists =
    menuItems.some(
        item =>
        item.appId === app.id ||
        (
            item.title === app.title &&
            item.source === app.source
        )
    );


    if(exists){

        alert(
            "このモジュールは既にインストールされています"
        );

        return;

    }


    menuItems.push({

        appId:
        app.id,

        title:
        app.title,

        icon:
        app.icon || "📦",

        type:
        "externalHTML",

        source:
        app.source,

        popup:
        app.popup === true,

        version:
        app.version || "1.0.0"

    });


    localStorage.setItem(

        "winconMenuItems",

        JSON.stringify(
            menuItems
        )

    );


    renderMenu();


    alert(
        "インストール完了"
    );

}

const apps=

// ========================================

const WINCON_API_ALLOWED_ORIGIN =
    "https://ayatocraft.github.io";

const winconAPIWindows = new Map();


// ----------------------------------------
// API初期化
// ----------------------------------------

function initWinconAppAPI() {

    window.addEventListener(
        "message",
        handleWinconAppMessage
    );

    console.log(
        "[Wincon API] Ready"
    );
}


// ----------------------------------------
// Message受信
// ----------------------------------------

function handleWinconAppMessage(event) {

    if (
        event.origin !==
        WINCON_API_ALLOWED_ORIGIN
    ) {
        return;
    }

    const data = event.data;

    if (
        !data ||
        data.type !== "wincon"
    ) {
        return;
    }

    switch (data.action) {

        case "getApps":

            winconAPIGetApps(event);

            break;


        case "searchApps":

            winconAPISearchApps(
                event,
                data
            );

            break;


        case "openWindow":

            winconAPIOpenWindow(
                event,
                data
            );

            break;


        case "launchApp":

            winconAPILaunchApp(
                event,
                data
            );

            break;


        case "closeWindow":

            winconAPICloseWindow(
                event,
                data
            );

            break;


        case "setWindowTitle":

            winconAPISetWindowTitle(
                event,
                data
            );

            break;


        default:

            winconAPISend(
                event,
                "error",
                {
                    message:
                        "Unknown API action",
                    action:
                        data.action
                }
            );

    }

}


// ----------------------------------------
// APIレスポンス
// ----------------------------------------

function winconAPISend(
    event,
    action,
    data = {}
) {

    if (
        !event.source ||
        !event.source.postMessage
    ) {
        return;
    }

    event.source.postMessage(

        {
            type: "wincon",
            action,
            ...data
        },

        event.origin

    );

}


// ----------------------------------------
// App情報を作る
// ----------------------------------------

function winconAPIFormatApp(
    app,
    index
) {

    return {

        id:
            app.id ||
            app.appId ||
            app.title ||
            "app-" + index,

        title:
            app.title || "",

        icon:
            app.icon || "🌐",

        type:
            app.type || "app",

        popup:
            !!app.popup,

        system:
            !!app.system,

        enterprise:
            !!app.enterprise

    };

}


// ----------------------------------------
// App一覧
// ----------------------------------------

function winconAPIGetApps(event) {

    const apps =
        menuItems.map(
            winconAPIFormatApp
        );

    winconAPISend(
        event,
        "apps",
        {
            apps
        }
    );

}


// ----------------------------------------
// App検索
// ----------------------------------------

function winconAPISearchApps(
    event,
    data
) {

    const query =
        String(
            data.query || ""
        )
        .trim()
        .toLowerCase();


    const apps =
        menuItems

        .filter(app => {

            const title =
                String(
                    app.title || ""
                ).toLowerCase();

            const type =
                String(
                    app.type || ""
                ).toLowerCase();

            return (
                title.includes(query) ||
                type.includes(query)
            );

        })

        .map(
            winconAPIFormatApp
        );


    winconAPISend(
        event,
        "searchResults",
        {
            query,
            apps
        }
    );

}


// ----------------------------------------
// App起動
// ----------------------------------------

function winconAPILaunchApp(
    event,
    data
) {

    if (!data.appId) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "appId is required"
            }
        );

        return;

    }


    const app =
        menuItems.find(
            (item, index) => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id ===
                    data.appId
                );

            }
        );


    if (!app) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "App not found",

                appId:
                    data.appId
            }
        );

        return;

    }


    winconOpenAppAPI(app);


    winconAPISend(
        event,
        "launchResult",
        {
            success: true,

            appId:
                data.appId,

            title:
                app.title
        }
    );

}

// ----------------------------------------
// 外部HTML Windowを開く
// ----------------------------------------

function winconAPIOpenWindow(event, data) {

    if (!data.url) {

        winconAPISend(
            event,
            "error",
            {
                message: "url is required"
            }
        );

        return;
    }


    const windowId =
        "wincon-" +
        crypto.randomUUID();


    const separator =
        data.url.includes("?")
            ? "&"
            : "?";


    const finalURL =
        data.url +
        separator +
        "winconWindowId=" +
        encodeURIComponent(windowId);


    const win =
        createWindow({

            title:
                data.title ||
                "Wincon App",

            icon:
                data.icon ||
                "🌐",

            width:
                Number(data.width) ||
                800,

            height:
                Number(data.height) ||
                600,

            popup:
                data.popup === true ||
                data.windowType === "popup",

            content: `
                <iframe
                    src="${finalURL}"
                    style="
                        width:100%;
                        height:100%;
                        border:0;
                    "
                ></iframe>
            `

        });


    win.dataset.apiWindowId =
        windowId;


    winconAPIWindows.set(
        windowId,
        win
    );


    winconAPISend(
        event,
        "windowOpened",
        {
            success: true,
            windowId: windowId
        }
    );

}


// ----------------------------------------
// Windowを閉じる
// ----------------------------------------

function winconAPICloseWindow(
    event,
    data
) {

    const win =
        winconAPIWindows.get(
            data.windowId
        );


    if (!win) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "Window not found",

                windowId:
                    data.windowId
            }
        );

        return;

    }


    win.remove();


    winconAPIWindows.delete(
        data.windowId
    );


    winconAPISend(
        event,
        "windowClosed",
        {
            success: true,

            windowId:
                data.windowId
        }
    );

}


// ----------------------------------------
// Windowタイトル変更
// ----------------------------------------

function winconAPISetWindowTitle(
    event,
    data
) {

    const win =
        winconAPIWindows.get(
            data.windowId
        );


    if (!win) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "Window not found",

                windowId:
                    data.windowId
            }
        );

        return;

    }


    const title =
        data.title ||
        "Wincon App";


    win.dataset.title =
        title;


    const titleElement =
        win.querySelector(
            ".title-left div:last-child"
        );


    if (titleElement) {

        titleElement.textContent =
            title;

    }


    /*
     * タスクバーアイコンのタイトルも更新
     */

    const taskIcon =
        [...document.querySelectorAll(
            ".task-icon"
        )]
        .find(
            icon =>
                icon.title ===
                win.dataset.title
        );


    if (taskIcon) {

        taskIcon.title =
            title;

    }


    winconAPISend(
        event,
        "titleChanged",
        {
            success: true,

            windowId:
                data.windowId,

            title
        }
    );

}


// ----------------------------------------
// Wincon Windowが閉じられたときの後処理
// ----------------------------------------

function winconAPIForgetWindow(
    win
) {

    for (
        const [
            windowId,
            storedWindow
        ]
        of winconAPIWindows
    ) {

        if (
            storedWindow ===
            win
        ) {

            winconAPIWindows.delete(
                windowId
            );

            break;

        }

    }

}

        background: rgba(255,255,255,.06);
        color: white;
        text-align: left;
        cursor: pointer;
      }

      .winconAssistantApp:hover {
        background: rgba(255,255,255,.14);
      }

      .winconAssistantAppTitle {
        font-weight: 600;
      }

      .winconAssistantAppType {
        margin-top: 2px;
        font-size: 11px;
        opacity: .55;
      }

      .winconAssistantInputArea {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid rgba(255,255,255,.1);
        background: rgba(0,0,0,.12);
      }

      #winconAssistantInput {
        flex: 1;
        min-width: 0;
        height: 42px;
        box-sizing: border-box;
        padding: 0 14px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 21px;
        outline: none;
        background: rgba(255,255,255,.08);
        color: white;
        font-size: 14px;
      }

      #winconAssistantInput::placeholder {
        color: rgba(255,255,255,.45);
      }

      .winconAssistantButton {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,.09);
        color: white;
        cursor: pointer;
        font-size: 17px;
      }

      .winconAssistantButton:hover {
        background: rgba(255,255,255,.16);
      }

      .winconAssistantButton.listening {
        background: rgba(255,80,100,.5);
        box-shadow: 0 0 18px rgba(255,80,100,.4);
      }
    `;

    document.head.appendChild(style);

    assistant = document.createElement("div");
    assistant.id = "winconAssistant";

    assistant.innerHTML = `
      <div class="winconAssistantHeader">
        <div class="winconAssistantOrb"></div>

        <div class="winconAssistantTitle">
          <strong>Wincon Assistant</strong>
          <span>System Assistant</span>
        </div>

        <button
          class="winconAssistantClose"
          id="winconAssistantClose"
          title="閉じる"
        >×</button>
      </div>

      <div id="winconAssistantMessages"></div>

      <div class="winconAssistantInputArea">
        <button
          class="winconAssistantButton"
          id="winconAssistantMic"
          title="音声入力"
        >🎙</button>

        <input
          id="winconAssistantInput"
          type="text"
          autocomplete="off"
          placeholder="Winconに何をしてほしい？"
        >

        <button
          class="winconAssistantButton"
          id="winconAssistantSend"
          title="送信"
        >➤</button>
      </div>
    `;

    document.body.appendChild(assistant);

    document
      .getElementById("winconAssistantClose")
      .addEventListener("click", closeAssistant);

    document
      .getElementById("winconAssistantSend")
      .addEventListener("click", sendInput);

    document
      .getElementById("winconAssistantInput")
      .addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          sendInput();
        }
      });

    document
      .getElementById("winconAssistantMic")
      .addEventListener("click", startSpeechRecognition);

    addMessage(
      "こんにちは。Wincon Assistantです。アプリの検索や起動、ウィンドウ操作などができます。",
      "assistant"
    );
  }

  function searchApps(query) {
    if (
      window.winconAssistantAPI &&
      typeof window.winconAssistantAPI.searchApps === "function"
    ) {
      return window.winconAssistantAPI.searchApps(query);
    }

    return [];
  }

  function launchApp(app) {
    if (
      window.winconAssistantAPI &&
      typeof window.winconAssistantAPI.launchApp === "function"
    ) {
      return window.winconAssistantAPI.launchApp(app);
    }

    return false;
  }

  function showApps(apps) {
    var messages = document.getElementById("winconAssistantMessages");

    if (!messages) {
      return;
    }

    var container = document.createElement("div");
    container.className =
      "winconAssistantMessage assistant winconAssistantResults";

    if (!apps.length) {
      container.textContent = "該当するアプリが見つかりませんでした。";
      messages.appendChild(container);
      messages.scrollTop = messages.scrollHeight;
      speak("該当するアプリが見つかりませんでした。");
      return;
    }

    container.textContent = "見つかったアプリです。";

    apps.slice(0, 8).forEach(function (app) {
      var button = document.createElement("button");
      button.className = "winconAssistantApp";

      var title = document.createElement("div");
      title.className = "winconAssistantAppTitle";
      title.textContent = (app.icon || "🪟") + " " + (app.title || app.name || "アプリ");

      var type = document.createElement("div");
      type.className = "winconAssistantAppType";
      type.textContent = app.type || "application";

      button.appendChild(title);
      button.appendChild(type);

      button.addEventListener("click", function () {
        var ok = launchApp(app);

        if (ok) {
          addMessage(
            (app.title || app.name || "アプリ") + "を起動しました。",
            "assistant"
          );
        } else {
          addMessage("アプリを起動できませんでした。", "assistant");
        }
      });

      container.appendChild(button);
    });

    messages.appendChild(container);
    messages.scrollTop = messages.scrollHeight;
    speak("アプリを検索しました。");
  }

  function normalize(text) {
    return String(text || "")
      .trim()
      .toLowerCase()
      .replace(/[？?！!。．]/g, "");
  }

  function extractAppQuery(text) {
    return text
      .replace(/アプリを(開いて|ひらいて|起動して|起動)/g, "")
      .replace(/アプリ(を)?(検索|探して|さがして)/g, "")
      .replace(/開いて/g, "")
      .replace(/ひらいて/g, "")
      .replace(/起動して/g, "")
      .replace(/検索して/g, "")
      .replace(/探して/g, "")
      .replace(/さがして/g, "")
      .trim();
  }

  function handleCommand(rawText) {
    var text = normalize(rawText);

    if (!text) {
      return;
    }

    if (
      text === "閉じて" ||
      text === "閉じる" ||
      text === "アシスタントを閉じて" ||
      text === "終了"
    ) {
      closeAssistant();
      return;
    }

    if (
      text.includes("アプリ一覧") ||
      text.includes("アプリを一覧") ||
      text === "アプリ"
    ) {
      var allApps =
        window.winconAssistantAPI &&
        typeof window.winconAssistantAPI.getApps === "function"
          ? window.winconAssistantAPI.getApps()
          : [];

      showApps(allApps);
      return;
    }

    if (
      text.includes("アプリを開いて") ||
      text.includes("アプリをひらいて") ||
      text.includes("アプリを起動して") ||
      text.includes("アプリ開いて") ||
      text.includes("アプリ起動")
    ) {
      var appQuery = extractAppQuery(rawText);
      var results = searchApps(appQuery);

      if (results.length === 1) {
        var ok = launchApp(results[0]);

        addMessage(
          ok
            ? (results[0].title || results[0].name || "アプリ") + "を起動しました。"
            : "アプリを起動できませんでした。",
          "assistant"
        );

        return;
      }

      showApps(results);
      return;
    }

    if (
      text.includes("アプリを検索") ||
      text.includes("アプリ検索") ||
      text.includes("アプリを探して") ||
      text.includes("アプリをさがして")
    ) {
      var query = extractAppQuery(rawText);
      var found = searchApps(query);

      showApps(found);
      return;
    }

    if (
      text.includes("何時") ||
      text.includes("時間") ||
      text.includes("現在時刻")
    ) {
      var now = new Date();

      var timeText =
        "現在は " +
        now.getHours() +
        "時" +
        String(now.getMinutes()).padStart(2, "0") +
        "分です。";

      addMessage(timeText, "assistant");
      return;
    }

    if (
      text.includes("ヘルプ") ||
      text.includes("何ができる") ||
      text.includes("できること")
    ) {
      addMessage(
        "アプリの検索・起動、アプリ一覧、時刻の確認などに対応しています。",
        "assistant"
      );
      return;
    }

    if (
      text.includes("再読み込み") ||
      text.includes("リロード")
    ) {
      addMessage("Winconを再読み込みします。", "assistant");

      setTimeout(function () {
        location.reload();
      }, 800);

      return;
    }

    var generalResults = searchApps(rawText);

    if (generalResults.length === 1) {
      addMessage(
        "「" +
          (generalResults[0].title ||
            generalResults[0].name ||
            "アプリ") +
          "」が見つかりました。",
        "assistant"
      );

      return;
    }

    if (generalResults.length > 1) {
      showApps(generalResults);
      return;
    }

    addMessage(
      "すみません、その操作にはまだ対応していません。「アプリを検索して」のように指定してみてください。",
      "assistant"
    );
  }

  function sendInput() {
    var input = document.getElementById("winconAssistantInput");

    if (!input) {
      return;
    }

    var text = input.value.trim();

    if (!text) {
      return;
    }

    input.value = "";

    addMessage(text, "user");
    handleCommand(text);
  }

  function startSpeechRecognition() {
    var Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!Recognition) {
      addMessage(
        "このブラウザでは音声入力に対応していません。ChromeまたはEdgeを試してください。",
        "assistant"
      );
      return;
    }

    if (listening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new Recognition();

    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      listening = true;

      var mic = document.getElementById("winconAssistantMic");

      if (mic) {
        mic.classList.add("listening");
        mic.textContent = "●";
      }
    };

    recognition.onresult = function (event) {
      var result = event.results[0][0].transcript;

      var input = document.getElementById("winconAssistantInput");

      if (input) {
        input.value = result;
      }

      sendInput();
    };

    recognition.onerror = function (event) {
      if (event.error === "not-allowed") {
        addMessage(
          "マイクの使用が許可されていません。ブラウザのサイト設定からマイクを許可してください。",
          "assistant"
        );
      }
    };

    recognition.onend = function () {
      listening = false;

      var mic = document.getElementById("winconAssistantMic");

      if (mic) {
        mic.classList.remove("listening");
        mic.textContent = "🎙";
      }
    };

    try {
      recognition.start();
    } catch (error) {
      listening = false;
    }
  }

  window.toggleWinconAssistant = function () {
    if (!assistant) {
      createAssistant();
    }

    if (assistant.classList.contains("show")) {
      closeAssistant();
    } else {
      openAssistant();
    }
  };

  window.openWinconAssistant = openAssistant;
  window.closeWinconAssistant = closeAssistant;

  

  window.addEventListener("load", function () {
    createAssistant();
  });
})();
// ========================================
// Wincon UAC - Stable
// ========================================

let winconUACResolve = null;
let winconUACActive = false;


// ----------------------------------------
// UACを表示
// ----------------------------------------

function requestWinconUAC(options = {}) {

    const overlay =
        document.getElementById(
            "winconUACOverlay"
        );

    if (!overlay) {

        console.error(
            "[Wincon UAC] Overlay not found"
        );

        return Promise.resolve(false);
    }


    // 既に表示中なら拒否
    if (winconUACActive) {

        return Promise.resolve(false);
    }


    winconUACActive = true;


    const appName =
        document.getElementById(
            "winconUACAppName"
        );

    const appIcon =
        document.getElementById(
            "winconUACIcon"
        );

    const description =
        document.getElementById(
            "winconUACDescription"
        );


    if (appName) {

        appName.textContent =
            options.title ||
            "不明なアプリ";

    }


    if (appIcon) {

        appIcon.textContent =
            options.icon ||
            "🛡️";

    }


    if (description) {

        description.textContent =
            options.description ||
            "このアプリはWinconに変更を加えようとしています。";

    }


    overlay.classList.add(
        "show"
    );


    return new Promise(resolve => {

        winconUACResolve =
            resolve;

    });

}


// ----------------------------------------
// UACを閉じる
// ----------------------------------------

function closeWinconUAC(result = false) {

    const overlay =
        document.getElementById(
            "winconUACOverlay"
        );


    if (overlay) {

        overlay.classList.remove(
            "show"
        );

    }


    winconUACActive = false;


    if (typeof winconUACResolve === "function") {

        const resolve =
            winconUACResolve;


        winconUACResolve =
            null;


        resolve(
            result
        );

    }

}


// ----------------------------------------
// UACボタン初期化
// ----------------------------------------

function setupWinconUAC() {

    const allow =
        document.getElementById(
            "winconUACAllow"
        );

    const deny =
        document.getElementById(
            "winconUACDeny"
        );


    if (allow) {

        allow.addEventListener(
            "click",
            () => {

                closeWinconUAC(
                    true
                );

            }
        );

    }


    if (deny) {

        deny.addEventListener(
            "click",
            () => {

                closeWinconUAC(
                    false
                );

            }
        );

    }

}


// ----------------------------------------
// DOM読み込み後に初期化
// ----------------------------------------

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setupWinconUAC();

        console.log(
            "[Wincon UAC] Stable Ready"
        );

    }
);
