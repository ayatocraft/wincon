    /* =====================================================
       renderMenu Hook
    ===================================================== */

    function installMenuSupport() {

        /*
         * 既存renderMenuを置き換えず、
         * menuItemsのtypeを既存switchへ追加できる
         * ようにクリックイベントを後付けする。
         */

        const originalRender =
            window.renderMenu;

        if (
            typeof originalRender !==
            "function"
        ) {
            console.warn(
                "[Wincon TV] renderMenuが見つかりません"
            );

            return;
        }

        window.renderMenu =
            function() {

                originalRender();

                const elements =
                    document.querySelectorAll(
                        "#menu .menu-item"
                    );

                elements.forEach(element => {

                    const title =
                        element.textContent.trim();

                    if (
                        title.includes(
                            "TVモード"
                        )
                    ) {

                        element.onclick = null;

                        element.addEventListener(
                            "click",
                            () => {

                                const menu =
                                    document.getElementById(
                                        "menu"
                                    );

                                if (menu) {
                                    menu.style.display =
                                        "none";
                                }

                                openTVMode();

                            }
                        );

                    }

                    if (
                        title.includes(
                            "キーマップ"
                        )
                    ) {

                        element.onclick = null;

                        element.addEventListener(
                            "click",
                            () => {

                                openTVKeyMapModule();

                            }
                        );

                    }

                });

            };

    }


    /* =====================================================
       openAppCommand Support
    ===================================================== */

    /*
     * 既存openAppCommandに
     * TV / keymapを認識させる。
     */

    function installCommandSupport() {

        if (
            typeof window.openAppCommand !==
            "function"
        ) {
            return;
        }

        const original =
            window.openAppCommand;

        window.openAppCommand =
            function(
                appName,
                popupOverride
            ) {

                const item =
                    menuItems.find(
                        x =>
                            x &&
                            x.title ===
                            appName
                    );

                if (item) {

                    if (
                        item.type === "tv"
                    ) {

                        openTVMode();
                        return;
                    }

                    if (
                        item.type === "keymap"
                    ) {

                        openTVKeyMapModule();
                        return;
                    }

                }

                return original.apply(
                    this,
                    arguments
                );

            };

    }


    /* =====================================================
       Public API
    ===================================================== */

    window.WinconTV = {

        open() {
            openTVMode();
        },

        close() {
            closeTVMode();
        },

        isActive() {
            return tvState.active;
        },

        getKeyMap() {
            return {
                ...tvKeyMap
            };
        },

        setKeyMap(action, key) {

            if (
                !Object.prototype.hasOwnProperty.call(
                    DEFAULT_KEYMAP,
                    action
                )
            ) {
                return false;
            }

            tvKeyMap[action] = key;

            saveKeyMap();

            return true;
        },

        resetKeyMap() {

            tvKeyMap = {
                ...DEFAULT_KEYMAP
            };

            saveKeyMap();

        }

    };


    /* =====================================================
       Init
    ===================================================== */

    installCSS();

    registerKeyMapModule();

    registerTVModule();

    installMenuSupport();

    installCommandSupport();

    /*
     * menuItems追加後に既存Menuを再描画
     */

    if (
        typeof window.renderMenu ===
        "function"
    ) {
        window.renderMenu();
    }

    console.log(
        "[Wincon TV] TV Mode / Key Map initialized"
    );

})();




function showWinconNotification(title, message, duration = 3500) {

    let layer =
        document.getElementById(
            "winconNotificationLayer"
        );

    if (!layer) {

        layer = document.createElement("div");

        layer.id =
            "winconNotificationLayer";

        document.body.appendChild(layer);
    }

    /*
     * TVモードなどで別のコンテナの中に
     * 入ってしまっていても、必ずbody直下へ戻す
     */
    if (layer.parentElement !== document.body) {
        document.body.appendChild(layer);
    }

    /*
     * 念のためDOM上でも最後尾へ移動
     */
    document.body.appendChild(layer);

    const notification =
        document.createElement("div");

    notification.className =
        "wincon-notification";

    const titleElement =
        document.createElement("div");

    titleElement.className =
        "wincon-notification-title";

    titleElement.textContent =
        title || "Wincon";

    const messageElement =
        document.createElement("div");

    messageElement.className =
        "wincon-notification-message";

    messageElement.textContent =
        message || "";

    notification.appendChild(
        titleElement
    );

    notification.appendChild(
        messageElement
    );

    layer.appendChild(
        notification
    );

    requestAnimationFrame(() => {
        notification.classList.add(
            "visible"
        );
    });

    setTimeout(() => {

        notification.classList.add(
            "removing"
        );

        setTimeout(() => {

            if (notification.parentNode) {
                notification.remove();
            }

        }, 250);

    }, duration);
}

/* =========================================================
   WINCON 12 Horizon

   ---------------------------------------------------------
   TV Mode       : existing implementation
   Key Map       : existing implementation

========================================================= */

(function Wincon10HorizonLayer(){

"use strict";


/* =========================================================
   VERSION
========================================================= */

const WINCON10_VERSION = "12";
const WINCON10_CODENAME = "Horizon";

window.Wincon10 =
    window.Wincon10 || {};

window.Wincon10.version =
    WINCON10_VERSION;

window.Wincon10.codename =
    WINCON10_CODENAME;


/* =========================================================
   STORAGE
========================================================= */

const Horizon_KEYS = {

    oobeCompleted:
        "wincon10_oobe_completed",

    user:
        "wincon10_user",

    session:
        "wincon10_session",

    settings:
        "wincon10_settings"

};


const DEFAULT_Horizon_SETTINGS = {

    language:
        "ja-JP",

    notifications:
        true,

    startupMode:
        "desktop"

};


/* =========================================================
   SAFE STORAGE
========================================================= */

function astRead(
    key,
    fallback = null
){

    try{

        const raw =
            localStorage.getItem(
                key
            );

        if(
            raw === null ||
            raw === ""
        ){

            return fallback;

        }

        return JSON.parse(
            raw
        );

    }catch(e){

        console.warn(
            "[Horizon] storage read failed",
            key,
            e
        );

        return fallback;

    }

}


function astWrite(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(
                value
            )
        );

        return true;

    }catch(e){

        console.error(
            "[Horizon] storage write failed",
            key,
            e
        );

        return false;

    }

}


/* =========================================================
   SETTINGS
========================================================= */

function getHorizonSettings(){

    const saved =
        astRead(
            Horizon_KEYS.settings,
            null
        );

    if(
        !saved ||
        typeof saved !==
        "object"
    ){

        astWrite(
            Horizon_KEYS.settings,
            {
                ...DEFAULT_Horizon_SETTINGS
            }
        );

        return {
            ...DEFAULT_Horizon_SETTINGS
        };

    }

    return {

        ...DEFAULT_Horizon_SETTINGS,

        ...saved

    };

}


function saveHorizonSettings(
    settings
){

    astWrite(
        Horizon_KEYS.settings,
        {
            ...DEFAULT_Horizon_SETTINGS,
            ...(settings || {})
        }
    );

}


/* =========================================================
   USER / SESSION
========================================================= */

const HORIZON_USERS_KEY="wincon12_users";
const HORIZON_SELECTED_USER_KEY="wincon12_selected_user";

function getHorizonUsers(){
    let users=astRead(HORIZON_USERS_KEY,[]);
    if(!Array.isArray(users))users=[];
    const legacy=astRead(Horizon_KEYS.user,null);
    if(legacy&&legacy.id&&!users.some(u=>u&&u.id===legacy.id)){
        users.push(legacy);
        astWrite(HORIZON_USERS_KEY,users);
    }
    return users.filter(u=>u&&u.id);
}

function saveHorizonUsers(users){
    const clean=Array.isArray(users)?users.filter(u=>u&&u.id):[];
    astWrite(HORIZON_USERS_KEY,clean);
    return clean;
}

function getHorizonUser(){
    const users=getHorizonUsers();
    const session=astRead(Horizon_KEYS.session,null);
    const selectedId=(session&&session.userId)||localStorage.getItem(HORIZON_SELECTED_USER_KEY);
    if(selectedId){
        const selected=users.find(u=>u.id===selectedId);
        if(selected)return selected;
    }
    const legacy=astRead(Horizon_KEYS.user,null);
    if(legacy&&legacy.id)return users.find(u=>u.id===legacy.id)||legacy;
    return users[0]||null;
}

function getHorizonSession(){

    return astRead(
        Horizon_KEYS.session,
        null
    );

}


function isHorizonLoggedIn(){

    const session =
        getHorizonSession();

    const user =
        getHorizonUser();

    return !!(
        session &&
        user &&
        session.userId ===
        user.id
    );

}


function createHorizonUser(
    username,
    passwordHash,
    extra={}
){
    const user={
        id:"usr_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8),
        name:String(username||"ユーザー").trim(),
        passwordHash:passwordHash||null,
        createdAt:new Date().toISOString(),
        version:1,
        ...(extra||{})
    };
    const users=getHorizonUsers();
    users.push(user);
    saveHorizonUsers(users);
    astWrite(Horizon_KEYS.user,user);
    try{localStorage.setItem(HORIZON_SELECTED_USER_KEY,user.id);}catch(_){}
    return user;
}

function updateHorizonUser(patch){
    const user=getHorizonUser();
    if(!user)return null;
    const updated={...user,...(patch||{}),id:user.id};
    const users=getHorizonUsers();
    const index=users.findIndex(u=>u.id===user.id);
    if(index>=0)users[index]=updated;else users.push(updated);
    saveHorizonUsers(users);
    astWrite(Horizon_KEYS.user,updated);
    return updated;
}


function loginHorizon(
    user
){

    if(!user){
        return false;
    }

    astWrite(
        Horizon_KEYS.session,
        {
            userId:user.id,
            loginAt:new Date().toISOString()
        }
    );
    try{window.__WINCON12_ACTIVATE_STORAGE_SCOPE__?.(user.id);sessionStorage.setItem('wincon12_storage_scope',user.id);}catch(_){}
    try{
        localStorage.setItem(HORIZON_SELECTED_USER_KEY,user.id);
        astWrite(Horizon_KEYS.user,user);
    }catch(_){}
    return true;

}

    try{sessionStorage.removeItem('wincon12_storage_scope');}catch(_){}

/* =========================================================
   PASSWORD HASH
========================================================= */

function bytesToHex(
    bytes
){

    return Array
        .from(bytes)
        .map(
            b =>
                b.toString(16)
                    .padStart(
                        2,
                        "0"
                    )
        )
        .join("");

}


function hexToBytes(
    hex
){

    const result =
        new Uint8Array(
            hex.length / 2
        );

    for(
        let i = 0;
        i < hex.length;
        i += 2
    ){

        result[i / 2] =
            parseInt(
                hex.slice(
                    i,
                    i + 2
                ),
                16
            );

    }

    return result;

}


async function hashPassword(
    password,
    salt
){

    const encoder =
        new TextEncoder();

    const passwordBytes =
        encoder.encode(
            password
        );

    const key =
        await crypto.subtle.importKey(
            "raw",
            passwordBytes,
            {
                name:
                    "PBKDF2"
            },
            false,
            [
                "deriveBits"
            ]
        );

    const bits =
        await crypto.subtle.deriveBits(
            {

                name:
                    "PBKDF2",

                salt:
                    salt,

                iterations:
                    120000,

                hash:
                    "SHA-256"

            },
            key,
            256
        );

    return bytesToHex(
        new Uint8Array(
            bits
        )
    );

}


async function createPasswordRecord(
    password
){

    if(
        !password
    ){

        return null;

    }

    const salt =
        crypto.getRandomValues(
            new Uint8Array(
                16
            )
        );

    const hash =
        await hashPassword(
            password,
            salt
        );

    return {

        algorithm:
            "PBKDF2-SHA256",

        iterations:
            120000,

        salt:
            bytesToHex(
                salt
            ),

        hash:
            hash

    };

}


async function verifyPassword(
    password,
    record
){

    if(
        !record ||
        !record.salt ||
        !record.hash
    ){

        return false;

    }

    try{

        const salt =
            hexToBytes(
                record.salt
            );

        const hash =
            await hashPassword(
                password,
                salt
            );

        return (
            hash ===
            record.hash
        );

    }catch(e){

        console.error(
            "[Horizon] password verification failed",
            e
        );

        return false;

    }

}

function escapeHorizonHTML(

){

        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(

    )

    );

}

async function loadOOBEDefaultApps(){
 const list=document.getElementById("w12OobeAppsList");
 if(!list)return;
 list.textContent="Supabaseからアプリ情報を取得しています...";
 try{
  const endpoint=(typeof MODULE_API!=="undefined"&&MODULE_API)?MODULE_API:"https://tjyyqwihwgxdjpzgccyc.supabase.co/functions/v1/quick-worker";
  const response=await fetch(endpoint,{method:"GET",cache:"no-store",headers:{"Accept":"application/json"}});
  if(!response.ok)throw new Error("Supabase Edge Function HTTP "+response.status);
  const json=await response.json();
  if(json&&((json.success===false)||json.error))throw new Error(typeof json.error==="string"?json.error:JSON.stringify(json.error||json));
  const rows=Array.isArray(json)?json:(Array.isArray(json?.data)?json.data:(Array.isArray(json?.apps)?json.apps:(Array.isArray(json?.result)?json.result:[])));
  if(!rows.length){
   const detail=json&&typeof json==="object"?JSON.stringify(json).slice(0,260):String(json);

  }
  oobeAvailableModules=rows.map(raw=>{
   const id=raw?.id??raw?.app_id??raw?.appId??raw?.uuid;
   const title=raw?.title??raw?.name??raw?.app_name??"名称未設定";
   const source=raw?.source??raw?.url??raw?.app_url??raw?.link??raw?.html_url??"";
   return {...raw,id,title,source,

    description:raw?.description??raw?.summary??"",

   };
  }).filter(app=>app.id!==undefined&&app.id!==null&&String(app.source).trim());
  window.storeApps=oobeAvailableModules;
  if(!list.isConnected)return;
  list.replaceChildren();
  if(!oobeAvailableModules.length){list.textContent="Supabaseにはアプリ情報がありますが、インストール可能なURL付きアプリがありません。";return;}

   const label=document.createElement("label");label.className="w12-oobe-app";
   const input=document.createElement("input");input.type="checkbox";input.value=String(app.id);input.checked=(oobeData.defaultApps||[]).includes(String(app.id));
   input.addEventListener("change",()=>{const id=String(app.id);oobeData.defaultApps=input.checked?[...new Set([...(oobeData.defaultApps||[]),id])]:oobeData.defaultApps.filter(x=>x!==id);});
   const icon=document.createElement("span");icon.className="w12-oobe-app-icon";
   if(app.iconImage){const img=document.createElement("img");img.src=app.iconImage;img.alt="";img.onerror=()=>{icon.textContent=app.icon||"📦";};icon.appendChild(img);}else icon.textContent=app.icon||"📦";
   const details=document.createElement("span");details.className="w12-oobe-app-details";
   const title=document.createElement("b");title.textContent=app.title||"名称未設定";
   const desc=document.createElement("small");desc.textContent=app.description||"";
   details.append(title,desc);label.append(input,icon,details);list.appendChild(label);
  }
 }catch(error){
  console.warn("[OOBE] Supabase Module Center load failed",error);
  if(!list.isConnected)return;
  list.replaceChildren();
  const message=document.createElement("p");message.textContent="SupabaseからModule Centerの情報を取得できませんでした。"+(error?.message?"\n"+error.message:"");
  const retry=document.createElement("button");retry.type="button";retry.className="wincon10-oobe-button secondary";retry.textContent="再読み込み";retry.onclick=()=>loadOOBEDefaultApps();

 if(next)next.onclick=async()=>{if(!validateHorizonOOBEStep())return;if(oobeFlow[oobeStep]==="restart"){await finishHorizonOOBE();return;}if(oobeFlow[oobeStep]==="waiting")return;oobeStep=Math.min(oobeStep+1,oobeFlow.length-1);renderHorizonOOBEStep();};

function validateHorizonOOBEStep(){

  const p=document.getElementById("wincon10Password")?.value||"";const c=document.getElementById("wincon10PasswordConfirm")?.value||"";

/* =========================================================
   PASSKEY
========================================================= */

async function tryCreateHorizonPasskey(
    user
){

    if(
        !window.PublicKeyCredential
    ){

        return false;

    }


    try{

        const challenge =
            crypto.getRandomValues(
                new Uint8Array(
                    32
                )
            );


        const userId =
            new TextEncoder().encode(
                user.id
            );


        const credential =
            await navigator.credentials.create({

                publicKey: {

                    challenge:

                        challenge,

                    rp: {

                        name:
                            "Wincon 12 Horizon"

                    },

                    user: {

                        id:
                            userId,

                        name:
                            user.name,

                        displayName:
                            user.name

                    },

                    pubKeyCredParams: [

                        {
                            type:
                                "public-key",

                            alg:
                                -7

                        },

                        {
                            type:
                                "public-key",

                            alg:
                                -257

                        }

                    ],

                    authenticatorSelection: {

                        residentKey:
                            "preferred",

                        userVerification:
                            "preferred"

                    },

                    timeout:
                        60000,

                    attestation:
                        "none"

                }

            });


        if(!credential){

            return false;

        }


        const updated =
            updateHorizonUser({

                passkey:
                    true,

                passkeyCredentialId:
                    btoa(
                        String.fromCharCode(
                            ...new Uint8Array(
                                credential.rawId
                            )
                        )
                    )

            });


        return !!updated;

    }catch(e){

        console.warn(
            "[Horizon] Passkey setup unavailable or cancelled",
            e
        );

        return false;

    }

}

async function finishHorizonOOBE(){
 if(oobeWaitTimer){clearInterval(oobeWaitTimer);oobeWaitTimer=null;}
 const main=document.getElementById("wincon10OOBEMain");if(main)main.innerHTML='<div class="w12-oobe-wait"><div class="w12-oobe-spinner"></div><h2>設定を保存しています</h2><p>Winconを再起動する準備をしています...</p></div>';

 try{
  let passwordHash;
  const existing=getHorizonUser();
  if(oobeFlow.includes("password")){
   if(oobeData.passwordSkip)passwordHash=null;
   else if(oobeData.password)passwordHash=await createPasswordRecord(oobeData.password);
  }else if(existing)passwordHash=existing.passwordHash;
  let user=existing;
  if(!user){user=createHorizonUser(oobeData.username,passwordHash);}
  else{
   const patch={};if(oobeFlow.includes("user"))patch.name=oobeData.username;if(oobeFlow.includes("password"))patch.passwordHash=passwordHash;user=updateHorizonUser(patch)||user;
  }
  if(oobeData.icon)user=updateHorizonUser({icon:oobeData.icon})||user;
  saveHorizonSettings({...getHorizonSettings(),language:oobeData.language||"ja-JP"});

  const selected=new Set((oobeData.defaultApps||[]).map(String));

   const apps=oobeAvailableModules.length?oobeAvailableModules:(Array.isArray(window.storeApps)?window.storeApps:[]);
   for(const app of apps){
    if(!selected.has(String(app.id))||!app.source)continue;

   }

  localStorage.setItem("wincon12_oobe_password_configured","1");
  astWrite(Horizon_KEYS.oobeCompleted,true);
  astWrite("wincon12_oobe_schema",2);
  loginHorizon(user);
  leaveHorizonIsolation();
  if(oobeWindow){oobeWindow.remove();oobeWindow=null;}
  setTimeout(()=>{if(typeof window.restartSystem==="function")window.restartSystem();else location.reload();},900);
 }catch(error){console.error("[OOBE] setup failed",error);if(main)main.innerHTML='<h2>セットアップに失敗しました</h2><p>'+escapeHorizonHTML(error.message||String(error))+'</p>';if(next){next.disabled=false;next.textContent="もう一度試す";}}
}

        const timeEl=overlay.querySelector("#w12LockTime");
        const dateEl=overlay.querySelector("#w12LockDate");
        const updateClock=()=>{
            const now=new Date();
            if(timeEl)timeEl.textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
            if(dateEl)dateEl.textContent=now.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
        };

        overlay.querySelectorAll("[data-user-id]").forEach(btn=>{

                selectedId=btn.dataset.userId;
                render();
            });
        });
        const password=overlay.querySelector("#wincon10LoginPassword");

        const login=async()=>{
            const current=users.find(u=>u.id===selectedId)||selected;
            const button=overlay.querySelector("#wincon10LoginButton");
            if(button)button.disabled=true;
            if(current.passwordHash){
                const valid=await verifyPassword(password?password.value:"",current.passwordHash);
                if(!valid){
                    if(error)error.textContent="パスワードが正しくありません。";
                    if(button)button.disabled=false;
                    password?.focus();
                    return;
                }
            }
            loginHorizon(current);
            continueHorizonAfterLogin();
        };
        overlay.querySelector("#wincon10LoginButton").onclick=login;
        password?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();login();}});
        overlay.querySelector("#wincon12GuestButton").onclick=()=>startHorizonGuestSession();
        overlay.querySelector("#w12LockShutdown").onclick=()=>window.Wincon10HorizonShutdown();
        overlay.querySelector("#w12LockRestart").onclick=()=>window.Wincon10HorizonRestart();
        overlay.querySelector("#w12LockReset").onclick=()=>window.Wincon10HorizonFactoryReset();
        overlay.querySelector("#w12LockAddUser").onclick=()=>openHorizonAddUserMini();
        if(password)setTimeout(()=>password.focus(),100);
    };
    render();
}

function readHorizonImage(file,maxWidth=1280,maxHeight=720){
    return new Promise((resolve,reject)=>{
        if(!file){resolve(null);return;}
        const reader=new FileReader();
        reader.onerror=()=>reject(reader.error||new Error("画像を読み込めません"));
        reader.onload=()=>{
            const img=new Image();
            img.onerror=()=>reject(new Error("画像形式を読み込めません"));
            img.onload=()=>{
                const scale=Math.min(1,maxWidth/img.width,maxHeight/img.height);
                const canvas=document.createElement("canvas");
                canvas.width=Math.max(1,Math.round(img.width*scale));
                canvas.height=Math.max(1,Math.round(img.height*scale));
                const ctx=canvas.getContext("2d");
                ctx.drawImage(img,0,0,canvas.width,canvas.height);
                resolve(canvas.toDataURL("image/jpeg",0.78));
            };
            img.src=reader.result;
        };
        reader.readAsDataURL(file);
    });
}

function installHorizonCommandHook(){

    if(
        window.__WINCON10_OOBE_COMMAND_HOOK__
    ){

        return;

    }


    if(
        typeof window.openAppCommand !==
        "function"
    ){

        return;

    }


    const original =
        window.openAppCommand;


    window.openAppCommand =
        function(
            args,
            print
        ){

            let appArgs =
                args;


            if(
                typeof args ===
                "string"
            ){

                appArgs =
                    args
                        .trim()
                        .split(/\s+/);

            }


            if(
                Array.isArray(
                    appArgs
                )
            ){

                const name =
                    appArgs
                        .slice(1)
                        .filter(
                            a =>
                                !a.startsWith(
                                    "type="
                                )
                        )
                        .join(" ");


                if(
                    name ===
                    "OOBE"
                ){

                    openHorizonOOBE(
                        false
                    );


                    if(
                        typeof print ===
                        "function"
                    ){

                        print(
                            "OOBE を起動"
                        );

                    }

                    return;

                }

            }


            return original.apply(
                this,
                arguments
            );

        };


    window.__WINCON10_OOBE_COMMAND_HOOK__ =
        true;

}


/* =========================================================
   PROCESS SCREEN
========================================================= */

function createHorizonProcessScreen(
    options = {}
){

    const {

        status:
            statusText =
                "Winconを起動しています...",

        substatus:
            substatusText =
                "",

        duration:
            durationValue =
                10000,

        onComplete:
            complete =
                null,

        minimumProgress:
            minimum =
                0,

        maximumProgress:
            maximum =
                100

    } = options;


    const oldProcess =
        document.getElementById(
            "wincon10HorizonProcess"
        );


    if(oldProcess){

        oldProcess.remove();

    }


    const legacyBoot =
        document.getElementById(
            "bootScreen"
        );


    if(legacyBoot){

        legacyBoot.remove();

    }


    const screen =
        document.createElement(
            "div"
        );


    screen.id =
        "wincon10HorizonProcess";


    screen.innerHTML = `

<div
    class="wincon10-Horizon-process-inner"
>

    <img
        src="wincon.png"
        class="wincon10-Horizon-logo"
        draggable="false"
        onerror="
            this.style.display='none';
        "
    >

    <div
        class="wincon10-Horizon-brand"
    >
        Wincon
    </div>

    <div
        class="wincon10-Horizon-version"
    >
        12 Horizon
    </div>

    <div
        class="wincon10-Horizon-progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
    >

        <div
            class="wincon10-Horizon-progress-bar"
            id="wincon10HorizonProgressBar"
        ></div>

    </div>

    <div
        class="wincon10-Horizon-status"
        id="wincon10HorizonStatus"
    >
        ${escapeHorizonHTML(
            statusText
        )}
    </div>

    ${
        substatusText
        ?
        `
        <div
            class="wincon10-Horizon-substatus"
        >
            ${escapeHorizonHTML(
                substatusText
            )}
        </div>
        `
        :
        ""
    }

</div>

`;


    document.body.appendChild(
        screen
    );

    // Horizon: logo only at first; progress bar appears one second later.
    const brand = screen.querySelector('.wincon10-Horizon-brand');
    const version = screen.querySelector('.wincon10-Horizon-version');
    const status = screen.querySelector('.wincon10-Horizon-status');
    const substatus = screen.querySelector('.wincon10-Horizon-substatus');
    const delayedProgress = screen.querySelector('.wincon10-Horizon-progress');
    [brand, version, status, substatus].forEach(node => { if(node) node.style.display='none'; });
    if(delayedProgress){ delayedProgress.style.opacity='0'; delayedProgress.style.transition='opacity .35s ease'; }
    setTimeout(()=>{ if(screen.isConnected && delayedProgress) delayedProgress.style.opacity='1'; },1000);


    const bar =
        document.getElementById(
            "wincon10HorizonProgressBar"
        );


    const progressRoot =
        screen.querySelector(
            ".wincon10-Horizon-progress"
        );


    const safeDuration =
        Math.max(
            1,
            Number(
                durationValue
            ) || 1
        );


    const min =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    minimum
                ) || 0
            )
        );


    const max =
        Math.max(
            min,
            Math.min(
                100,
                Number(
                    maximum
                ) || 100
            )
        );


    const start =
        performance.now();


    let completed =
        false;


    let frameId =
        null;


    function finish(){

        if(completed){

            return;

        }


        completed =
            true;


        if(
            frameId !== null
        ){

            cancelAnimationFrame(
                frameId
            );

        }


        if(bar){

            bar.style.width =
                max + "%";

        }


        if(progressRoot){

            progressRoot.setAttribute(
                "aria-valuenow",
                String(
                    max
                )
            );

        }


        if(
            typeof complete ===
            "function"
        ){

            complete();

        }

    }


    function update(
        now
    ){

        if(completed){

            return;

        }


        if(
            !screen.isConnected
        ){

            return;

        }


        const elapsed =
            Math.max(
                0,
                now - start
            );


        const ratio =
            Math.min(
                elapsed /
                safeDuration,
                1
            );


        const eased =
            ratio < 1
            ?
            1 -
            Math.pow(
                1 - ratio,
                1.05
            )
            :
            1;


        const value =
            min +
            (
                max - min
            ) *
            eased;


        if(bar){

            bar.style.width =
                value + "%";

        }


        if(progressRoot){

            progressRoot.setAttribute(
                "aria-valuenow",
                String(
                    Math.round(
                        value
                    )
                )
            );

        }


        if(
            ratio < 1
        ){

            frameId =
                requestAnimationFrame(
                    update
                );

        }else{

            finish();

        }

    }


    frameId =
        requestAnimationFrame(
            update
        );


    return screen;

}

/* =========================================================
   CORE BOOT GUARD
========================================================= */

function installHorizonCoreBootGuard(){

    if(
        window.__WINCON10_CORE_BOOT_GUARD__
    ){

        return;

    }


    if(
        typeof window.boot !==
        "function"
    ){

        return;

    }


    const originalBoot =
        window.boot;


    window.__WINCON10_ORIGINAL_BOOT__ =
        originalBoot;


    window.boot =
        function(){

            if(
                window.__WINCON10_CORE_BOOT_DONE__
            ){

                return;

            }


            window.__WINCON10_CORE_BOOT_DONE__ =
                true;


            return originalBoot.apply(
                this,
                arguments
            );

        };


    window.__WINCON10_CORE_BOOT_GUARD__ =
        true;

}


/* =========================================================
   CORE BOOT
========================================================= */

function runWinconCoreBootOnce(){

    installHorizonCoreBootGuard();


    const legacyBoot =
        document.getElementById(
            "bootScreen"
        );


    if(legacyBoot){

        legacyBoot.remove();

    }


    if(
        window.__WINCON10_CORE_BOOT_DONE__
    ){

        return;

    }


    if(
        typeof window.boot ===
        "function"
    ){

        window.boot();

    }

}

/* =========================================================
   BOOT FLOW
========================================================= */

function startHorizonBootFlow(){

    if(
        window.__WINCON10_BOOT_RUNNING__
    ){

        return;

    }


    window.__WINCON10_BOOT_RUNNING__ =
        true;


    installHorizonCSS();
    installHorizonProcessCSS();

    runWinconCoreBootOnce();

    registerHorizonOOBEModule();
    registerHorizonUserConfigModule();
    installHorizonCommandHook();


    const completed =
        astRead(
            Horizon_KEYS.oobeCompleted,
            false
        );


    const user =
        getHorizonUser();

    let hasExistingMenuData=false;
    try{const storedMenu=JSON.parse(localStorage.getItem("winconMenuItems")||"[]");hasExistingMenuData=Array.isArray(storedMenu)&&storedMenu.length>0;}catch(_){}
    const needsRepair=!!(completed&&user&&(
        ((!localStorage.getItem("wincon12_oobe_migration")||!localStorage.getItem("wincon12_oobe_defaults"))&&!hasExistingMenuData)||
        !user.name||
        !Object.prototype.hasOwnProperty.call(user,"passwordHash")
    ));

    if(
        !completed ||
        !user ||
        needsRepair
    ){

        createHorizonProcessScreen({

            status:
                "Wincon 12 Horizon を準備しています...",

            substatus:
                "初回セットアップ",

            duration:
                10000,

            onComplete(){

                const screen =
                    document.getElementById(
                        "wincon10HorizonProcess"
                    );

                if(screen){

                    screen.remove();

                }


                launchHorizonFirstBootOOBE();

            }

        });

        return;

    }


    createHorizonProcessScreen({

        status:
            "Winconを起動しています...",

        substatus:
            "Wincon 12 Horizon",

        duration:
            10000,

        onComplete(){

            const screen =
                document.getElementById(
                    "wincon10HorizonProcess"
                );

            if(screen){

                screen.remove();

            }


            showHorizonLogin();

        }

    });

}

/* =========================================================
   FACTORY RESET
========================================================= */

async function clearWinconOwnedStorage(){
    try{if(typeof window.__WINCON12_RAW_STORAGE_CLEAR__==='function')window.__WINCON12_RAW_STORAGE_CLEAR__();else localStorage.clear();}catch(_){}
    try{sessionStorage.clear();}catch(_){}
    const databases=["WinconAppearanceDB","WinconCameraDB","WinconHorizonDirectoryDB"];
    if(window.indexedDB&&typeof indexedDB.deleteDatabase==="function"){
        try{if(typeof indexedDB.databases==='function'){const all=await indexedDB.databases();for(const db of all){if(db.name&&!databases.includes(db.name))databases.push(db.name);}}}catch(_){}
        await Promise.all(databases.map(name=>new Promise(resolve=>{
            const req=indexedDB.deleteDatabase(name);
            req.onsuccess=req.onerror=req.onblocked=()=>resolve();
            setTimeout(resolve,2500);
        })));
    }
    if("caches" in window){
        try{
            const names=await caches.keys();
            await Promise.all(names.filter(name=>/wincon/i.test(name)).map(name=>caches.delete(name)));
        }catch(e){console.warn("[Wincon Reset] cache cleanup failed",e);}
    }
}

/* =========================================================
   LEGACY POWER COMMAND BRIDGE
========================================================= */

function installHorizonPowerCommandBridge(){

    if(
        window.__WINCON10_POWER_COMMAND_BRIDGE__
    ){

        return;

    }


    const originalShutdown =
        typeof window.shutdownSystem ===
        "function"
        ?
        window.shutdownSystem
        :
        null;


    const originalRestart =
        typeof window.restartSystem ===
        "function"
        ?
        window.restartSystem
        :
        null;


    const originalRecovery =
        typeof window.openRecovery ===
        "function"
        ?
        window.openRecovery
        :
        null;


    const originalReset =
        typeof window.resetSystem ===
        "function"
        ?
        window.resetSystem
        :
        null;


    window.__WINCON10_ORIGINAL_SHUTDOWN__ =
        originalShutdown;


    window.__WINCON10_ORIGINAL_RESTART__ =
        originalRestart;


    window.__WINCON10_ORIGINAL_RECOVERY__ =
        originalRecovery;


    window.__WINCON10_ORIGINAL_RESET__ =
        originalReset;


    window.shutdownSystem =
        function(){

            return window.Wincon10HorizonShutdown();

        };


    window.restartSystem =
        function(){

            return window.Wincon10HorizonRestart();

        };


    window.openRecovery =
        function(){

            if(
                window.__WINCON10_RECOVERY_INTERNAL__
            ){

                if(
                    originalRecovery
                ){

                    return originalRecovery.apply(
                        this,
                        arguments
                    );

                }

                return;

            }


            return window.Wincon10HorizonRecovery();

        };


    window.resetSystem =
        function(){

            return window.Wincon10HorizonFactoryReset();

        };


    window.__WINCON10_POWER_COMMAND_BRIDGE__ =
        true;

}


installHorizonPowerCommandBridge();

if(
    !window.__WINCON10_Horizon_BOOT_OBSERVER__
){

    const observer =
        new MutationObserver(
            mutations => {

                const process =
                    document.getElementById(
                        "wincon10HorizonProcess"
                    );


                if(!process){

                    return;

                }


                mutations.forEach(
                    mutation => {

                        mutation.addedNodes.forEach(
                            node => {

                                if(
                                    node.nodeType !==
                                    Node.ELEMENT_NODE
                                ){

                                    return;

                                }


                                if(
                                    node.id ===
                                    "bootScreen"
                                ){

                                    node.remove();

                                }


                                if(
                                    typeof node.querySelector ===
                                    "function"
                                ){

                                    const nested =
                                        node.querySelector(
                                            "#bootScreen"
                                        );


                                    if(nested){

                                        nested.remove();

                                    }

                                }

                            }
                        );

                    }
                );

            }
        );


    observer.observe(
        document.body,
        {
            childList:
                true,

            subtree:
                true
        }
    );


    window.__WINCON10_Horizon_BOOT_OBSERVER__ =
        observer;

}

(() => {
  'use strict';

  if (window.__WINCON_AA_V2__) return;
  window.__WINCON_AA_V2__ = true;

  const STORAGE_KEY = 'winconAccessibilityAppearance';
  const IMAGE_DB = 'WinconAppearanceDB';
  const IMAGE_STORE = 'backgroundImages';
  const MODULE_TITLE = 'アクセシビリティと外観';
  const MODULE_TYPE = 'winconAppearance';

  const defaults = {
    cornerMode: 'original',
    fontScale: 100,
    iconScale: 100,
    boldText: false,
    highContrast: false,
    focusIndicator: true,
    reduceMotion: false,
    transparency: true,
    blur: true,
    shadows: true,
    backgroundMode: 'original',
    backgroundColor: '#17191f',
    backgroundBlur: 0,
    backgroundOverlay: 0
  };

  let settings = loadSettings();
  let backgroundObjectURL = null;
  let imageDatabase = null;
  let menuObserver = null;
  let applyObserver = null;
  let originalRenderMenu = null;

  /* ------------------------------
     設定の読み書き
  ------------------------------ */

  function loadSettings() {
    try {
      return {
        ...defaults,
        ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')
      };
    } catch {
      return { ...defaults };
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch (error) {
      console.error('[Wincon Appearance] 設定保存エラー:', error);
    }
  }

  /* ------------------------------
     IndexedDB：画像保存
  ------------------------------ */

  function openImageDB() {
    if (imageDatabase) {
      return Promise.resolve(imageDatabase);
    }

    return new Promise((resolve, reject) => {
      const request = indexedDB.open(IMAGE_DB, 1);

      request.onupgradeneeded = () => {
        const db = request.result;

        if (!db.objectStoreNames.contains(IMAGE_STORE)) {
          db.createObjectStore(IMAGE_STORE);
        }
      };

      request.onsuccess = () => {
        imageDatabase = request.result;
        resolve(imageDatabase);
      };

      request.onerror = () => reject(request.error);
    });
  }

  async function saveBackgroundImage(blob) {
    const db = await openImageDB();

    return new Promise((resolve, reject) => {
      const transaction = db.transaction(IMAGE_STORE, 'readwrite');

      transaction.objectStore(IMAGE_STORE).put(blob, 'desktop');

      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  }

  async function loadBackgroundImage() {
    try {
      const db = await openImageDB();

      const blob = await new Promise((resolve, reject) => {
        const transaction = db.transaction(IMAGE_STORE, 'readonly');
        const request = transaction.objectStore(IMAGE_STORE).get('desktop');

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });

      if (!blob) return;

      if (backgroundObjectURL) {
        URL.revokeObjectURL(backgroundObjectURL);
      }

      backgroundObjectURL = URL.createObjectURL(blob);

      applyBackground();
    } catch (error) {
      console.error('[Wincon Appearance] 背景画像の読み込みエラー:', error);
    }
  }

  async function deleteBackgroundImage() {
    try {
      const db = await openImageDB();

      await new Promise((resolve, reject) => {
        const transaction = db.transaction(IMAGE_STORE, 'readwrite');

        transaction.objectStore(IMAGE_STORE).delete('desktop');

        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });

      if (backgroundObjectURL) {
        URL.revokeObjectURL(backgroundObjectURL);
        backgroundObjectURL = null;
      }

      applyBackground();
    } catch (error) {
      console.error('[Wincon Appearance] 背景画像の削除エラー:', error);
    }
  }

  /* ------------------------------
     背景の作成と適用
  ------------------------------ */

  function ensureBackgroundElements() {
    const desktop = document.getElementById('desktop');
    if (!desktop) return;

    let background = document.getElementById('wincon-aa-background');

    if (!background) {
      background = document.createElement('div');
      background.id = 'wincon-aa-background';

      desktop.prepend(background);
    }

    let overlay = document.getElementById('wincon-aa-overlay');

    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'wincon-aa-overlay';

      background.after(overlay);
    }
  }

  function applyBackground() {
    ensureBackgroundElements();

    const desktop = document.getElementById('desktop');
    const background = document.getElementById('wincon-aa-background');
    const overlay = document.getElementById('wincon-aa-overlay');

    if (!desktop || !background || !overlay) return;

    background.style.filter = 'none';
    background.style.backgroundImage = 'none';
    background.style.backgroundColor = 'transparent';

    overlay.style.opacity = String(
      Math.max(0, Math.min(80, Number(settings.backgroundOverlay) || 0)) / 100
    );

    const blur = Math.max(
      0,
      Math.min(20, Number(settings.backgroundBlur) || 0)
    );

    if (settings.backgroundMode === 'color') {
      background.style.backgroundColor =
        settings.backgroundColor || defaults.backgroundColor;

      background.style.filter = blur ? `blur(${blur}px)` : 'none';

    } else if (
      settings.backgroundMode === 'image' &&
      backgroundObjectURL
    ) {
      background.style.backgroundImage =
        `url("${backgroundObjectURL}")`;

      background.style.filter = blur ? `blur(${blur}px)` : 'none';

    } else {
      /*
       * 元の背景モードでは背景レイヤーを透明にする。
       * 元の#desktopの背景色・グラデーションを維持する。
       */
      background.style.backgroundColor = 'transparent';
      background.style.backgroundImage = 'none';
      background.style.filter = 'none';
    }

    /*
     * 元のデスクトップ背景は変更しない。
     * 画像・単色を選んだ場合だけ背景レイヤーを表示する。
     */
    background.style.visibility =
      settings.backgroundMode === 'original' ? 'hidden' : 'visible';
  }

  /* ------------------------------
     全設定の適用
  ------------------------------ */

  function applySettings() {
    const body = document.body;

    body.classList.toggle(
      'wincon-aa-square',
      settings.cornerMode === 'square'
    );

    body.classList.toggle('wincon-aa-bold', !!settings.boldText);
    body.classList.toggle('wincon-aa-contrast', !!settings.highContrast);
    body.classList.toggle('wincon-aa-focus', !!settings.focusIndicator);

    body.classList.toggle(
      'wincon-aa-reduce-motion',
      !!settings.reduceMotion
    );

    body.classList.toggle('wincon-aa-no-blur', !settings.blur);
    body.classList.toggle('wincon-aa-no-shadow', !settings.shadows);

    body.classList.toggle(
      'wincon-aa-no-transparency',
      !settings.transparency
    );

    const fontScale = Math.max(
      75,
      Math.min(150, Number(settings.fontScale) || 100)
    );

    const iconScale = Math.max(
      75,
      Math.min(150, Number(settings.iconScale) || 100)
    );

    /*
     * ウィンドウ・タスクバー・メニューの文字サイズを適用。
     * inline styleで指定して既存CSSに上書きされにくくする。
     */
    document.querySelectorAll(
      '#desktop .window, #menu, #taskbar, .control-center'
    ).forEach(element => {
      if (
        element.id === 'wincon-aa-background' ||
        element.id === 'wincon-aa-overlay'
      ) return;

      element.style.setProperty(
        'font-size',
        `${fontScale}%`,
        'important'
      );
    });

    /*
     * アイコンは既存レイアウトを壊さないよう、
     * font-sizeを使って拡大する。
     */
    document.querySelectorAll(
      '#desktop .window .title-left > div:first-child, ' +
      '#desktop .window .icon, ' +
      '#menu .menu-item'
    ).forEach(element => {
      element.style.setProperty(
        'font-size',
        `${iconScale}%`,
        'important'
      );
    });

    applyBackground();
    saveSettings();
  }

  /* ------------------------------
     設定画面のHTML
  ------------------------------ */

  function row(label, control) {
    return `
      <div class="aa-row">
        <label>${label}</label>
        ${control}
      </div>
    `;
  }

  function check(id, value) {
    return `
      <input type="checkbox" id="${id}" ${value ? 'checked' : ''}>
    `;
  }

  function slider(id, value, min, max, suffix = '%') {
    return `
      <input type="range" id="${id}"
        min="${min}" max="${max}" value="${value}">
      <span class="aa-value" data-value-for="${id}">
        ${value}${suffix}
      </span>
    `;
  }

  function buildPanelHTML() {
    return `

            </select>
          `)}

          ${row('文字サイズ',
            slider('fontScale', settings.fontScale, 75, 150))}

          ${row('アイコンサイズ',
            slider('iconScale', settings.iconScale, 75, 150))}

            check('transparency', settings.transparency))}

          ${row('ぼかし効果',
            check('blur', settings.blur))}

          ${row('影の効果',
            check('shadows', settings.shadows))}

        <section class="aa-section">

            check('boldText', settings.boldText))}

            check('highContrast', settings.highContrast))}

  /* ------------------------------
     設定画面のイベント
  ------------------------------ */

  function bindPanel(panel) {
    if (!panel || panel.dataset.aaBound === 'true') return;

    panel.dataset.aaBound = 'true';

    const ids = [
      'cornerMode',
      'fontScale',
      'iconScale',
      'transparency',
      'blur',
      'shadows',
      'reduceMotion',
      'backgroundMode',
      'backgroundColor',
      'backgroundBlur',
      'backgroundOverlay',
      'boldText',
      'highContrast',
      'focusIndicator'
    ];

    function readFields() {
      ids.forEach(id => {
        const element = panel.querySelector('#' + id);
        if (!element) return;

        if (element.type === 'checkbox') {
          settings[id] = element.checked;
        } else if (element.type === 'range') {
          settings[id] = Number(element.value);
        } else {
          settings[id] = element.value;
        }
      });
    }

    function update() {
      readFields();
      applySettings();
    }

    ids.forEach(id => {
      const element = panel.querySelector('#' + id);
      if (!element) return;

      element.addEventListener('input', () => {
        if (element.type === 'range') {
          const output = panel.querySelector(
            `[data-value-for="${id}"]`
          );

          if (output) {
            output.textContent =
              element.value + (id === 'backgroundBlur' ? 'px' : '%');
          }
        }

        update();
      });

      element.addEventListener('change', update);
    });

    const fileInput = panel.querySelector('#backgroundFile');

    if (fileInput) {
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        const status = panel.querySelector('#backgroundStatus');

        if (!file.type.startsWith('image/')) {
          if (status) status.textContent = '画像ファイルを選択してください。';
          fileInput.value = '';
          return;
        }

        if (status) status.textContent = '画像を保存しています…';

        try {
          await saveBackgroundImage(file);

          if (backgroundObjectURL) {
            URL.revokeObjectURL(backgroundObjectURL);
          }

          backgroundObjectURL = URL.createObjectURL(file);
          settings.backgroundMode = 'image';

          const mode = panel.querySelector('#backgroundMode');
          if (mode) mode.value = 'image';

          applySettings();

          if (status) {
            status.textContent = `保存しました：${file.name}`;
          }
        } catch (error) {
          console.error(error);

          if (status) {
            status.textContent =
              '画像を保存できませんでした。別の画像をお試しください。';
          }
        }

        fileInput.value = '';
      });
    }

    const removeButton = panel.querySelector('#removeBackgroundImage');

    if (removeButton) {
      removeButton.addEventListener('click', async () => {
        await deleteBackgroundImage();

        settings.backgroundMode = 'original';

        const mode = panel.querySelector('#backgroundMode');
        if (mode) mode.value = 'original';

        applySettings();

        const status = panel.querySelector('#backgroundStatus');
        if (status) status.textContent = 'アップロード画像を削除しました。';
      });
    }

    const resetButton = panel.querySelector('#aaReset');

    if (resetButton) {
      resetButton.addEventListener('click', () => {
        settings = { ...defaults };

        /*
         * 初期設定への復帰では画像ファイル自体は削除しない。
         * 背景設定だけ元に戻す。
         */
        applySettings();

        panel.querySelectorAll('input, select').forEach(element => {
          const key = element.id;

          if (!(key in settings)) return;

          if (element.type === 'checkbox') {
            element.checked = !!settings[key];
          } else if (element.type === 'range') {
            element.value = settings[key];

            const output = panel.querySelector(
              `[data-value-for="${key}"]`
            );

            if (output) {
              output.textContent =
                settings[key] + (key === 'backgroundBlur' ? 'px' : '%');
            }
          } else if (element.type !== 'file') {
            element.value = settings[key];
          }
        });
      });
    }

    const mode = panel.querySelector('#backgroundMode');
    if (mode) mode.value = settings.backgroundMode;
  }

  /* ------------------------------
     アプリを開く
  ------------------------------ */

  function openAppearanceAccessibility() {
    if (typeof window.createWindow !== 'function') {
      alert('Winconのウィンドウ機能がまだ起動していません。');
      return;
    }

    const existing = [...document.querySelectorAll('#desktop .window')]
      .find(win => win.dataset.winconAaWindow === 'true');

    if (existing) {
      existing.style.display = '';
      existing.style.zIndex = String(Date.now());
      return;
    }

    const before = new Set(
      document.querySelectorAll('#desktop .window')
    );

    window.createWindow({
      title: MODULE_TITLE,
      icon: '🎨',
      width: 760,
      height: 700,
      content: buildPanelHTML()
    });

    const created = [...document.querySelectorAll('#desktop .window')]
      .find(win => !before.has(win));

    if (!created) {
      console.error(
        '[Wincon Appearance] ウィンドウを作成できませんでした。'
      );
      return;
    }

    created.dataset.winconAaWindow = 'true';

    const content = created.querySelector('.content') || created;

    bindPanel(content);
    applySettings();
  }

  /* ------------------------------
     既存MenuItemへ登録
  ------------------------------ */

  function registerMenuItem() {
    /*
     * menuItemsは元HTMLで定義されている既存の配列を使用する。
     * 別のメニューを作らず、通常のMenuItemとして登録する。
     */
    if (typeof menuItems === 'undefined' || !Array.isArray(menuItems)) {
      return false;
    }

    const alreadyExists = menuItems.some(item =>
      item.type === MODULE_TYPE || item.title === MODULE_TITLE
    );

    if (!alreadyExists) {
      menuItems.push({
        title: MODULE_TITLE,
        icon: '🎨',
        type: MODULE_TYPE,
        system: true
      });
    }

    /*
     * 元のrenderMenu()を利用してボタンを描画し、
     * 対象のボタンのクリック処理だけ差し替える。
     */
    if (typeof renderMenu === 'function' && !originalRenderMenu) {
      originalRenderMenu = renderMenu;

      window.renderMenu = function (...args) {
        const result = originalRenderMenu.apply(this, args);

        setTimeout(patchAppearanceMenuButton, 0);

        return result;
      };

      /*
       * グローバル関数の差し替えが反映されるよう、
       * 元の描画関数も直接実行する。
       */
      try {
        renderMenu();
      } catch (error) {
        console.warn('[Wincon Appearance] メニュー描画:', error);
      }
    }

    patchAppearanceMenuButton();

    return true;
  }

  function patchAppearanceMenuButton() {
    const menu = document.getElementById('menu');
    if (!menu) return;

    const buttons = menu.querySelectorAll('.menu-item');

    buttons.forEach(button => {
      if (!button.textContent.includes(MODULE_TITLE)) return;

      if (button.dataset.aaPatched === 'true') return;

      button.dataset.aaPatched = 'true';

      button.onclick = event => {
        event.preventDefault();
        event.stopPropagation();

        menu.style.display = 'none';

        openAppearanceAccessibility();
      };
    });
  }

  /* ------------------------------
     初期化
  ------------------------------ */

  function initialize() {
    installCSS();

    ensureBackgroundElements();

    applySettings();

    registerMenuItem();

    patchAppearanceMenuButton();

    if (!menuObserver) {
      const menu = document.getElementById('menu');

      if (menu) {
        menuObserver = new MutationObserver(() => {
          patchAppearanceMenuButton();
        });

        menuObserver.observe(menu, {
          childList: true,
          subtree: true
        });
      }
    }

    if (!applyObserver) {
      const desktop = document.getElementById('desktop');

      if (desktop) {
        applyObserver = new MutationObserver(records => {
          const newWindowAdded = records.some(record =>
            [...record.addedNodes].some(node =>
              node.nodeType === Node.ELEMENT_NODE &&
              (
                node.matches?.('.window') ||
                node.querySelector?.('.window')
              )
            )
          );

          if (newWindowAdded) {
            applySettings();
          }
        });

        applyObserver.observe(desktop, {
          childList: true,
          subtree: true
        });
      }
    }
  }

  window.openAppearanceAccessibility = openAppearanceAccessibility;

  window.WinconAppearance = {
    open: openAppearanceAccessibility,
    apply: applySettings,
    getSettings: () => ({ ...settings }),
    reset: () => {
      settings = { ...defaults };
      applySettings();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize, {
      once: true
    });
  } else {
    initialize();
  }

  /*
   * Winconの初期化タイミングに備えて再試行。
   */
  let attempts = 0;

  const retryTimer = setInterval(() => {
    initialize();
    attempts++;

    if (
      typeof menuItems !== 'undefined' &&
      Array.isArray(menuItems) &&
      document.getElementById('menu')
    ) {
      clearInterval(retryTimer);
    }

    if (attempts >= 40) {
      clearInterval(retryTimer);
    }
  }, 500);

  loadBackgroundImage();
})();
