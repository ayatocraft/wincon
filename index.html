    }

    function getMenuItem(title, type) {
        if (!Array.isArray(menuItems)) return null;

        return menuItems.find(item =>
            item &&
            item.title === title &&
            item.type === type &&
            !item.hidden
        ) || null;
    }

    function findMenuButton(app) {
        const menu = $("#menu");
        if (!menu) return null;

        return $$(".menu-item", menu).find(button => {
            const item = getMenuItem(app.title, app.type);

            return item &&
                button.textContent.includes(item.title);
        }) || null;
    }

    function launchPinnedApp(app) {
        const item = getMenuItem(app.title, app.type);

        if (!item) {
            alert(
                "このアプリは現在のMenuに見つかりません。\n" +
                "アプリがMenuに登録されているか確認してください。"
            );
            return;
        }

        const button = findMenuButton(app);

        if (!button) {
            if (typeof renderMenu === "function") {
                renderMenu();
            }
        }

        const currentButton = findMenuButton(app);

        if (currentButton) {
            currentButton.click();
        } else {
            alert("アプリの起動ボタンを取得できませんでした。");
        }
    }

    function ensurePinnedContainer() {
        const taskbar = $("#taskbar");
        const taskIcons = $("#taskIcons");

        if (!taskbar || !taskIcons) return null;

        let container = $("#winconPinnedApps");

        if (!container) {
            container = document.createElement("div");
            container.id = "winconPinnedApps";

            taskbar.insertBefore(container, taskIcons);
        }

        return container;
    }

    function pinApp(item) {
        if (!item || item.hidden) return;

        if (pinnedApps.some(app =>
            app.title === item.title &&
            app.type === item.type
        )) {
            return;
        }

        pinnedApps.push({
            title: item.title,
            type: item.type,
            icon: item.icon || "🪟"
        });

        savePinnedApps();
        renderPinnedApps();
    }

    function unpinApp(app) {
        pinnedApps = pinnedApps.filter(item =>
            !(item.title === app.title && item.type === app.type)
        );

        savePinnedApps();
        renderPinnedApps();
    }

    function renderPinnedApps() {
        const container = ensurePinnedContainer();
        if (!container) return;

        container.replaceChildren();

        pinnedApps.forEach((app, index) => {
            const button = document.createElement("button");

            button.className = "wincon-pinned-app";
            button.type = "button";
            button.textContent = app.icon || "🪟";
            button.title = app.title;
            button.draggable = true;
            button.dataset.index = String(index);

            button.setAttribute(
                "aria-label",
                app.title
            );

            button.addEventListener("click", () => {
                launchPinnedApp(app);
            });

            button.addEventListener("contextmenu", event => {
                event.preventDefault();
                showContextMenu(event.clientX, event.clientY, [
                    {
                        label: "📂 開く",
                        action: () => launchPinnedApp(app)
                    },
                    {
                        label: "📌 固定を解除",
                        action: () => unpinApp(app)
                    }
                ]);
            });

            button.addEventListener("dragstart", event => {
                button.classList.add("dragging");

                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData(
                    "text/plain",
                    String(index)
                );
            });

            button.addEventListener("dragend", () => {
                button.classList.remove("dragging");

                $$(".wincon-pinned-app").forEach(element =>
                    element.classList.remove("drag-over")
                );
            });

            button.addEventListener("dragover", event => {
                event.preventDefault();
                button.classList.add("drag-over");
            });

            button.addEventListener("dragleave", () => {
                button.classList.remove("drag-over");
            });

            button.addEventListener("drop", event => {
                event.preventDefault();

                const from = Number(
                    event.dataTransfer.getData("text/plain")
                );

                const to = index;

                if (
                    !Number.isInteger(from) ||
                    from < 0 ||
                    from >= pinnedApps.length ||
                    from === to
                ) {
                    return;
                }

                const moved = pinnedApps.splice(from, 1)[0];
                pinnedApps.splice(to, 0, moved);

                savePinnedApps();
                renderPinnedApps();
            });

            container.appendChild(button);
        });
    }


    /* =====================================================
       右クリックメニュー
    ===================================================== */

    function ensureContextMenu() {
        let menu = $("#winconExtensionContextMenu");

        if (!menu) {
            menu = document.createElement("div");
            menu.id = "winconExtensionContextMenu";
            menu.setAttribute("role", "menu");
            document.body.appendChild(menu);
        }

        return menu;
    }

    function hideContextMenu() {
        const menu = $("#winconExtensionContextMenu");

        if (menu) {
            menu.style.display = "none";
        }
    }

    function showContextMenu(x, y, actions) {
        const menu = ensureContextMenu();

        menu.replaceChildren();

        actions.forEach(entry => {
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = entry.label;

            button.onclick = () => {
                hideContextMenu();
                entry.action();
            };

            menu.appendChild(button);
        });

        menu.style.display = "block";
        menu.style.left = "0px";
        menu.style.top = "0px";

        const rect = menu.getBoundingClientRect();

        menu.style.left = Math.max(
            4,
            Math.min(x, innerWidth - rect.width - 4)
        ) + "px";

        menu.style.top = Math.max(
            4,
            Math.min(y, innerHeight - rect.height - 4)
        ) + "px";
    }

    document.addEventListener("pointerdown", event => {
        const menu = $("#winconExtensionContextMenu");

        if (menu && !menu.contains(event.target)) {
            hideContextMenu();
        }
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            hideContextMenu();

            if (saverVisible) {
                hideScreenSaver();
            }
        }
    });

    function bindMenuPinning() {
        const menu = $("#menu");
        if (!menu) return;

        $$(".menu-item", menu).forEach(button => {
            if (button.dataset.winconPinBound === "true") return;

            button.dataset.winconPinBound = "true";

            button.addEventListener("contextmenu", event => {
                const text = button.textContent.trim();

                const item = Array.isArray(menuItems)
                    ? menuItems.find(entry =>
                        entry &&
                        !entry.hidden &&
                        text.includes(entry.title)
                    )
                    : null;

                if (!item) return;

                event.preventDefault();

                const pinned = pinnedApps.some(app =>
                    app.title === item.title &&
                    app.type === item.type
                );

                showContextMenu(event.clientX, event.clientY, [
                    {
                        label: "📂 開く",
                        action: () => button.click()
                    },
                    ...(pinned ? [{
                        label: "📌 固定を解除",
                        action: () => unpinApp(item)
                    }] : [{
                        label: "📌 タスクバーに固定",
                        action: () => pinApp(item)
                    }])
                ]);
            });
        });
    }

    function bindRunningTasks() {
        const taskIcons = $("#taskIcons");
        if (!taskIcons) return;

        $$(".task-icon", taskIcons).forEach(task => {
            if (task.dataset.winconPinBound === "true") return;

            task.dataset.winconPinBound = "true";

            task.addEventListener("contextmenu", event => {
                const title = task.title;

                const item = Array.isArray(menuItems)
                    ? menuItems.find(entry =>
                        entry &&
                        !entry.hidden &&
                        entry.title === title
                    )
                    : null;

                if (!item) return;

                event.preventDefault();

                const pinned = pinnedApps.some(app =>
                    app.title === item.title &&
                    app.type === item.type
                );

                showContextMenu(event.clientX, event.clientY, [
                    ...(pinned ? [{
                        label: "📌 固定を解除",
                        action: () => unpinApp(item)
                    }] : [{
                        label: "📌 タスクバーに固定",
                        action: () => pinApp(item)
                    }]),
                    {
                        label: "✖ 閉じる",
                        action: () => {
                            const win = $$(".window", $("#desktop"))
                                .find(element =>
                                    element.dataset.title === title
                                );

                            if (win) {
                                const close = $(".close-btn", win);

                                if (close) close.click();
                                else win.remove();
                            }

                            task.remove();
                        }
                    }
                ]);
            });
        });
    }


    /* =====================================================
       スクリーンセーバー
       ログイン画面が表示されている間は絶対に出さない
    ===================================================== */

    


    /* =====================================================
       タブレットモード
       初期状態はOFF。設定画面は追加しない。
    ===================================================== */

    function setTabletMode(enabled) {
        tabletMode = !!enabled;

        document.body.classList.toggle(
            "wincon-tablet-mode",
            tabletMode
        );

        const button = $("#winconTabletToggle");

        if (button) {
            button.textContent = tabletMode
                ? "📱 タブレットモード：オン"
                : "📱 タブレットモード：オフ";

            button.setAttribute(
                "aria-pressed",
                String(tabletMode)
            );
        }
    }

    function installControlCenterToggle() {
        const controlCenter = $("#controlCenter");

        if (!controlCenter) return;

        if ($("#winconTabletToggle")) return;

        const card = document.createElement("div");

        card.className = "cc-card";
        card.id = "winconTabletCard";

        card.innerHTML = `
            <h3>📱 タブレットモード</h3>
            <p>ウィンドウを画面いっぱいに表示し、タッチ操作をしやすくします。</p>
            <button
                type="button"
                class="action"
                id="winconTabletToggle"
                aria-pressed="false"
            >📱 タブレットモード：オフ</button>
        `;

        controlCenter.appendChild(card);

        $("#winconTabletToggle", card).addEventListener(
            "click",
            () => setTabletMode(!tabletMode)
        );
    }


    /* =====================================================
       初期化
    ===================================================== */

    function initialize() {
        loadPinnedApps();

        ensurePinnedContainer();
        renderPinnedApps();

        bindMenuPinning();
        bindRunningTasks();

        installControlCenterToggle();
    }

    const observer = new MutationObserver(() => {
        bindMenuPinning();
        bindRunningTasks();
        installControlCenterToggle();
    });

    function start() {
        initialize();

        const menu = $("#menu");
        const taskIcons = $("#taskIcons");
        const controlCenter = $("#controlCenter");

        [menu, taskIcons, controlCenter].forEach(element => {
            if (element) {
                observer.observe(element, {
                    childList: true,
                    subtree: true
                });
            }
        });

        resetIdleTimer();
    }

    // 既存の起動・ログイン処理には介入しない。
    // ログイン画面の存在を確認しながら初期化する。
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, {
            once: true
        });
    } else {
        start();
    }

    // Wincon側の遅延初期化に備えて要素を再確認する。
    let retries = 0;

    const retry = setInterval(() => {
        initialize();
        retries++;

        if (
            ($("#taskbar") && $("#menu") && $("#controlCenter")) ||
            retries >= 20
        ) {
            clearInterval(retry);
        }
    }, 500);

    window.WinconExtension = {
        pin: pinApp,
        unpin: unpinApp,
        renderPinnedApps,
        showScreenSaver,
        hideScreenSaver,
        setTabletMode
    };

})();

</script>

<script>
/* =====================================================
   Wincon お引越し — DAT版 統合スクリプト
   メニュー登録 / 書き出し / 読み込み / 復元
   ===================================================== */
(() => {
    "use strict";

    const APP_NAME = "Wincon お引越し";
    const APP_ICON = "📦";
    const APP_TYPE = "transfer";
    const DAT_FORMAT = "WinconDataTransfer";
    const DAT_VERSION = 1;

    // 二重初期化を防止
    if (window.__WINCON_DAT_APP_V2__) return;
    window.__WINCON_DAT_APP_V2__ = true;

    /* =================================================
       LocalStorageをDAT形式に変換
       ================================================= */

    function collectStorage() {
        const storage = [];

        for (let i = 0; i < localStorage.length; i++) {
            const id = localStorage.key(i);

            if (id === null) continue;

            storage.push({
                id: id,
                value: localStorage.getItem(id)
            });
        }

        return storage;
    }

    function createDAT(storage) {
        return {
            format: DAT_FORMAT,
            version: DAT_VERSION,
            createdAt: new Date().toISOString(),
            storage: storage
        };
    }

    function downloadDAT(data, filename) {
        const blob = new Blob(
            [JSON.stringify(data, null, 2)],
            { type: "application/json;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = filename;
        link.style.display = "none";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 10000);
    }

    /* =================================================
       DATファイルの検証
       ================================================= */

    function validateDAT(data) {
        if (!data || typeof data !== "object") {
            throw new Error("ファイルの内容が正しくありません。");
        }

        if (data.format !== DAT_FORMAT) {
            throw new Error(
                "Winconのお引越しDATファイルではありません。"
            );
        }

        if (data.version !== DAT_VERSION) {
            throw new Error(
                "対応していないDATバージョンです。"
            );
        }

        if (!Array.isArray(data.storage)) {
            throw new Error(
                "DATファイルにstorage配列がありません。"
            );
        }

        for (const entry of data.storage) {
            if (
                !entry ||
                typeof entry.id !== "string" ||
                typeof entry.value !== "string"
            ) {
                throw new Error(
                    "DATファイルに不正なデータがあります。"
                );
            }
        }

        return data;
    }

    /* =================================================
       アプリ画面
       ================================================= */

    function openApp() {
        if (typeof window.createWindow !== "function") {
            alert("Winconのウィンドウ機能を確認できません。");
            return;
        }

        // createWindowにはDOM要素ではなくHTML文字列を渡す
        const html = `
            <div class="wincon-dat-app"
                 style="
                    box-sizing:border-box;
                    width:100%;
                    height:100%;
                    overflow:auto;
                    padding:20px;
                    font-family:'Segoe UI',sans-serif;
                 ">

                <h2 style="margin-top:0;">
                    📦 Wincon お引越し
                </h2>

                <p>
                    WinconのLocalStorageをDATファイルに保存し、
                    別のWincon環境に移行できます。
                </p>

                <section style="
                    padding:16px;
                    margin:16px 0;
                    border:1px solid var(--border-color,#ccc);
                    border-radius:10px;
                ">
                    <h3>① データの書き出し</h3>

                    <p>
                        現在のWinconに保存されている
                        LocalStorageのデータを書き出します。
                    </p>

                    <button type="button"
                            data-action="export"
                            style="
                                width:100%;
                                padding:12px;
                                border:0;
                                border-radius:7px;
                                cursor:pointer;
                                background:#0078d4;
                                color:white;
                            ">
                        DATファイルに書き出す
                    </button>
                </section>

                <section style="
                    padding:16px;
                    margin:16px 0;
                    border:1px solid var(--border-color,#ccc);
                    border-radius:10px;
                ">
                    <h3>② DATファイルの読み込み</h3>

                    <p>
                        読み込んだファイルのIDを確認し、
                        復元対象を表示します。
                    </p>

                    <input type="file"
                           data-role="file"
                           accept=".dat,.json,application/json"
                           style="width:100%;margin:8px 0 12px;">

                    <div data-role="preview"
                         style="
                            display:none;
                            padding:12px;
                            margin:8px 0 12px;
                            border-radius:7px;
                            background:var(--panel-color,#f3f3f3);
                            overflow-wrap:anywhere;
                            white-space:pre-wrap;
                         "></div>

                    <button type="button"
                            data-action="restore"
                            disabled
                            style="
                                width:100%;
                                padding:12px;
                                border:0;
                                border-radius:7px;
                                cursor:not-allowed;
                                background:#107c10;
                                color:white;
                                opacity:.5;
                            ">
                        データを復元する
                    </button>
                </section>

                <div data-role="status"
                     role="status"
                     aria-live="polite"
                     style="
                        padding:10px 0;
                        white-space:pre-wrap;
                        overflow-wrap:anywhere;
                     ">
                    準備完了
                </div>

                <p style="font-size:12px;opacity:.75;">
                    注意：復元すると、DATファイル内のIDと
                    同じIDを持つデータは上書きされます。
                    復元前に現在のデータをバックアップします。
                </p>
            </div>
        `;

        // safe:false にして閉じるボタンを表示する
        const win = window.createWindow({
            title: APP_NAME,
            icon: APP_ICON,
            content: html,
            width: 760,
            height: 680,
            safe: false,
            popup: false
        });

        if (!win || typeof win.querySelector !== "function") {
            alert("お引越しウィンドウを作成できませんでした。");
            return;
        }

        // OOBE隔離中でも、お引越しアプリだけはOOBEの上に表示する。
        if (document.body.classList.contains("wincon10-oobe-isolated")) {
            win.classList.add("wincon10-oobe-window");
            win.style.zIndex = "2147483200";
            win.style.left = "50%";
            win.style.top = "50%";
            win.style.transform = "translate(-50%,-50%)";
            win.style.width = "min(760px, calc(100vw - 32px))";
            win.style.height = "min(680px, calc(100vh - 32px))";
        }

        const fileInput = win.querySelector('[data-role="file"]');
        const preview = win.querySelector('[data-role="preview"]');
        const status = win.querySelector('[data-role="status"]');
        const exportButton = win.querySelector('[data-action="export"]');
        const restoreButton = win.querySelector('[data-action="restore"]');

        let importedData = null;

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.style.color = isError ? "#c42b1c" : "inherit";
        }

        /* ---------------------------------------------
           書き出し
           --------------------------------------------- */

        exportButton.addEventListener("click", () => {
            try {
                const storage = collectStorage();
                const data = createDAT(storage);

                downloadDAT(data, "WinconBackup.dat");

                setStatus(
                    "書き出しを開始しました。\n" +
                    "保存対象：" + storage.length + "件\n" +
                    "ファイル名：WinconBackup.dat"
                );
            } catch (error) {
                console.error(error);
                setStatus(
                    "書き出しに失敗しました。\n" + error.message,
                    true
                );
            }
        });

        /* ---------------------------------------------
           DATファイル読み込み・プレビュー
           --------------------------------------------- */

        fileInput.addEventListener("change", async () => {
            importedData = null;
            restoreButton.disabled = true;
            restoreButton.style.opacity = ".5";
            restoreButton.style.cursor = "not-allowed";
            preview.style.display = "none";
            preview.textContent = "";

            const file = fileInput.files && fileInput.files[0];

            if (!file) {
                setStatus("ファイルが選択されていません。");
                return;
            }

            try {
                const text = await file.text();
                const data = validateDAT(JSON.parse(text));

                importedData = data;

                const currentKeys = new Set();

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key !== null) currentKeys.add(key);
                }

                let overwriteCount = 0;
                let newCount = 0;

                for (const entry of data.storage) {
                    if (currentKeys.has(entry.id)) {
                        overwriteCount++;
                    } else {
                        newCount++;
                    }
                }

                preview.textContent =
                    "ファイル名：" + file.name + "\n" +
                    "作成日時：" + (data.createdAt || "記録なし") + "\n" +
                    "データ件数：" + data.storage.length + "件\n" +
                    "上書き対象：" + overwriteCount + "件\n" +
                    "新規追加：" + newCount + "件";

                preview.style.display = "block";

                restoreButton.disabled = false;
                restoreButton.style.opacity = "1";
                restoreButton.style.cursor = "pointer";

                setStatus("ファイルを確認しました。復元できます。");

            } catch (error) {
                console.error(error);
                setStatus(
                    "読み込みに失敗しました。\n" + error.message,
                    true
                );
            }
        });

        /* ---------------------------------------------
           復元
           --------------------------------------------- */

        restoreButton.addEventListener("click", () => {
            if (!importedData) {
                setStatus("先にDATファイルを読み込んでください。", true);
                return;
            }

            const confirmed = confirm(
                "DATファイルのデータを復元しますか？\n\n" +
                "同じIDのデータは上書きされます。\n" +
                "復元前のデータはDATファイルにバックアップします。"
            );

            if (!confirmed) return;

            let oldStorage;

            try {
                // 復元前の状態を保存
                oldStorage = collectStorage();

                downloadDAT(
                    createDAT(oldStorage),
                    "WinconBeforeRestore.dat"
                );

                // 復元前にLocalStorageの状態を記録
                const originalKeys = new Set(
                    oldStorage.map(entry => entry.id)
                );

                try {
                    for (const entry of importedData.storage) {
                        localStorage.setItem(entry.id, entry.value);
                    }
                } catch (restoreError) {
                    // 復元中にエラーが出た場合は元の状態に戻す
                    try {
                        const keysNow = [];

                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key !== null) keysNow.push(key);
                        }

                        for (const key of keysNow) {
                            if (!originalKeys.has(key)) {
                                localStorage.removeItem(key);
                            }
                        }

                        for (const entry of oldStorage) {
                            localStorage.setItem(entry.id, entry.value);
                        }
                    } catch (rollbackError) {
                        console.error(
                            "復元の取り消しにも失敗しました。",
                            rollbackError
                        );
                    }

                    throw restoreError;
                }

                setStatus(
                    "復元が完了しました。\n" +
                    "復元件数：" + importedData.storage.length + "件\n" +
                    "バックアップ：WinconBeforeRestore.dat\n\n" +
                    "変更を反映するにはWinconを再読み込みしてください。"
                );

                if (confirm(
                    "復元が完了しました。\nWinconを再読み込みしますか？"
                )) {
                    location.reload();
                }

            } catch (error) {
                console.error(error);

                setStatus(
                    "復元に失敗しました。\n" + error.message,
                    true
                );
            }
        });
    }

    /* =================================================
       メニュー登録
       ================================================= */

    function registerMenu() {
        if (
            typeof menuItems === "undefined" ||
            typeof renderMenu !== "function"
        ) {
            return false;
        }

        // 既存の「お引越し」項目があれば再利用
        let item = menuItems.find(entry =>
            entry.type === "transfer" ||
            entry.title === "お引越し" ||
            entry.title === APP_NAME
        );

        if (item) {
            item.title = APP_NAME;
            item.icon = APP_ICON;
            item.type = APP_TYPE;
            item.hidden = false;
            item.system = true;
        } else {
            item = {

                type: APP_TYPE,
                system: true,
                hidden: false

            menuItems.push(item);

        // 既存の「お引越し」起動処理をDAT版に置き換える
        window.openTransferApp = openApp;

        try {
            localStorage.setItem(
                "winconMenuItems",
                JSON.stringify(menuItems)

    const timer = setInterval(() => {

            if (attempts >= 40) {

    window.winconDataTransfer = {

    };

    const DB_VERSION = 1;

    /* =====================================================
       IndexedDB
       ===================================================== */

    function openDB() {
        if (dbPromise) return dbPromise;

        dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = () => {
                const db = request.result;

                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    const store = db.createObjectStore(STORE_NAME, {
                        keyPath: "id",
                        autoIncrement: true
                    });

                    store.createIndex("createdAt", "createdAt");
                }
            };

            request.onsuccess = () => resolve(request.result);

            request.onerror = () => {
                dbPromise = null;
                reject(request.error);
            };
        });

        return dbPromise;
    }

    async function saveMedia(blob, type, filename) {
        const db = await openDB();

        return new Promise((resolve, reject) => {
            const transaction = db.transaction(STORE_NAME, "readwrite");

            transaction.objectStore(STORE_NAME).add({
                blob,
                type,
                filename,
                createdAt: Date.now()
            });

            transaction.oncomplete = () => resolve(true);
            transaction.onerror = () => reject(transaction.error);
            transaction.onabort = () => reject(transaction.error);
        });
    }

    async function getAllMedia() {
        const db = await openDB();

        return new Promise((resolve, reject) => {
            const transaction = db.transaction(STORE_NAME, "readonly");
            const request = transaction
                .objectStore(STORE_NAME)
                .getAll();

            request.onsuccess = () => {
                const items = request.result || [];

                items.sort((a, b) => b.createdAt - a.createdAt);

                resolve(items);
            };

            request.onerror = () => reject(request.error);
        });
    }

    async function deleteMedia(id) {
        const db = await openDB();

        return new Promise((resolve, reject) => {
            const transaction = db.transaction(STORE_NAME, "readwrite");

            transaction.objectStore(STORE_NAME).delete(id);

            transaction.oncomplete = () => resolve(true);
            transaction.onerror = () => reject(transaction.error);
        });
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = filename;
        link.style.display = "none";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

            "_",
            String(now.getHours()).padStart(2, "0"),
            String(now.getMinutes()).padStart(2, "0"),
            String(now.getSeconds()).padStart(2, "0")

    /* =====================================================
       Camera lifecycle
       ===================================================== */

    function setStatus(message) {
        if (!currentWindow) return;

        const element = currentWindow.querySelector(
            '[data-role="status"]'
        );

        if (element) element.textContent = message;
    }

    function stopCurrentStream() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        const video = currentWindow?.querySelector('[data-role="video"]');

        if (video) {
            video.pause();
            video.srcObject = null;
            video.style.display = "none";
        }
    }

    async function startCamera() {
        if (!currentWindow || recording) return;

        if (!navigator.mediaDevices?.getUserMedia) {
            setStatus("この環境ではカメラを利用できません。HTTPS接続を確認してください。");
            showPlaceholder("カメラを利用できません");
            return;
        }

        const requestId = ++cameraRequestId;

        stopCurrentStream();

        const video = currentWindow.querySelector('[data-role="video"]');
        const placeholder = currentWindow.querySelector('[data-role="placeholder"]');

        placeholder.style.display = "block";
        placeholder.textContent = "カメラを起動しています…";
        setStatus("カメラを起動しています");

        try {
            let newStream;

            try {
                newStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
            } catch (firstError) {
                newStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: true
                });
            }

            // 起動待ちの間に閉じる・切り替える操作があった場合
            if (
                requestId !== cameraRequestId ||
                !currentWindow ||
                !currentWindow.isConnected
            ) {
                newStream.getTracks().forEach(track => track.stop());
                return;
            }

            stream = newStream;
            video.srcObject = stream;
            video.style.display = "block";

            await video.play();

            placeholder.style.display = "none";
            setStatus(
                facingMode === "environment"
                    ? "背面カメラ"
                    : "前面カメラ"
            );

        } catch (error) {
            console.error("[Wincon Camera]", error);

            showPlaceholder("カメラを起動できません");

            if (error.name === "NotAllowedError") {
                setStatus("カメラの使用を許可してください");
            } else if (error.name === "NotFoundError") {
                setStatus("利用できるカメラが見つかりません");
            } else {
                setStatus("カメラを起動できません：" + error.message);
            }
        }
    }

    function showPlaceholder(message) {
        if (!currentWindow) return;

        const placeholder = currentWindow.querySelector(
            '[data-role="placeholder"]'
        );

        const video = currentWindow.querySelector('[data-role="video"]');

        if (placeholder) {
            placeholder.style.display = "block";
            placeholder.textContent = message;
        }

        if (video) video.style.display = "none";
    }

    async function switchCamera() {
        if (recording) return;

        facingMode = facingMode === "environment"
            ? "user"
            : "environment";

        await startCamera();
    }

    /* =====================================================
       Photo capture
       ===================================================== */

    async function takePhoto() {
        if (!stream || recording || !currentWindow) return;

        const video = currentWindow.querySelector('[data-role="video"]');
        const canvas = currentWindow.querySelector('[data-role="canvas"]');

        if (!video.videoWidth || !video.videoHeight) {
            setStatus("カメラの準備ができていません");
            return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");

        // 前面カメラのプレビューは鏡像だが、
        // 保存画像は通常の向きで記録する
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        setStatus("写真を保存しています…");

        canvas.toBlob(async blob => {
            if (!blob) {
                setStatus("写真を作成できませんでした");
                return;
            }

            const filename = makeFilename("Photo", "jpg");

            try {
                await saveMedia(blob, "photo", filename);
                downloadBlob(blob, filename);

                setStatus("写真を保存しました");
                await renderLibrary();

            } catch (error) {
                console.error(error);

                // ライブラリ保存が失敗しても写真のDLは試みる
                downloadBlob(blob, filename);
                setStatus("写真をダウンロードしました。ライブラリ保存は失敗しました");
            }
        }, "image/jpeg", 0.95);
    }

    /* =====================================================
       Video recording
       ===================================================== */

    function chooseVideoMimeType() {
        if (!window.MediaRecorder) return "";

        const types = [
            "video/webm;codecs=vp9,opus",
            "video/webm;codecs=vp8,opus",
            "video/webm"
        ];

        return types.find(type =>
            MediaRecorder.isTypeSupported(type)
        ) || "";
    }

    function setRecordingLock(locked) {
        if (!currentWindow) return;

        const controls = currentWindow.querySelectorAll(
            '[data-mode], [data-action="flip"], ' +
            '[data-action="library"], [data-action="library-bottom"], ' +
            '[data-action="shutter"]'
        );

        controls.forEach(button => {
            button.disabled = locked;
            button.style.opacity = locked ? ".35" : "1";
            button.style.cursor = locked ? "not-allowed" : "pointer";
        });

        const stopButton = currentWindow.querySelector('[data-action="stop"]');

        if (stopButton) {
            stopButton.style.display = locked ? "block" : "none";
            stopButton.disabled = !locked;
        }

        const indicator = currentWindow.querySelector(
            '[data-role="recording-indicator"]'
        );

        if (indicator) indicator.style.display = locked ? "block" : "none";

        const inner = currentWindow.querySelector(
            '[data-role="shutter-inner"]'
        );

        if (inner) {
            inner.style.background = locked ? "#b3261e" : "white";
            inner.style.borderRadius = locked ? "10px" : "50%";
        }
    }

    function startRecording() {
        if (!stream || recording || !currentWindow) return;

        if (!window.MediaRecorder) {
            setStatus("このブラウザーは動画撮影に対応していません");
            return;
        }

        try {
            const mimeType = chooseVideoMimeType();

            mediaRecorder = mimeType
                ? new MediaRecorder(stream, { mimeType })
                : new MediaRecorder(stream);

            recordingChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data && event.data.size > 0) {
                    recordingChunks.push(event.data);
                }
            };

            mediaRecorder.onerror = event => {
                console.error("[Wincon Camera] Recorder error", event.error);
                setStatus("動画の録画中にエラーが発生しました");
            };

            mediaRecorder.onstop = async () => {
                const finalType = mediaRecorder?.mimeType || "video/webm";
                const extension = finalType.includes("mp4") ? "mp4" : "webm";

                const blob = new Blob(recordingChunks, { type: finalType });
                recordingChunks = [];

                if (!blob.size) {
                    setStatus("動画データがありません");
                    return;
                }

                const filename = makeFilename("Video", extension);

                setStatus("動画を保存しています…");

                try {
                    await saveMedia(blob, "video", filename);
                    downloadBlob(blob, filename);
                    setStatus("動画を保存しました");
                    await renderLibrary();
                } catch (error) {
                    console.error(error);

                    downloadBlob(blob, filename);
                    setStatus("動画をダウンロードしました。ライブラリ保存は失敗しました");
                }
            };

            mediaRecorder.start(1000);

            recording = true;
            recordingStartedAt = Date.now();

            setRecordingLock(true);
            setStatus("動画を録画中です");

            recordingTimer = setInterval(() => {
                if (!currentWindow) return;

                const elapsed = Math.floor(
                    (Date.now() - recordingStartedAt) / 1000
                );

                const timeElement = currentWindow.querySelector(
                    '[data-role="recording-time"]'
                );

                if (timeElement) {
                    timeElement.textContent =
                        String(Math.floor(elapsed / 60)).padStart(2, "0") +
                        ":" +
                        String(elapsed % 60).padStart(2, "0");
                }
            }, 250);

        } catch (error) {
            console.error(error);
            setStatus("録画を開始できません：" + error.message);
        }
    }

    function stopRecording() {
        if (!recording || !mediaRecorder) return;

        recording = false;

        if (recordingTimer) {
            clearInterval(recordingTimer);
            recordingTimer = null;
        }

        setRecordingLock(false);
        setStatus("動画を処理しています…");

        if (mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
    }

    /* =====================================================
       Mode switching
       ===================================================== */

    function setMode(mode) {
        if (recording || !currentWindow) return;

        currentMode = mode;

        currentWindow.querySelectorAll("[data-mode]").forEach(button => {
            const active = button.dataset.mode === mode;

            button.style.background = active ? "#f5c451" : "#303030";
            button.style.color = active ? "#121" : "white";
            button.style.fontWeight = active ? "600" : "400";
        });

        const shutter = currentWindow.querySelector('[data-action="shutter"]');

        if (shutter) {
            shutter.setAttribute(
                "aria-label",
                mode === "photo" ? "写真を撮影" : "動画を録画"
            );
        }

        setStatus(mode === "photo" ? "写真モード" : "動画モード");
    }

    /* =====================================================
       Library
       ===================================================== */

    function showLibrary() {
        if (recording || !currentWindow) return;

        libraryView = true;

        const library = currentWindow.querySelector('[data-role="library"]');
        const main = currentWindow.querySelector('.wc-camera-main');

        if (library) library.style.display = "flex";
        if (main) main.style.display = "none";

        renderLibrary();
    }

    function hideLibrary() {
        if (!currentWindow) return;

        libraryView = false;

        const library = currentWindow.querySelector('[data-role="library"]');
        const main = currentWindow.querySelector('.wc-camera-main');
        const detail = currentWindow.querySelector('[data-role="media-detail"]');

        if (library) library.style.display = "none";
        if (main) main.style.display = "flex";
        if (detail) detail.style.display = "none";
    }

    async function renderLibrary() {
        if (!currentWindow) return;

        const grid = currentWindow.querySelector('[data-role="library-grid"]');

        if (!grid) return;

        grid.innerHTML = "";

        let items;

        try {
            items = await getAllMedia();
        } catch (error) {
            console.error(error);
            grid.textContent = "ライブラリを読み込めませんでした";
            return;

    let selectedMedia = null;

    function openMediaDetail(item) {
        if (!currentWindow) return;

        selectedMedia = item;

        const detail = currentWindow.querySelector('[data-role="media-detail"]');
        const preview = currentWindow.querySelector('[data-role="detail-preview"]');
        const name = currentWindow.querySelector('[data-role="detail-name"]');

        preview.innerHTML = "";

        if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = null;
        }

        currentObjectUrl = URL.createObjectURL(item.blob);

        if (item.type === "photo") {
            const img = document.createElement("img");

            img.src = currentObjectUrl;
            img.alt = "撮影した写真";
            img.style.cssText = `
                max-width:100%;max-height:100%;object-fit:contain;
            `;

            preview.appendChild(img);
        } else {
            const video = document.createElement("video");

            video.src = currentObjectUrl;
            video.controls = true;
            video.playsInline = true;
            video.style.cssText = `
                width:100%;height:100%;object-fit:contain;
            `;

            preview.appendChild(video);
        }

        name.textContent = item.filename || "撮影データ";

        detail.style.display = "flex";
    }

    function closeMediaDetail() {
        if (!currentWindow) return;

        const detail = currentWindow.querySelector('[data-role="media-detail"]');

        if (detail) detail.style.display = "none";

        const preview = currentWindow.querySelector('[data-role="detail-preview"]');

        if (preview) {
            preview.querySelectorAll("video").forEach(video => {
                video.pause();
                video.removeAttribute("src");
                video.load();
            });

            preview.innerHTML = "";
        }

        if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = null;
        }

        selectedMedia = null;
    }

        if (!selectedMedia) return;

    async function deleteSelectedMedia() {

            return;

        const id = selectedMedia.id;

        closeMediaDetail();

        try {
            await deleteMedia(id);
            await renderLibrary();
        } catch (error) {
            console.error(error);
            alert("削除に失敗しました");
        }
    }

        }

        let item = menuItems.find(entry =>
            entry.type === "camera" ||

        );

            item.title = APP_NAME;
            item.icon = APP_ICON;
            item.type = "camera";

            item.hidden = false;
        } else {
            item = {

                icon: APP_ICON,
                type: "camera",
                system: true,
                hidden: false
            };

            menuItems.push(item);

                "winconMenuItems",
                JSON.stringify(menuItems)
            );
        } catch (error) {
            console.warn("[Wincon Camera] メニュー保存に失敗", error);

        state.recognition = recognition;
        recognition.lang = "ja-JP";
        recognition.continuous = false;
        recognition.interimResults = true;

            if (button) button.textContent = "● 聞き取り中";
        };

        recognition.onresult = event => {
            let interim = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript;
                if (event.results[i].isFinal) finalText += text;
                else interim += text;
            }

            if (input) input.value = finalText + interim;
        };

        recognition.onerror = event => {
            setStatus(root, "音声入力エラー: " + event.error);
        };

        recognition.onend = () => {
            button?.classList.remove("wi-listening");

            if (state.recognition === recognition) {

<script>
/* =========================================================
   WINCON DAILY AUTO UPDATE
   1日1回 Service Worker確認・キャッシュ再生成
========================================================= */

(() => {
    "use strict";

    const DATE_KEY = "winconDailyUpdateDate";
    const RESULT_KEY = "winconDailyUpdateResult";
    const CACHE_NAME = "wincon-cache-v1";

    // 二重実行防止
    if (window.__WINCON_DAILY_UPDATE_RUNNING__) return;
    window.__WINCON_DAILY_UPDATE_RUNNING__ = true;


    /* =====================================================
       日付
    ===================================================== */

    function getToday() {
        const now = new Date();

        return [
            now.getFullYear(),
            String(now.getMonth() + 1).padStart(2, "0"),
            String(now.getDate()).padStart(2, "0")
        ].join("-");
    }


    /* =====================================================
       更新結果の保存
    ===================================================== */

    function saveResult(result, detail = "") {
        const data = {
            result,
            detail,
            date: getToday()
        };

        window.__WINCON_DAILY_UPDATE_RESULT__ = data;

        try {
            localStorage.setItem(
                RESULT_KEY,
                JSON.stringify(data)
            );
        } catch (error) {
            try {
                sessionStorage.setItem(
                    RESULT_KEY,
                    JSON.stringify(data)
                );
            } catch (e) {
                console.error(
                    "[Wincon Update] 結果保存失敗",
                    e
                );
            }
        }
    }


    function loadResult() {
        try {
            const data =
                localStorage.getItem(RESULT_KEY) ||
                sessionStorage.getItem(RESULT_KEY);

            return data ? JSON.parse(data) : null;

        } catch (error) {
            return null;
        }
    }


    /* =====================================================
       タイムアウト
    ===================================================== */

    function timeout(promise, ms, label) {

        return Promise.race([
            promise,

            new Promise((_, reject) => {
                setTimeout(() => {
                    reject(
                        new Error(label + " がタイムアウトしました")
                    );
                }, ms);
            })
        ]);
    }


    /* =====================================================
       更新処理
    ===================================================== */

    async function updateWincon() {

        try {

            console.log(
                "[Wincon Update] 更新を開始します"
            );


            // Service Worker対応確認
            if (!("serviceWorker" in navigator)) {
                throw new Error(
                    "Service Workerに対応していません"
                );
            }


            // CacheStorage対応確認
            if (!("caches" in window)) {
                throw new Error(
                    "CacheStorageが利用できません"
                );
            }


            // Service Worker登録
            const registration = await timeout(
                navigator.serviceWorker.register("./sw.js"),
                15000,
                "Service Worker登録"
            );


            console.log(
                "[Wincon Update] Service Worker登録完了"
            );


            // Service Workerの更新確認
            await timeout(
                registration.update(),
                15000,
                "Service Worker更新確認"
            );


            // 有効化を待機
            const ready = await timeout(
                navigator.serviceWorker.ready,
                20000,
                "Service Worker有効化"
            );


            if (!ready.active) {
                throw new Error(
                    "Service Workerが有効化されていません"
                );
            }


            console.log(
                "[Wincon Update] Service Worker正常動作"
            );


            // 新しいService Workerがインストール中なら待機
            if (registration.installing) {

                const installing = registration.installing;

                await timeout(
                    new Promise((resolve, reject) => {

                        if (installing.state === "activated") {
                            resolve();
                            return;
                        }

                        installing.addEventListener(
                            "statechange",
                            () => {

                                if (installing.state === "activated") {
                                    resolve();
                                }

                                if (installing.state === "redundant") {
                                    reject(
                                        new Error(
                                            "Service Workerの更新に失敗しました"
                                        )
                                    );
                                }

                            }
                        );

                    }),
                    20000,
                    "Service Workerインストール"
                );

            }


            /* =============================================
               キャッシュ削除
            ============================================= */

            await caches.delete(CACHE_NAME);

            console.log(
                "[Wincon Update] 旧キャッシュ削除完了"
            );


            /* =============================================
               キャッシュ再生成
            ============================================= */

            const cache = await caches.open(CACHE_NAME);

            await timeout(
                cache.addAll([
                    "./",
                    "./index.html"
                ]),
                30000,
                "キャッシュ再生成"
            );


            console.log(
                "[Wincon Update] キャッシュ再生成完了"
            );


            // 成功
            saveResult(
                "success",
                "Service Worker確認・キャッシュ再生成完了"
            );


        } catch (error) {

            console.error(
                "[Wincon Update] 更新失敗",
                error
            );

            // 失敗
            saveResult(
                "failure",
                error.message || "不明なエラー"
            );

        }


        /* =============================================
           Wincon再起動
        ============================================= */

        console.log(
            "[Wincon Update] Winconを再起動します"
        );

        window.location.reload();

    }


    /* =====================================================
       起動時の処理
    ===================================================== */

    const previousResult = loadResult();

    if (previousResult) {

        window.__WINCON_DAILY_UPDATE_RESULT__ =
            previousResult;

        console.log(
            "[Wincon Update] 前回の更新結果を検出",
            previousResult
        );

    } else {

        const today = getToday();

        let lastUpdate;

        try {
            lastUpdate = localStorage.getItem(DATE_KEY);
        } catch (error) {
            lastUpdate = null;
        }


        // 今日すでに実行済みなら終了
        if (lastUpdate === today) {

            console.log(
                "[Wincon Update] 本日の更新は完了済み"
            );

        } else {

            // 再起動ループ防止
            try {
                localStorage.setItem(
                    DATE_KEY,
                    today
                );
            } catch (error) {
                console.error(error);
            }

            console.log(
                "[Wincon Update] 自動更新は停止されています。アップデートアプリから実行してください。"
            );

        }

    }


    /* =====================================================
       デスクトップ起動後の通知
    ===================================================== */

    const originalStartHorizonDesktop =
        window.startHorizonDesktop;

    if (
        typeof originalStartHorizonDesktop === "function" &&
        !window.__WINCON_UPDATE_START_WRAPPED__
    ) {

        window.__WINCON_UPDATE_START_WRAPPED__ = true;

        window.startHorizonDesktop = function (...args) {

            const result =
                originalStartHorizonDesktop.apply(this, args);

            const updateResult =
                window.__WINCON_DAILY_UPDATE_RESULT__;

            if (updateResult) {

                setTimeout(() => {

                    if (
                        typeof window.showWinconNotification !==
                        "function"
                    ) {
                        return;
                    }


                    if (updateResult.result === "success") {

                        window.showWinconNotification(
                            "Wincon Update",
                            "起動時の自動アップデートが完了しました。キャッシュを再生成しました。",
                            5500
                        );

                    } else {

                        window.showWinconNotification(
                            "Wincon Update - Failed",
                            "自動アップデートに失敗しました。通常起動を続行します。原因: " +
                            updateResult.detail,
                            7000
                        );

                    }


                    // 通知後に結果を削除
                    try {
                        localStorage.removeItem(RESULT_KEY);
                        sessionStorage.removeItem(RESULT_KEY);
                    } catch (error) {
                        console.warn(error);
                    }

                    window.__WINCON_DAILY_UPDATE_RESULT__ = null;

                }, 1000);

            }

            return result;

        };

    }

    console.log(
        "[Wincon Update] Daily Auto Update initialized"
    );

})();

/* =========================================================
   Wincon iconImage integration - safe version
   既存のアプリ一覧・ファイルアプリには介入しない
========================================================= */
(() => {
    "use strict";

    const ICON_CLASS = "wincon-icon-image";

    const style = document.createElement("style");
    style.id = "winconSafeIconImageStyle";
    style.textContent = `
        .${ICON_CLASS} {
            display:inline-block;
            width:1.5em;
            height:1.5em;
            object-fit:contain;
            vertical-align:middle;
            flex:0 0 auto;
            border-radius:5px;
        }
        .title-left .${ICON_CLASS} { width:22px; height:22px; }
        .task-icon .${ICON_CLASS},
        .wincon-pinned-app .${ICON_CLASS} { width:26px; height:26px; }
        .wincon-tv-card-icon .${ICON_CLASS} { width:52px; height:52px; }
    `;
    document.head.appendChild(style);

    function findApp(title) {
        if (!title || !Array.isArray(menuItems)) return null;
        return menuItems.find(app =>
            app && app.title === title && app.iconImage
        ) || null;
    }

    function makeIcon(app) {
        if (!app || !app.iconImage) return null;

        const img = document.createElement("img");
        img.className = ICON_CLASS;
        img.src = app.iconImage;
        img.alt = app.title || "App icon";
        img.draggable = false;

        img.addEventListener("error", () => {
            img.replaceWith(document.createTextNode(app.icon || "📦"));
        }, { once: true });

        return img;
    }

    function setIconOnly(container, app) {
        if (!container || !app || !app.iconImage) return;
        if (container.dataset.winconSafeIconImage === "1") return;

        const img = makeIcon(app);
        if (!img) return;

        container.dataset.winconSafeIconImage = "1";
        container.replaceChildren(img);
    }

    function updateMenuIcons() {
        if (!Array.isArray(menuItems)) return;
        const buttons = document.querySelectorAll("#menu .menu-item");
        const visibleApps = menuItems.filter(app => app && !app.hidden);

        buttons.forEach((button, index) => {
            const app = visibleApps[index];
            if (!app || !app.iconImage ||
                button.dataset.winconSafeIconImage === "1") return;

            const img = makeIcon(app);
            if (!img) return;

            const label = document.createElement("span");
            label.textContent = app.title || "";

            button.dataset.winconSafeIconImage = "1";
            button.replaceChildren(img, label);
            button.style.display = "flex";
            button.style.alignItems = "center";
            button.style.gap = "10px";
        });
    }

    function updateTaskbarIcons() {
        document.querySelectorAll("#taskIcons .task-icon").forEach(task => {
            setIconOnly(task, findApp(task.title));
        });
    }

    function updateWindowIcons(win, title) {
        if (!win) return;
        const app = findApp(title || win.dataset.title);
        if (!app) return;
        const iconBox = win.querySelector(".titlebar .title-left > div:first-child");
        setIconOnly(iconBox, app);
    }

    // renderMenu の後だけメニューアイコンを適用。ボタンのクリック処理は保持。
    if (typeof renderMenu === "function" && !window.__WINCON_SAFE_RENDER_MENU__) {
        window.__WINCON_SAFE_RENDER_MENU__ = true;
        const originalRenderMenu = renderMenu;
        renderMenu = function (...args) {
            const result = originalRenderMenu.apply(this, args);
            updateMenuIcons();
            return result;
        };
    }

    // createWindow の元処理をそのまま実行し、戻り値のウィンドウだけを装飾。
    if (typeof createWindow === "function" && !window.__WINCON_SAFE_CREATE_WINDOW__) {
        window.__WINCON_SAFE_CREATE_WINDOW__ = true;
        const originalCreateWindow = createWindow;
        createWindow = function (options) {
            const win = originalCreateWindow.apply(this, arguments);
            if (win && options) {
                updateWindowIcons(win, options.title);
                const task = [...document.querySelectorAll("#taskIcons .task-icon")]
                    .reverse()
                    .find(element => element.title === options.title);
                setIconOnly(task, findApp(options.title));
            }
            return win;
        };
    }

    // 既に作成済みのメニュー／ウィンドウにも初回適用。
    updateMenuIcons();
    updateTaskbarIcons();
    document.querySelectorAll("#desktop .window").forEach(win => {
        updateWindowIcons(win);
    });

    // ピン留め領域だけを監視。ファイルアプリや他の画面には触れない。
    const taskbar = document.getElementById("taskbar");
    if (taskbar) {
        const pinnedObserver = new MutationObserver(() => {
            taskbar.querySelectorAll(".wincon-pinned-app").forEach(button => {
                setIconOnly(button, findApp(button.title));
            });
        });
        pinnedObserver.observe(taskbar, { childList: true, subtree: true });
    }

    // TVルートが後から作られた場合だけ検出し、そのルート内だけを監視。
    function attachTVObserver(root) {
        if (!root || root.dataset.winconSafeIconObserver === "1") return;
        root.dataset.winconSafeIconObserver = "1";

        const updateTVIcons = () => {
            root.querySelectorAll(".wincon-tv-card").forEach(card => {
                if (card.classList.contains("wincon-tv-exit-card")) return;
                const title = card.querySelector(".wincon-tv-card-title")?.textContent?.trim();
                const iconBox = card.querySelector(".wincon-tv-card-icon");
                setIconOnly(iconBox, findApp(title));
            });
        };

        updateTVIcons();
        const tvObserver = new MutationObserver(updateTVIcons);
        tvObserver.observe(root, { childList: true, subtree: true });
    }

    // Wincon TV の公開APIを通じて起動後、TVルートだけを監視。
    if (window.WinconTV && typeof window.WinconTV.open === "function" &&
        !window.__WINCON_SAFE_TV_OPEN__) {
        window.__WINCON_SAFE_TV_OPEN__ = true;
        const originalTVOpen = window.WinconTV.open;
        window.WinconTV.open = function (...args) {
            const result = originalTVOpen.apply(this, args);
            const root = document.getElementById("winconTVRoot");
            if (root) attachTVObserver(root);
            return result;
        };
    }

    const existingTVRoot = document.getElementById("winconTVRoot");
    if (existingTVRoot) attachTVObserver(existingTVRoot);

    console.log("[Wincon] Safe iconImage integration enabled");
})();

    document.head.appendChild(style);

    function appIcon(app, className = "wgm-icon") {
        const box = document.createElement("div");
        box.className = className;
        if (app && app.iconImage) {
            const img = document.createElement("img");
            img.src = app.iconImage;
            img.alt = app.title || "";
            img.draggable = false;
            img.onerror = () => { box.textContent = app.icon || "🎮"; };
            box.appendChild(img);
        } else {
            box.textContent = app?.icon || "🎮";
        }
        return box;
    }

    function ensureLauncher() {
        if (state.launcher) return state.launcher;
        const root = document.createElement("section");
        root.id = "winconGameMode";
        root.innerHTML = `
          <header class="wgm-top">
            <div><div class="wgm-heading">🎮 Game Mode</div><div class="wgm-subtitle">ゲームを選択してください</div></div>
            <div class="wgm-header-actions">
              <button class="wgm-hint-btn" type="button">ⓘ ヒントを見る</button>
              <button class="wgm-settings-btn" type="button">⚙ Launcher設定</button>
              <button class="wgm-desktop-btn" type="button">↩ デスクトップに戻る</button>
            </div>
          </header>
          <main class="wgm-grid" role="listbox" aria-label="ゲームランチャー"></main>
        `;
        root.querySelector(".wgm-desktop-btn").addEventListener("click", exitGameMode);
        root.querySelector(".wgm-hint-btn").addEventListener("click", showGameModeHelp);
        root.querySelector(".wgm-settings-btn").addEventListener("click", showLauncherSettings);
        document.body.appendChild(root);
        state.launcher = root;
        return root;
    }

    function getLaunchItems() {
        const items = [];
        const browser = (Array.isArray(menuItems) ? menuItems : []).find(x => x && x.type === "browser");
        const center = { title:"Module Center Game", icon:"🎮", type:"gamecenter", system:true };
        items.push(browser || { title:"Sail Browser", icon:"🌐", type:"browser", system:true });
        const allowAll = (() => { try { return localStorage.getItem("winconGameModeAllowAllApps") === "1"; } catch (_) { return false; } })();
        (Array.isArray(menuItems) ? menuItems : []).forEach(app => {
            if (!app || !app.title || app.hidden || app.type === "browser" || app.type === "gamecenter") return;
            // 通常モードで利用できる組み込みアプリと外部HTMLアプリを対象にする。
            // 電源操作など「アプリ起動」ではない項目はGame Modeの一覧に含めない。
            if (["shutdown", "reset"].includes(app.type)) return;
            if (app.type === "externalHTML") {
                if (app.isGame === true || allowAll) items.push(app);
            } else if (app.type === "wincon-native-app") {
                if (app.isGame === true || allowAll) items.push(app);
            } else if (allowAll && [
                "window", "popup", "file", "task", "settings", "assistant",
                "wincon-intelligence", "transfer", "terminal", "coreservice",
                "recovery", "browser", "appcenter", "appcenterdev", "diskutility",
                "horizon-directory", "horizon-note", "miniapps-builder", "miniapps-utility", "wincon-native-app"
            ].includes(app.type)) {
                items.push(app);
            }
        });
        items.push(center);
        return items.filter((item, index, all) => all.findIndex(x => x.title === item.title && x.type === item.type) === index);
    }

    function renderLauncher() {
        const root = ensureLauncher();
        const grid = root.querySelector(".wgm-grid");
        grid.replaceChildren();
        state.cards = getLaunchItems();
        state.selected = Math.max(0, Math.min(state.selected, state.cards.length - 1));

        if (!state.cards.length) {
            const empty = document.createElement("div");
            empty.className = "wgm-empty";
            empty.textContent = "起動できるアプリがありません。";
            grid.appendChild(empty);
            return;
        }

        state.cards.forEach((app, index) => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "wgm-card";
            card.setAttribute("role", "option");
            card.setAttribute("aria-selected", index === state.selected ? "true" : "false");
            card.appendChild(appIcon(app));
            const title = document.createElement("div");
            title.className = "wgm-title";
            title.textContent = app.title;
            card.appendChild(title);
            card.addEventListener("mouseenter", () => selectCard(index));
            card.addEventListener("click", () => launchItem(app));
            grid.appendChild(card);
        });
        updateSelection();
        const controls = launcherControls();
        if (controls.length && !state.launcher.contains(document.activeElement)) controls[0].focus({ preventScroll:true });
    }

    function updateSelection() {
        const grid = state.launcher?.querySelector(".wgm-grid");
        if (!grid) return;
        [...grid.children].forEach((card, index) => {
            card.classList.toggle("selected", index === state.selected);
            card.setAttribute("aria-selected", index === state.selected ? "true" : "false");
        });
    }

    function selectCard(index) {
        if (!state.cards.length) return;
        state.selected = (index + state.cards.length) % state.cards.length;
        updateSelection();
    }

    function closeAllDesktopApps() {
        // 通常ウィンドウとタスクバーの起動中アイコンをすべて終了
        document.querySelectorAll("#desktop .window").forEach(win => win.remove());
        document.querySelectorAll("#taskIcons .task-icon").forEach(task => task.remove());
        const menu = document.getElementById("menu");
        if (menu) menu.style.display = "none";
        const context = document.getElementById("contextMenu");
        if (context) context.style.display = "none";
        // 他のデスクトップ上の一時UIも閉じる
        document.querySelectorAll(".control-center.active,.notification-center.active").forEach(el => el.classList.remove("active"));
        try { if (typeof saveState === "function") saveState(); } catch (e) { console.warn(e); }
    }

    function showGameModeHelp(firstLaunch = false) {
        document.getElementById("wgmHelpFloat")?.remove();
        document.getElementById("wgmFirstHelp")?.remove();
        const panel = document.createElement("div");
        panel.id = "wgmFirstHelp";
        panel.className = "wgm-first-help";
        panel.innerHTML = `
          <div class="wgm-first-help-card" role="dialog" aria-modal="true" aria-labelledby="wgmHelpTitle">
            <h2 id="wgmHelpTitle">🎮 Game Mode の操作方法</h2>
            <p><b>アプリを選択：</b>矢印キー／コントローラーの方向キー・左スティック</p>
            <p><b>アプリを起動：</b>Enter／Aボタン／マウスクリック</p>
            <p><b>アプリを閉じる：</b>Backspace（ランチャーに戻ります）</p>
            <p><b>ランチャーに戻る：</b>PS／Xboxホームボタン</p>
            <p><b>デスクトップに戻る：</b>ランチャーの「デスクトップに戻る」</p>
            <p><b>Launcher設定：</b>「すべてのアプリをGame Modeで起動」を設定できます（非推奨）。</p>
            <p><b>タイトルバー：</b>アプリ表示中にマウスカーソルを画面上端へ移動</p>
            <button type="button">わかった</button>
          </div>`;
        panel.querySelector("button").addEventListener("click", () => {
            panel.remove();
            if (firstLaunch) { try { localStorage.setItem("winconGameModeHelpSeen", "1"); } catch (_) {} }
        });
        document.body.appendChild(panel);
    }

    function showLauncherSettings() {
        document.getElementById("wgmSettingsPanel")?.remove();
        const enabled = (() => { try { return localStorage.getItem("winconGameModeAllowAllApps") === "1"; } catch (_) { return false; } })();
        const panel = document.createElement("div");
        panel.id = "wgmSettingsPanel";
        panel.className = "wgm-settings-panel";
        panel.innerHTML = `<div class="wgm-settings-card" role="dialog" aria-modal="true" aria-labelledby="wgmSettingsTitle">
          <h2 id="wgmSettingsTitle">⚙ Launcher設定</h2>
          <label class="wgm-setting-row"><span><b>すべてのアプリをGame Modeで起動できるようにする（非推奨）</b><small>Game Mode非対応のアプリを表示するかの設定です。Game Mode非対応のアプリケーションは、動作が不安定になったりする可能性があります。ご了承ください</small></span><input id="wgmAllowAllApps" type="checkbox" ${enabled ? "checked" : ""} aria-label="すべてのアプリをGame Modeで起動できるようにする"></label>
