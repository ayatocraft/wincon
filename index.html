<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>Wincon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
overflow:hidden;
background:#1e1f22;
color:white;
width:100vw;
height:100vh;
}

#desktop{
position:fixed;
inset:0;
background:linear-gradient(135deg,#1f232a,#17191f);
overflow:hidden;
}

.window{
position:absolute;
background:#2b313b;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 25px 80px rgba(0,0,0,.45);
display:flex;
flex-direction:column;
overflow:hidden;
min-width:320px;
min-height:180px;
animation:openAnim .14s ease;
}

@keyframes openAnim{
from{
opacity:0;
transform:scale(.96);
}
to{
opacity:1;
transform:scale(1);
}
}

.window.maximized{
left:0 !important;
top:0 !important;
width:100vw !important;
height:calc(100vh - 52px) !important;
border-radius:0;
}

.titlebar{
height:42px;
background:#39414d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
cursor:move;
flex-shrink:0;
}

.title-left{
display:flex;
align-items:center;
gap:10px;
}

.window-controls{
display:flex;
gap:6px;
}

.win-btn{
width:32px;
height:32px;
border:none;
border-radius:8px;
background:#4d5767;
color:white;
cursor:pointer;
}

.win-btn:hover{
background:#64748b;
}

.content{
flex:1;
overflow:auto;
padding:14px;
background:#20242b;
}

#taskbar{
position:fixed;
left:0;
right:0;
bottom:0;
height:52px;
background:rgba(20,20,20,.92);
backdrop-filter:blur(12px);
display:flex;
align-items:center;
gap:10px;
padding:0 10px;
z-index:999999;
}

#menuBtn{
height:40px;
padding:0 16px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

#taskIcons{
display:flex;
gap:8px;
}

.task-icon{
width:40px;
height:40px;
border-radius:10px;
background:#3d4654;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.task-icon.minimized{
opacity:.45;
}

#menu{
position:fixed;
left:10px;
bottom:62px;
width:340px;
height:520px;
background:#2d333c;
border-radius:16px;
display:none;
flex-direction:column;
padding:12px;
overflow:auto;
z-index:99999999;
}

.menu-item{
width:100%;
min-height:48px;
border:none;
border-radius:10px;
background:#404a58;
color:white;
text-align:left;
padding:0 12px;
margin-bottom:8px;
cursor:pointer;
}

.menu-item:hover{
background:#556173;
}

#contextMenu{
position:fixed;
width:240px;
background:#2c313b;
border-radius:12px;
overflow:hidden;
display:none;
z-index:999999999;
}

.context-item{
height:42px;
display:flex;
align-items:center;
padding:0 12px;
cursor:pointer;
}

.context-item:hover{
background:#4c5769;
}

.action{
width:100%;
height:42px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

.setting-group{
background:#343b46;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}

input,
select,
textarea{
width:100%;
height:42px;
border:none;
border-radius:10px;
background:#4d5767;
color:white;
padding:0 10px;
margin-top:8px;
}

textarea{
height:260px;
resize:none;
padding:10px;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

.resize-handle{
position:absolute;
right:0;
bottom:0;
width:18px;
height:18px;
cursor:nwse-resize;
}

.spinner{
width:64px;
height:64px;
border:5px solid rgba(255,255,255,.2);
border-top:5px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

#bootScreen{
position:fixed;
inset:0;
background:#111;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:18px;
z-index:999999999;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:999px;
background:#475569;
font-size:12px;
margin-top:8px;
}
#tray{

margin-left:auto;

display:flex;

align-items:center;

gap:8px;

height:100%;

}


#networkStatus,
#batteryStatus,
#clock{

height:40px;

padding:4px 10px;

border-radius:10px;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

background:transparent;

}


#networkStatus:hover,
#batteryStatus:hover,
#clock:hover{

background:#3d4654;

}


#batteryStatus{

gap:4px;

font-size:16px;

}


#clock{

flex-direction:column;

line-height:16px;

min-width:75px;

}


#time{

font-size:15px;

font-weight:600;

}


#date{

font-size:11px;

opacity:.8;

}
#controlCenter{

position:fixed;

right:10px;

bottom:62px;

width:320px;

background:#2d333c;

border-radius:16px;

padding:16px;

display:none;

z-index:999999999;

box-shadow:
0 20px 60px rgba(0,0,0,.5);

}


.cc-card{

background:#39414d;

border-radius:12px;

padding:12px;

margin-bottom:10px;

}


.cc-card p{

margin-top:8px;

opacity:.9;

}
#batteryBar{

width:100%;

height:18px;

background:#444;

border-radius:10px;

overflow:hidden;

margin-top:10px;

}


#batteryFill{

height:100%;

width:0%;

background:#22c55e;

transition:.3s;

}


.icon-toggle{

width:50px;

height:50px;

border:none;

border-radius:14px;

font-size:24px;

cursor:pointer;

background:#2563eb;

color:white;

}


.icon-toggle:hover{

opacity:.8;

}
#winconUACOverlay {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    display: none;

    align-items: center !important;
    justify-content: center !important;

    background:
        rgba(0, 0, 0, 0.7);

    z-index: 2147483647 !important;

    margin: 0 !important;
    padding: 0 !important;

    transform: none !important;
}


#winconUACOverlay.show {

    display: flex !important;

}


#winconUACDialog {

    position:relative !important;

    width:560px !important;
    height:360px !important;

    max-width:calc(100vw - 40px);
    max-height:calc(100vh - 40px);

    min-width:0;
    min-height:0;

    box-sizing:border-box;

}
#winconUACDialog {

    position: relative !important;

    left: auto !important;
    top: auto !important;

    width: 560px !important;
    height: 360px !important;

    max-width: calc(100vw - 40px) !important;
    max-height: calc(100vh - 40px) !important;

    min-width: 0 !important;
    min-height: 0 !important;

    margin: 0 !important;

    display: flex !important;
    flex-direction: column !important;

    box-sizing: border-box !important;

    z-index: 2147483647 !important;

    transform: none !important;

    opacity: 1 !important;
    visibility: visible !important;

    pointer-events: auto !important;
}


#winconUACIcon{
    font-size:42px;
    line-height:1;
}


#winconUACTitle{
    font-size:22px;
    font-weight:600;
    margin-bottom:12px;
}


#winconUACAppName{
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}


#winconUACDescription{
    font-size:14px;
    opacity:.8;
    line-height:1.5;
}


#winconUACButtons{

    margin-top:auto;

    display:flex;
    justify-content:flex-end;
    gap:10px;

}


#winconUACButtons .action{

    min-width:100px;
    height:40px;

}

/* ========================================
   Wincon UAC - Absolute Top Layer
   ======================================== */

#winconUACOverlay {

    position: fixed !important;

    inset: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    display: none !important;

    align-items: center !important;
    justify-content: center !important;

    margin: 0 !important;
    padding: 0 !important;

    background:
        rgba(0, 0, 0, .70) !important;

    z-index: 2147483647 !important;

    transform: none !important;

    isolation: isolate !important;

    pointer-events: auto !important;
}

#winconUACOverlay.show {

    display: flex !important;

}

#winconUACOverlay
#winconUACDialog {

    flex: 0 0 auto !important;

    opacity: 1 !important;
    visibility: visible !important;

    pointer-events: auto !important;

    z-index: 2147483647 !important;

    animation: none !important;
}

#winconUACOverlay
#winconUACDialog .titlebar {

    flex-shrink: 0 !important;

}

#winconUACOverlay
#winconUACDialog .content {

    flex: 1 !important;

    min-height: 0 !important;

    display: flex !important;

    flex-direction: column !important;

    padding: 28px !important;

    box-sizing: border-box !important;

    gap: 16px !important;

    overflow: auto !important;
}

#winconNotificationLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2147483647;

    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;

    padding: 20px;
    gap: 10px;

    box-sizing: border-box;
}

#winconNotificationLayer {
    position: fixed !important;

    top: 20px !important;
    right: 20px !important;

    width: 380px;
    max-width: calc(100vw - 40px);

    display: flex;

    flex-direction: column;
    align-items: flex-end;

    gap: 10px;

    pointer-events: none;

    z-index: 2147483647 !important;

    isolation: isolate;
}

.wincon-notification {
    position: relative;

    pointer-events: auto;

    width: 100%;
    box-sizing: border-box;

    padding: 14px 16px;

    border-radius: 12px;

    background: rgba(32, 32, 32, 0.96);

    color: white;

    border: 1px solid rgba(255, 255, 255, 0.15);

    box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);

    opacity: 0;

    transform: translateX(40px);

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.wincon-notification.visible {
    opacity: 1;
    transform: translateX(0);
}

.wincon-notification.removing {
    opacity: 0;
    transform: translateX(40px);
}

.wincon-notification-title {
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 5px;
}

.wincon-notification-message {
    font-size: 13px;
    line-height: 1.5;

    white-space: pre-line;
}
</style>
</head>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
        try {
            await navigator.serviceWorker.register("./sw.js");
            console.log("Service Worker登録完了");
        } catch (e) {
            console.error("Service Worker登録失敗", e);
        }
    });
}
const ENTERPRISE_STORAGE_KEY="winconEnterpriseApps";
const ably = new Ably.Realtime({
  token:"YOUR_TOKEN"
});

const ablyChannel =
ably.channels.get(
  "wincon-appcenter"
);
function loadEnterpriseApps(){

try{

const data=JSON.parse(
localStorage.getItem(
ENTERPRISE_STORAGE_KEY
)||"[]"
);

if(Array.isArray(data)){
window.__WINCON_ENTERPRISE_APPS__=data;
}

}catch(e){

window.__WINCON_ENTERPRISE_APPS__=[];

}

}

function saveEnterpriseApps(){

localStorage.setItem(
ENTERPRISE_STORAGE_KEY,
JSON.stringify(
window.__WINCON_ENTERPRISE_APPS__
)
);

}

const desktop=document.getElementById("desktop");
const menu=document.getElementById("menu");
const contextMenu=document.getElementById("contextMenu");
const taskIcons=document.getElementById("taskIcons");

let zIndexCounter=100;

window.__WINCON_ENTERPRISE_APPS__=
window.__WINCON_ENTERPRISE_APPS__||[];
loadEnterpriseApps();
let menuItems=JSON.parse(
localStorage.getItem("winconMenuItems")||"null"
)||[
{
title:"テストウィンドウ",
icon:"🪟",
type:"window"
},
{
title:"テストポップアップ",
icon:"⚠️",
type:"popup"
},
{
  title:"Sail Browser",
  icon:"🌐",
  type:"browser",
  system:true
},
{
title:"ファイル",
icon:"📁",
type:"file",
system:true
},
{
  title:"Module Center",
  icon:"📦",
  type:"appcenter",
  system:true
},
{
  title:"Module Center Developer",
  icon:"🛠️",
  type:"appcenterdev",
  system:true
},
{
title:"タスクマネージャ",
icon:"📊",
type:"task",
system:true
},
{
id: "wincon-assistant",
title: "Wincon Assistant",
icon: "🤖",
type: "assistant",
system: true,
hidden:true
},
{
title:"システム設定",
icon:"⚙️",
type:"settings",
system:true
},
{
title:"リカバリ",
icon:"🛠️",
type:"recovery",
system:true,
hidden:true
},
{
title:"電源を切る",
icon:"⏻",
type:"shutdown",
system:true
},
{
title:"お引越し",
icon:"📦",
type:"transfer",
system:true,
hidden:true
},

{
  title:"ターミナル",
  icon:"⌨️",
  type:"terminal",
  system:true
},
,{
  title:"Wincon Core Service",
  icon:"⚙️",
  type:"coreservice",
  system:true,
  hidden:false
},

{
  title:"Wincon Reset Center",
  icon:"🧹",
  type:"reset",
  system:true,
  hidden:true
}
];

function mergeEnterpriseApps(){

if(
!Array.isArray(
window.__WINCON_ENTERPRISE_APPS__
)
){
window.__WINCON_ENTERPRISE_APPS__=[];
}

menuItems=
menuItems.filter(
m=>!m.enterprise
);

window.__WINCON_ENTERPRISE_APPS__
.forEach(app=>{

menuItems.unshift({
...app,
enterprise:true
});

});

}

function boot(){

mergeEnterpriseApps();

renderMenu();

restoreState();

setupSecurityShortcut();

startTutorial();

}

setTimeout(()=>{

const bootScreen=document.getElementById("bootScreen");

if(bootScreen){
bootScreen.remove();
}

boot();

},1200);

function setupSecurityShortcut(){

window.addEventListener("keydown",e=>{

if(e.ctrlKey&&e.shiftKey){
openSecurityOptions();
}

if(e.key==="Escape"){
openSystemSettings(true);
}

});

}
function fullFactoryReset(){

if(
!confirm(
"完全初期化しますか？企業モジュールも削除されます。"
)
){
return;
}

localStorage.clear();

location.reload();

}
let hiddenCommand="";

window.addEventListener(
"keydown",
e=>{

hiddenCommand+=e.key;

hiddenCommand=
hiddenCommand.slice(-20);

if(
hiddenCommand
.toLowerCase()
.includes("fullreset")
){

fullFactoryReset();

}

}
);
document.getElementById("menuBtn").onclick=()=>{

menu.style.display=
menu.style.display==="flex"
?"none"
:"flex";

};

function renderMenu(){

menu.innerHTML="";

menuItems.forEach(item=>{

if(item.hidden)return;

const btn=document.createElement("button");

btn.className="menu-item";

btn.innerHTML=
`${item.icon} ${item.title}`;

btn.onclick=()=>{

menu.style.display="none";

switch(item.type){

case "window":
openTestWindow();
break;
case "coreservice":
openCoreService();
break;
case "popup":
openTestPopup();
break;

case "file":
openFileManager();
break;

case "task":
openTaskManager();
break;

case "settings":
openSystemSettings(false);
break;

case "recovery":
openRecovery();
break;

case "shutdown":
shutdownSystem();
break;
        
case "assistant":
toggleWinconAssistant();
break;
        
case "externalHTML":
openExternalHTML(item);
break;

case "transfer":
openTransferApp();
break;

case "terminal":
openTerminal();
break;

case "reset":
openResetCenter();
break;

case "browser":
openBrowser();
break;
case "appcenter":
  openAppCenter();
  break;

case "appcenterdev":
  openAppCenterDeveloper();
  break;
}

};

menu.appendChild(btn);

});

}

function createWindow(options){

const {
title="Window",
icon="🪟",
content="",
width=700,
height=450,
popup=false,
safe=false
}=options;

const win=document.createElement("div");
win.dataset.popup = popup ? "true" : "false";
win.className="window";

win.style.width=(popup?560:width)+"px";
win.style.height=(popup?360:height)+"px";

win.style.left=
Math.random()*240+80+"px";

win.style.top=
Math.random()*120+60+"px";

win.style.zIndex=++zIndexCounter;

win.dataset.title=title;

win.innerHTML=`

<div class="titlebar">

<div class="title-left">
<div>${icon}</div>
<div>${title}</div>
</div>

<div class="window-controls">

${popup?"":`
<button class="win-btn min-btn">
<i class="fa-solid fa-minus"></i>
</button>
`}

${popup||safe?"":`
<button class="win-btn max-btn">
<i class="fa-regular fa-square"></i>
</button>
`}

${safe?"":`
<button class="win-btn close-btn">
<i class="fa-solid fa-xmark"></i>
</button>
`}

</div>

</div>

<div class="content">
${content}
</div>

${popup?"":"<div class='resize-handle'></div>"}

`;

desktop.appendChild(win);

const task=document.createElement("div");

task.className="task-icon";
task.innerHTML=icon;
task.title=title;

taskIcons.appendChild(task);

task.onclick=()=>{

win.style.display="flex";

task.classList.remove("minimized");

win.style.zIndex=++zIndexCounter;

};

const titlebar=win.querySelector(".titlebar");

let dragging=false;
let offsetX=0;
let offsetY=0;

titlebar.addEventListener("mousedown",e=>{

dragging=true;

offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;

win.style.zIndex=++zIndexCounter;

});

window.addEventListener("mousemove",e=>{

if(!dragging)return;

if(win.classList.contains("maximized"))
return;

win.style.left=
e.clientX-offsetX+"px";

win.style.top=
e.clientY-offsetY+"px";

});

window.addEventListener("mouseup",()=>{
dragging=false;
});

const resize=win.querySelector(".resize-handle");

if(resize){

let resizing=false;
let startX,startY,startW,startH;

resize.addEventListener("mousedown",e=>{

resizing=true;

startX=e.clientX;
startY=e.clientY;

startW=win.offsetWidth;
startH=win.offsetHeight;

e.preventDefault();

});

window.addEventListener("mousemove",e=>{

if(!resizing)return;

win.style.width=
startW+(e.clientX-startX)+"px";

win.style.height=
startH+(e.clientY-startY)+"px";

});

window.addEventListener("mouseup",()=>{
resizing=false;
});

}

const closeBtn=win.querySelector(".close-btn");
const maxBtn=win.querySelector(".max-btn");
const minBtn=win.querySelector(".min-btn");

if(closeBtn){

closeBtn.onclick=()=>{

task.remove();
win.remove();

saveState();

};

}

if(maxBtn){

maxBtn.onclick=()=>{

win.classList.toggle("maximized");

};

}

if(minBtn){

minBtn.onclick=()=>{

win.style.display="none";

task.classList.add("minimized");

};

}

saveState();

return win;

}

)
);

);

// ========================================

const WINCON_API_ALLOWED_ORIGIN =
    "https://ayatocraft.github.io";

const winconAPIWindows = new Map();


// ----------------------------------------
// API初期化
// ----------------------------------------

function initWinconAppAPI() {

    window.addEventListener(
        "message",
        handleWinconAppMessage
    );

    console.log(
        "[Wincon API] Ready"
    );
}


// ----------------------------------------
// Message受信
// ----------------------------------------

function handleWinconAppMessage(event) {

    if (
        event.origin !==
        WINCON_API_ALLOWED_ORIGIN
    ) {
        return;
    }

    const data = event.data;

    if (
        !data ||
        data.type !== "wincon"
    ) {
        return;
    }

    switch (data.action) {

        case "getApps":

            winconAPIGetApps(event);

            break;


        case "searchApps":

            winconAPISearchApps(
                event,
                data
            );

            break;


        case "openWindow":

            winconAPIOpenWindow(
                event,
                data
            );

            break;


        case "launchApp":

            winconAPILaunchApp(
                event,
                data
            );

            break;


        case "closeWindow":

            winconAPICloseWindow(
                event,
                data
            );

            break;


        case "setWindowTitle":

            winconAPISetWindowTitle(
                event,
                data
            );

            break;


        default:

            winconAPISend(
                event,
                "error",
                {
                    message:
                        "Unknown API action",
                    action:
                        data.action
                }
            );

    }

}


// ----------------------------------------
// APIレスポンス
// ----------------------------------------

function winconAPISend(
    event,
    action,
    data = {}
) {

    if (
        !event.source ||
        !event.source.postMessage
    ) {
        return;
    }

    event.source.postMessage(

        {
            type: "wincon",
            action,
            ...data
        },

        event.origin

    );

}


// ----------------------------------------
// App情報を作る
// ----------------------------------------

function winconAPIFormatApp(
    app,
    index
) {

    return {

        id:
            app.id ||
            app.appId ||
            app.title ||
            "app-" + index,

        title:
            app.title || "",

        icon:
            app.icon || "🌐",

        type:
            app.type || "app",

        popup:
            !!app.popup,

        system:
            !!app.system,

        enterprise:
            !!app.enterprise

    };

}


// ----------------------------------------
// App一覧
// ----------------------------------------

function winconAPIGetApps(event) {

    const apps =
        menuItems.map(
            winconAPIFormatApp
        );

    winconAPISend(
        event,
        "apps",
        {
            apps
        }
    );

}


// ----------------------------------------
// App検索
// ----------------------------------------

function winconAPISearchApps(
    event,
    data
) {

    const query =
        String(
            data.query || ""
        )
        .trim()
        .toLowerCase();


    const apps =
        menuItems

        .filter(app => {

            const title =
                String(
                    app.title || ""
                ).toLowerCase();

            const type =
                String(
                    app.type || ""
                ).toLowerCase();

            return (
                title.includes(query) ||
                type.includes(query)
            );

        })

        .map(
            winconAPIFormatApp
        );


    winconAPISend(
        event,
        "searchResults",
        {
            query,
            apps
        }
    );

}


// ----------------------------------------
// App起動
// ----------------------------------------

function winconAPILaunchApp(
    event,
    data
) {

    if (!data.appId) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "appId is required"
            }
        );

        return;

    }


    const app =
        menuItems.find(
            (item, index) => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id ===
                    data.appId
                );

            }
        );


    if (!app) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "App not found",

                appId:
                    data.appId
            }
        );

        return;

    }


    winconOpenAppAPI(app);


    winconAPISend(
        event,
        "launchResult",
        {
            success: true,

            appId:
                data.appId,

            title:
                app.title
        }
    );

}

// ----------------------------------------
// 外部HTML Windowを開く
// ----------------------------------------

function winconAPIOpenWindow(event, data) {

    if (!data.url) {

        winconAPISend(
            event,
            "error",
            {
                message: "url is required"
            }
        );

        return;
    }


    const windowId =
        "wincon-" +
        crypto.randomUUID();


    const separator =
        data.url.includes("?")
            ? "&"
            : "?";


    const finalURL =
        data.url +
        separator +
        "winconWindowId=" +
        encodeURIComponent(windowId);


    const win =
        createWindow({

            title:
                data.title ||
                "Wincon App",

            icon:
                data.icon ||
                "🌐",

            width:
                Number(data.width) ||
                800,

            height:
                Number(data.height) ||
                600,

            popup:
                data.popup === true ||
                data.windowType === "popup",

            content: `
                <iframe
                    src="${finalURL}"
                    style="
                        width:100%;
                        height:100%;
                        border:0;
                    "
                ></iframe>
            `

        });


    win.dataset.apiWindowId =
        windowId;


    winconAPIWindows.set(
        windowId,
        win
    );


    winconAPISend(
        event,
        "windowOpened",
        {
            success: true,
            windowId: windowId
        }
    );

}


// ----------------------------------------
// Windowを閉じる
// ----------------------------------------

function winconAPICloseWindow(
    event,
    data
) {

    const win =
        winconAPIWindows.get(
            data.windowId
        );


    if (!win) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "Window not found",

                windowId:
                    data.windowId
            }
        );

        return;

    }


    win.remove();


    winconAPIWindows.delete(
        data.windowId
    );


    winconAPISend(
        event,
        "windowClosed",
        {
            success: true,

            windowId:
                data.windowId
        }
    );

}


// ----------------------------------------
// Windowタイトル変更
// ----------------------------------------

function winconAPISetWindowTitle(
    event,
    data
) {

    const win =
        winconAPIWindows.get(
            data.windowId
        );


    if (!win) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "Window not found",

                windowId:
                    data.windowId
            }
        );

        return;

    }


    const title =
        data.title ||
        "Wincon App";


    win.dataset.title =
        title;


    const titleElement =
        win.querySelector(
            ".title-left div:last-child"
        );


    if (titleElement) {

        titleElement.textContent =
            title;

    }


    /*
     * タスクバーアイコンのタイトルも更新
     */

    const taskIcon =
        [...document.querySelectorAll(
            ".task-icon"
        )]
        .find(
            icon =>
                icon.title ===
                win.dataset.title
        );


    if (taskIcon) {

        taskIcon.title =
            title;

    }


    winconAPISend(
        event,
        "titleChanged",
        {
            success: true,

            windowId:
                data.windowId,

            title
        }
    );

}


// ----------------------------------------
// Wincon Windowが閉じられたときの後処理

function winconAPIForgetWindow(
    win
) {

    for (

    ) {

        if (
            storedWindow ===

                windowId
            );

        }

    }

}

// ----------------------------------------

async function winconInstallModule(
    module
) {

    // ------------------------------------
    // モジュール情報チェック
    // ------------------------------------

    if (
        !module ||
        typeof module !== "object"
    ) {

        return {
            success: false,
            reason: "invalid-module"
        };

    }


    if (!module.id) {

        return {
            success: false,
            reason: "missing-id"
        };

    }


    // ------------------------------------
    // 既にインストールされているか確認
    // ------------------------------------

    const alreadyInstalled =
        menuItems.some(
            item => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id === module.id
                );

            }
        );


    if (alreadyInstalled) {

        return {
            success: false,
            reason: "already-installed"
        };

    }


    // ------------------------------------
    // UAC
    // ------------------------------------

    const allowed =
        await requestWinconUAC({

            title:
                module.title ||
                module.name ||
                "不明なアプリ",

            icon:
                module.icon ||
                "📦",

            description:
                module.description ||
                "このモジュールをWinconにインストールします。"

        });


    // ------------------------------------
    // UAC拒否
    // ------------------------------------

    if (!allowed) {

        return {
            success: false,
            reason: "uac-denied"
        };

    }


    // ------------------------------------
    // Module作成
    // ------------------------------------

    const newModule = {

        id:
            module.id,

        title:
            module.title ||
            module.name ||
            "名称未設定",

        icon:
            module.icon ||
            "📦",

        type:
            module.type ||
            "window",

        content:
            module.content ||
            "",

        source:
            module.source ||
            "",

        version:
            module.version ||
            "1.0.0",

        description:
            module.description ||
            "",

        system:
            false,

        thirdParty:
            true

    };


    // ------------------------------------
    // menuItemsへ追加
    // ------------------------------------

    menuItems.push(
        newModule
    );


    // ------------------------------------
    // 保存
    // ------------------------------------

    localStorage.setItem(
        "winconMenuItems",
        JSON.stringify(
            menuItems
        )
    );


    saveState();


    // ------------------------------------
    // メニュー更新
    // ------------------------------------

    if (
        typeof renderMenu ===
        "function"
    ) {

        renderMenu();

    }


    console.log(
        "[Wincon Module API] Module installed:",
        newModule.id
    );


    return {

        success:
            true,

        module:
            winconAPIFormatApp(
                newModule,
                menuItems.length - 1
            )

    };

}


// ----------------------------------------
// Moduleインストール確認
// ----------------------------------------

function winconIsModuleInstalled(
    id
) {

    if (!id) {

        return false;

    }


    return menuItems.some(
        item => {

            const itemId =
                item.id ||
                item.appId ||
                item.title;

            return (

            );

        }
    );

// ----------------------------------------
// Third-party Module一覧
// ----------------------------------------

function winconGetInstalledModules() {
    return menuItems

let winconUACResolve = null;
let winconUACActive = false;


// ----------------------------------------
// UACを表示
// ----------------------------------------

function requestWinconUAC(options = {}) {

    const overlay =
        document.getElementById(
            "winconUACOverlay"
        );

    if (!overlay) {

        console.error(
            "[Wincon UAC] Overlay not found"
        );

        return Promise.resolve(false);
    }


    // 既に表示中なら拒否
    if (winconUACActive) {

        return Promise.resolve(false);
    }


    winconUACActive = true;


    const appName =
        document.getElementById(
            "winconUACAppName"
        );

    const appIcon =
        document.getElementById(
            "winconUACIcon"
        );

    const description =
        document.getElementById(
            "winconUACDescription"
        );


    if (appName) {

        appName.textContent =
            options.title ||
            "不明なアプリ";

    }


    if (appIcon) {

        appIcon.textContent =
            options.icon ||
            "🛡️";

    }


    if (description) {

        description.textContent =
            options.description ||
            "このアプリはWinconに変更を加えようとしています。";

    }


    overlay.classList.add(
        "show"
    );


    return new Promise(resolve => {

        winconUACResolve =
            resolve;

    });

}


// ----------------------------------------
// UACを閉じる
// ----------------------------------------

function closeWinconUAC(result = false) {

    const overlay =
        document.getElementById(
            "winconUACOverlay"
        );


    if (overlay) {

        overlay.classList.remove(
            "show"
        );

    }


    winconUACActive = false;


    if (typeof winconUACResolve === "function") {

        const resolve =
            winconUACResolve;


        winconUACResolve =
            null;


        resolve(
            result
        );

    }

}

// Wincon Module API

// Third-party Module Installer

// ----------------------------------------
// Moduleインストール
// ----------------------------------------

async function winconInstallModule(
    module
) {

    // ------------------------------------
    // モジュール情報チェック
    // ------------------------------------

    if (
        !module ||
        typeof module !== "object"
    ) {

        return {
            success: false,
            reason: "invalid-module"
        };

    }


    if (!module.id) {

        return {
            success: false,
            reason: "missing-id"
        };

    }


    // ------------------------------------
    // 既にインストールされているか確認
    // ------------------------------------

    const alreadyInstalled =
        menuItems.some(
            item => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id === module.id
                );

            }
        );


    if (alreadyInstalled) {

        return {
            success: false,
            reason: "already-installed"
        };

    }


    // ------------------------------------
    // UAC
    // ------------------------------------

    const allowed =
        await requestWinconUAC({

            title:
                module.title ||
                module.name ||
                "不明なアプリ",

            icon:
                module.icon ||
                "📦",

            description:
                module.description ||
                "このモジュールをWinconにインストールします。"

        });


    // ------------------------------------
    // UAC拒否
    // ------------------------------------

    if (!allowed) {

        return {
            success: false,
            reason: "uac-denied"
        };

    }


    // ------------------------------------
    // Module作成
    // ------------------------------------

    const newModule = {

        id:
            module.id,

        title:
            module.title ||
            module.name ||
            "名称未設定",

        icon:
            module.icon ||
            "📦",

        type:
            module.type ||
            "window",

        content:
            module.content ||
            "",

        source:
            module.source ||
            "",

        version:
            module.version ||
            "1.0.0",

        description:
            module.description ||
            "",

        system:
            false,

        thirdParty:
            true

    };


    // ------------------------------------
    // menuItemsへ追加
    // ------------------------------------

    menuItems.push(
        newModule
    );


    // ------------------------------------
    // 保存
    // ------------------------------------

    localStorage.setItem(
        "winconMenuItems",
        JSON.stringify(
            menuItems
        )
    );


    saveState();


    // ------------------------------------
    // メニュー更新
    // ------------------------------------

    if (
        typeof renderMenu ===
        "function"
    ) {

        renderMenu();

    }


    console.log(
        "[Wincon Module API] Module installed:",
        newModule.id
    );


    return {

        success:
            true,

        module:
            winconAPIFormatApp(
                newModule,
                menuItems.length - 1
            )

    };

}


// ----------------------------------------
// Moduleインストール確認
// ----------------------------------------

function winconIsModuleInstalled(
    id
) {

    if (!id) {

        return false;

    }


    return menuItems.some(
        item => {

            const itemId =
                item.id ||
                item.appId ||
                item.title;

            return (
                itemId === id
            );

        }
    );

}


// ----------------------------------------
// Third-party Module一覧
// ----------------------------------------

function winconGetInstalledModules() {
    return menuItems
        .filter(item => item.thirdParty === true)
        .map((item, index) => winconAPIFormatApp(item, index));
}

        if (item.type === "tv") {
            return false;
        }

        /* PopupはTVアプリ一覧に出さない */
        if (
            item.type === "popup" ||
            item.popup === true
        ) {
            return false;
        }

        /* shutdownはTVモードでは利用不可 */
        if (item.type === "shutdown") {
            return false;

        /*

         * 現在のTVセッション中だけ除外

        if (
            tvState.failedApps &&
            tvState.failedApps.has(item.title)

    notice.className =
        "wincon-tv-exclusion-notice";

    /* =====================================================

   function launchSelectedTVApp() {

 if (app.type === "shutdown") {

     *
     * そのためWindow待ちをせず、

            app.title,
            e
        );

     */
    if (launchFailed) {

            app.title
        );

                        win.dataset.popup !==
                        "true"

            /*

            if (tvWindows.length) {

                clearInterval(
                    waitForWindow
                );

                const target =
                    tvWindows[
                        tvWindows.length - 1
                    ];

                promoteWindowToTV(
                    target
                );

                return;
            }

            /*
             * Popupだけ生成された場合
             *
             * Popupは正常なので、
             * 起動失敗にはしない。
             */
            if (
                newWindows.length &&
                newWindows.every(
                    win =>
                        win.dataset.popup ===
                        "true"
                )
            ) {

                clearInterval(
                    waitForWindow
                );

                newWindows.forEach(
                    win => {

                        win.style.display =
                            "flex";

                        win.style.zIndex =
                            "2147483646";

                    }
                );

                /*
                 * Popupを開いただけなので
                 * TVアプリ画面としては終了。
                 */
                tvState.page = "home";
                tvState.currentAppTitle =
                    null;

                renderTVHome();

                return;
            }

            attempts++;

            /*
             * 3秒経過
             */
           if (attempts >= 20) {

    clearInterval(
        waitForWindow
    );

    console.warn(
        "[Wincon TV] Window生成待ちがタイムアウト:",
        app.title
    );

    if (!tvState.failedApps) {
        tvState.failedApps = new Set();
    }

    tvState.failedApps.add(
        app.title
    );

    showWinconNotification(
        "Wincon TV",
        `「${app.title}」はTVモードでは利用できないため、除外されました。`
    );

    tvState.currentAppTitle = null;
    tvState.page = "home";

    document.body.classList.remove(
        "wincon-tv-app-active"
    );

    setTimeout(() => {
        renderTVHome();
    }, 1200);
}

        }, 50);
}

function markTVAppFailed(appTitle) {

    /* =====================================================
       TV Window
    ===================================================== */

    function promoteWindowToTV(current) {

    if (!current) {
        return;
    }

    /*
     * Popupは絶対にTV化しない
     */
    if (
        current.dataset.popup === "true"
    ) {

        current.classList.remove(
            "wincon-tv-app-window"
        );

        current.style.display =
            "flex";

        current.style.zIndex =
            "2147483646";

        return;
    }

    /*
     * 他の通常Windowを非表示
     *
     * PopupとUACは除外。
     */
    document
        .querySelectorAll(".window")
        .forEach(win => {

            if (win === current) {
                return;
            }

            /*
             * Popup
             */
            if (
                win.dataset.popup ===
                "true"
            ) {

                win.style.display =
                    "flex";

                win.style.zIndex =
                    "2147483646";

                return;
            }

            /*
             * UAC
             */
            if (
                win.id ===
                "winconUACDialog"
            ) {
                return;
            }

            win.style.display =
                "none";
        });

    current.style.display =
        "flex";

    current.classList.add(
        "wincon-tv-app-window"
    );

    current.style.zIndex =
        "2147483200";

    document.body.classList.add(
        "wincon-tv-app-active"
    );

    /*
     * 最小化・最大化ボタンを隠す
     */
    const min =
        current.querySelector(
            ".min-btn"
        );

    const max =
        current.querySelector(
            ".max-btn"
        );

    if (min) {
        min.style.display =
            "none";
    }

    if (max) {
        max.style.display =
            "none";
    }

    /*
     * 閉じるボタン
     */
    const close =
        current.querySelector(
            ".close-btn"
        );

    if (close) {

        close.style.display = "";

        close.addEventListener(
            "click",
            () => {

                setTimeout(() => {

                    if (
                        tvState.active
                    ) {
                        renderTVHome();
                    }

                }, 0);

            },
            {
                once: true
            }
        );
    }
}

    document

             */
            if (

            ) {

             */
            if (
                win.dataset.popup ===
                "true"
            ) {

                win.style.display =

    /* =====================================================
       Selection
    ===================================================== */

    function moveSelection(dx, dy) {

        if (tvState.page !== "home") {
            return;
        }

        const apps = getTVApps();

        if (!apps.length) return;

        const grid =
            document.getElementById(
                "winconTVGrid"
            );

        if (!grid) return;

        const cards =
            [
                ...grid.querySelectorAll(
                    ".wincon-tv-card"
                )
            ];

        /*
         * 最後のカードはTV終了。
         */

        const total = cards.length;

        /*
         * 実際のグリッド列数を取得
         */

        let columns = 1;

        if (cards.length > 1) {

            const firstTop =
                cards[0]
                    .getBoundingClientRect()
                    .top;

            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                const top =
                    cards[i]
                        .getBoundingClientRect()
                        .top;

                if (
                    Math.abs(
                        top - firstTop
                    ) < 5
                ) {
                    columns++;
                } else {
                    break;
                }

            }

        }

        columns = Math.max(
            1,
            columns - 1
        );

        let next =
            tvState.selectedIndex;

        if (dx !== 0) {
            next += dx;
        }

        if (dy !== 0) {
            next += dy * columns;
        }

        next = Math.max(
            0,
            Math.min(
                total - 1,
                next
            )
        );

        if (
            next ===
            tvState.selectedIndex
        ) {
            return;
        }

        tvState.selectedIndex = next;

        renderTVHome();

        const selected =
            document.querySelector(
                `.wincon-tv-card[data-index="${next}"]`
            );

        if (selected) {

            selected.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

        }

    }


    /* =====================================================
       Key Handling
    ===================================================== */

    function handleTVKey(event) {

        if (!tvState.active) {
            return;
        }

        /*
         * キーマップ設定中は
         * キーマップモジュール側へ渡す。
         */

        if (tvState.waitingForKey) {
            return;
        }

        const key = event.key;

        if (key === tvKeyMap.up) {

            event.preventDefault();

            moveSelection(0, -1);

            return;
        }

        if (key === tvKeyMap.down) {

            event.preventDefault();

            moveSelection(0, 1);

            return;
        }

        if (key === tvKeyMap.left) {

            event.preventDefault();

            moveSelection(-1, 0);

            return;
        }

        if (key === tvKeyMap.right) {

            event.preventDefault();

            moveSelection(1, 0);

            return;
        }

        if (key === tvKeyMap.select) {

            event.preventDefault();

            if (
                tvState.page === "home"
            ) {

                const apps =
                    getTVApps();

                /*
                 * TV終了カード
                 */

                const grid =
                    document.getElementById(
                        "winconTVGrid"
                    );

                const cards =
                    grid
                        ? [
                            ...grid.querySelectorAll(
                                ".wincon-tv-card"
                            )
                        ]
                        : [];

                if (
                    tvState.selectedIndex >=
                    apps.length
                ) {

                    closeTVMode();

                    return;
                }

                launchSelectedTVApp();
            }

            return;
        }

        if (key === tvKeyMap.back) {

            event.preventDefault();

            /*
             * BackspaceはTVモード終了ではない。
             *
             * アプリ → ホーム
             */

            tvBack();

            return;
        }

    }

    document.addEventListener(
        "keydown",
        handleTVKey,
        true
    );

    };


    function renderKeyMapList() {

        const list =
            document.getElementById(
                "winconKeyMapList"
            );

        if (!list) return;

        list.innerHTML = "";

        Object.keys(KEYMAP_LABELS)
            .forEach(action => {

                    document.createElement("div");

                row.className =
                    "wincon-keymap-row";

                    document.createElement("div");

                label.textContent =
                    KEYMAP_LABELS[action];

                const button =
                    document.createElement("button");

                button.className =
                    "wincon-keymap-key";

                button.dataset.action =
                    action;

                button.textContent =
                    formatKeyName(
                        tvKeyMap[action]
                    );

                button.addEventListener(
                    "click",
                    () => {

                        beginKeyCapture(
                            action,
                            button
                        );

                    }
                );

                row.appendChild(label);
                row.appendChild(button);

                list.appendChild(row);

            });


        const reset =
            document.getElementById(
                "winconKeyMapReset"
            );

        if (reset) {

            reset.onclick = () => {

                tvKeyMap = {
                    ...DEFAULT_KEYMAP
                };

                saveKeyMap();

                renderKeyMapList();

            };

        }

    /* =====================================================
       Key Capture
    ===================================================== */

    function beginKeyCapture(
        action,
        button
    ) {

        if (tvState.waitingForKey) {
            return;
        }

        tvState.waitingForKey = true;
        tvState.selectedKeyAction = action;

        button.classList.add(
            "waiting"
        );

        button.textContent =
            "ボタンを押してください…";

        function capture(event) {

            /*
             * キーマップ画面自身を操作するための
             * Escapeなども登録可能にする。
             */

            event.preventDefault();
            event.stopPropagation();

            const key = event.key;

            tvKeyMap[action] = key;

            saveKeyMap();

            tvState.waitingForKey = false;
            tvState.selectedKeyAction = null;

            document.removeEventListener(
                "keydown",
                capture,
                true
            );

            renderKeyMapList();
        }

        document.addEventListener(
            "keydown",
            capture,
            true
        );

    }


    /* =====================================================
       Key Name
    ===================================================== */

    function formatKeyName(key) {

        const names = {

            ArrowUp: "↑ 上",
            ArrowDown: "↓ 下",
            ArrowLeft: "← 左",
            ArrowRight: "→ 右",

            Enter: "Enter",

            Backspace: "Backspace",

            Escape: "Esc",

            " ": "Space"

        };

        return names[key] || key;

    }


    /* =====================================================
       WebHID
    ===================================================== */

    async function refreshHIDDevices() {

        const status =
            document.getElementById(
                "winconHIDStatus"
            );

        if (!status) return;

        if (!("hid" in navigator)) {

            status.textContent =
                "このブラウザはWebHIDに対応していません。キーボードとして認識されたBluetooth機器は通常のキー入力として利用できます。";

            return;

        }

        try {

            const devices =
                await navigator.hid.getDevices();

            tvState.hidDevices =
                devices;

            if (!devices.length) {

                status.textContent =
                    "登録済みのHIDデバイスはありません。";

                return;
            }

            status.textContent =
                devices
                    .map(device => {

                        return (
                            device.productName ||
                            "名称不明のHIDデバイス"
                        );

                    })
                    .join(" / ");

        } catch (e) {

            console.error(
                "[Wincon TV] HID取得失敗",
                e
            );

            status.textContent =
                "HIDデバイス情報を取得できませんでした。";

        }

    }


    /* =====================================================
       Connect HID
    ===================================================== */

    async function connectHIDDevice() {

        if (!("hid" in navigator)) {

            alert(
                "このブラウザはWebHIDに対応していません。"
            );

            return;
        }

        try {

            const devices =
                await navigator.hid.requestDevice({
                    filters: []
                });

            tvState.hidDevices =
                devices;

            await refreshHIDDevices();

        } catch (e) {

            if (
                e.name !==
                "NotFoundError"
            ) {

                console.error(
                    "[Wincon TV] HID接続失敗",
                    e
                );

            }

        }

    }


    function setupHIDControls() {

        const connect =
            document.getElementById(
                "winconHIDConnect"
            );

        const refresh =
            document.getElementById(
                "winconHIDRefresh"
            );

        if (connect) {

            connect.onclick =
                connectHIDDevice;

        }

        if (refresh) {

            refresh.onclick =
                refreshHIDDevices;

        }

        refreshHIDDevices();

    }


    /* =====================================================
       Wincon Module Registration
    ===================================================== */

    function registerKeyMapModule() {

        /*
         * 既に存在するなら追加しない
         */

        const exists =
            menuItems.some(
                item =>
                    item &&
                    (
                        item.title ===
                        "キーマップ"
                    )
            );

        if (exists) {
            return;
        }

        menuItems.push({

            title: "キーマップ",

            icon: "🎮",

            type: "keymap",

            system: true

        });

    }


    /* =====================================================
       TV Mode Menu Registration
    ===================================================== */

    function registerTVModule() {

        const exists =
            menuItems.some(
                item =>
                    item &&
                    item.type === "tv"
            );

        if (exists) {
            return;
        }

        /*
         * TVモードは通常メニューに表示。
         */

        menuItems.push({

            title: "TVモード",

            icon: "📺",

            type: "tv",

            system: true

        });

    }


    /* =====================================================
       renderMenu Hook
    ===================================================== */

    function installMenuSupport() {

        /*
         * 既存renderMenuを置き換えず、
         * menuItemsのtypeを既存switchへ追加できる
         * ようにクリックイベントを後付けする。
         */

        const originalRender =
            window.renderMenu;

        if (
            typeof originalRender !==
            "function"
        ) {
            console.warn(
                "[Wincon TV] renderMenuが見つかりません"
            );

            return;
        }

        window.renderMenu =
            function() {

                originalRender();

                const elements =
                    document.querySelectorAll(
                        "#menu .menu-item"
                    );

                elements.forEach(element => {

                    const title =
                        element.textContent.trim();

                    if (
                        title.includes(
                            "TVモード"
                        )
                    ) {

                        element.onclick = null;

                        element.addEventListener(
                            "click",
                            () => {

                                const menu =
                                    document.getElementById(
                                        "menu"
                                    );

                                if (menu) {
                                    menu.style.display =
                                        "none";
                                }

                                openTVMode();

                            }
                        );

                    }

                    if (
                        title.includes(
                            "キーマップ"
                        )
                    ) {

                        element.onclick = null;

                        element.addEventListener(
                            "click",
                            () => {

                                openTVKeyMapModule();

                            }
                        );

                    }

                });

            };

    }


    /* =====================================================
       openAppCommand Support
    ===================================================== */

    /*
     * 既存openAppCommandに
     * TV / keymapを認識させる。
     */

    function installCommandSupport() {

        if (
            typeof window.openAppCommand !==
            "function"
        ) {
            return;
        }

        const original =
            window.openAppCommand;

        window.openAppCommand =
            function(
                appName,
                popupOverride
            ) {

                const item =
                    menuItems.find(
                        x =>
                            x &&
                            x.title ===
                            appName
                    );

                if (item) {

                    if (
                        item.type === "tv"
                    ) {

                        openTVMode();
                        return;
                    }

                    if (
                        item.type === "keymap"
                    ) {

                        openTVKeyMapModule();
                        return;
                    }

                }

                return original.apply(
                    this,
                    arguments
                );

            };

    }


    /* =====================================================
       Public API
    ===================================================== */

    window.WinconTV = {

        open() {
            openTVMode();
        },

        close() {
            closeTVMode();
        },

        isActive() {
            return tvState.active;
        },

        getKeyMap() {
            return {
                ...tvKeyMap
            };
        },

        setKeyMap(action, key) {

            if (
                !Object.prototype.hasOwnProperty.call(
                    DEFAULT_KEYMAP,
                    action
                )
            ) {
                return false;
            }

            tvKeyMap[action] = key;

            saveKeyMap();

            return true;
        },

        resetKeyMap() {

            tvKeyMap = {
                ...DEFAULT_KEYMAP
            };

            saveKeyMap();

        }

    };


    /* =====================================================
       Init
    ===================================================== */

    installCSS();

    registerKeyMapModule();

    registerTVModule();

    installMenuSupport();

    installCommandSupport();

    /*
     * menuItems追加後に既存Menuを再描画
     */

    if (
        typeof window.renderMenu ===
        "function"
    ) {
        window.renderMenu();
    }

    console.log(
        "[Wincon TV] TV Mode / Key Map initialized"
    );

})();




function showWinconNotification(title, message, duration = 3500) {

    let layer =
        document.getElementById(
            "winconNotificationLayer"
        );

    if (!layer) {

        layer = document.createElement("div");

        layer.id =
            "winconNotificationLayer";

        document.body.appendChild(layer);
    }

    /*
     * TVモードなどで別のコンテナの中に
     * 入ってしまっていても、必ずbody直下へ戻す
     */
    if (layer.parentElement !== document.body) {
        document.body.appendChild(layer);
    }

    /*
     * 念のためDOM上でも最後尾へ移動
     */
    document.body.appendChild(layer);

    const notification =
        document.createElement("div");

    notification.className =
        "wincon-notification";

    const titleElement =
        document.createElement("div");

    titleElement.className =
        "wincon-notification-title";

    titleElement.textContent =
        title || "Wincon";

    const messageElement =
        document.createElement("div");

    messageElement.className =
        "wincon-notification-message";

    messageElement.textContent =
        message || "";

    notification.appendChild(
        titleElement
    );

    notification.appendChild(
        messageElement
    );

    layer.appendChild(
        notification
    );

    requestAnimationFrame(() => {
        notification.classList.add(
            "visible"
        );
    });

    setTimeout(() => {

        notification.classList.add(
            "removing"
        );

        setTimeout(() => {

            if (notification.parentNode) {
                notification.remove();
            }

        }, 250);

    }, duration);
}

function astRead(
    key,
    fallback = null
){

    try{

        const raw =

            );

        if(
            raw === null ||

        ){

        }

        return JSON.parse(

    }catch(e){

        );

function astWrite(

){

        );

    }catch(e){

        );

/* =========================================================
   PASSWORD HASH
========================================================= */

function bytesToHex(
    bytes
){

    return Array
        .from(bytes)
        .map(
            b =>
                b.toString(16)
                    .padStart(
                        2,
                        "0"
                    )
        )
        .join("");

}


function hexToBytes(
    hex
){

    const result =
        new Uint8Array(
            hex.length / 2
        );

    for(
        let i = 0;
        i < hex.length;
        i += 2
    ){

        result[i / 2] =
            parseInt(
                hex.slice(
                    i,
                    i + 2
                ),
                16
            );

    }

    return result;

}


async function hashPassword(
    password,
    salt
){

    const encoder =
        new TextEncoder();

    const passwordBytes =
        encoder.encode(
            password
        );

    const key =
        await crypto.subtle.importKey(
            "raw",
            passwordBytes,
            {
                name:
                    "PBKDF2"
            },
            false,
            [
                "deriveBits"
            ]
        );

    const bits =
        await crypto.subtle.deriveBits(
            {

                name:
                    "PBKDF2",

                salt:
                    salt,

                iterations:
                    120000,

                hash:
                    "SHA-256"

            },
            key,
            256
        );

    return bytesToHex(
        new Uint8Array(
            bits
        )
    );

}


async function createPasswordRecord(
    password
){

    if(
        !password
    ){

        return null;

    }

    const salt =
        crypto.getRandomValues(
            new Uint8Array(
                16
            )
        );

    const hash =
        await hashPassword(
            password,
            salt
        );

    return {

        algorithm:
            "PBKDF2-SHA256",

        iterations:
            120000,

        salt:
            bytesToHex(
                salt
            ),

        hash:
            hash

    };

}


async function verifyPassword(
    password,
    record
){

    if(
        !record ||
        !record.salt ||
        !record.hash
    ){

        return false;

    }

    try{

        const salt =
            hexToBytes(
                record.salt
            );

        const hash =
            await hashPassword(
                password,
                salt
            );

        return (
            hash ===
            record.hash
        );

    }catch(e){

        console.error(
            "[Asteria] password verification failed",
            e
        );

        return false;

    }

}

    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(

        "&gt;"
    )
    .replace(

        "&quot;"
    )

        /'/g,

    );

}

========================================================= */

let oobeWindow =
    null;

let oobeStep =
    0;

const OOBE_TOTAL_STEPS =
    7;


let oobeData = {

    language:
        "ja-JP",

    notifications:
        true,

    startupMode:
        "desktop",

    username:
        "",

    password:
        "",

    passkey:
        false,

    passwordSkip:
        false,

    icon:
        null

};


/* =========================================================
   OOBE ISOLATION
========================================================= */

function enterAsteriaIsolation(){

    document.body.classList.add(
        "wincon10-oobe-isolated"
    );

}


function leaveAsteriaIsolation(){

    document.body.classList.remove(
        "wincon10-oobe-isolated"
    );

}


/* =========================================================
   OOBE WINDOW
========================================================= */

function openAsteriaOOBE(
    isolated = false
){

    installAsteriaCSS();


    if(isolated){

        enterAsteriaIsolation();

    }


    oobeStep =
        0;


    const settings =
        getAsteriaSettings();


    oobeData = {

        language:
            settings.language ||
            "ja-JP",

        notifications:
            settings.notifications !== false,

        startupMode:
            settings.startupMode ||
            "desktop",

        username:
            "",

        password:
            "",

        passkey:
            false,

        passwordSkip:
            false,

        icon:
            null

    };


    const content = `

<div
    class="wincon10-oobe"
    id="wincon10OOBE"
>

    <div
        class="wincon10-oobe-main"
        id="wincon10OOBEMain"
    ></div>

    <div
        class="wincon10-oobe-footer"
    >

        <div
            class="wincon10-oobe-progress-text"
            id="wincon10OOBEProgress"
        >
            1 / ${OOBE_TOTAL_STEPS}
        </div>

        <div
            style="
                display:flex;
                gap:8px;
            "
        >

            <button
                class="wincon10-oobe-button secondary"
                id="wincon10OOBEBack"
            >
                戻る
            </button>

            <button
                class="wincon10-oobe-button"
                id="wincon10OOBENext"
            >
                次へ
            </button>

        </div>

    </div>

</div>

`;


    oobeWindow =
        createWindow({

            title:
                "Wincon 10 Asteria",

            icon:
                "🪟",

            content:
                content,

            width:
                850,

            height:
                620,

            safe:
                isolated

        });


    if(oobeWindow){

        oobeWindow.classList.add(
            "wincon10-oobe-window"
        );


        if(isolated){

            oobeWindow.style.left =
                "50%";

            oobeWindow.style.top =
                "50%";

            oobeWindow.style.transform =
                "translate(-50%,-50%)";

            oobeWindow.style.width =
                "850px";

            oobeWindow.style.height =
                "620px";

            oobeWindow.style.zIndex =
                "2147483100";

        }

    }


    setTimeout(
        setupAsteriaOOBEEvents,
        50
    );


    return oobeWindow;

}
