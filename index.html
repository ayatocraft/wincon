/* =========================================================
   OOBE STEP EVENTS
========================================================= */

function setupAsteriaOOBEStepEvents(){

    const language =
        document.getElementById(
            "wincon10Language"
        );

    if(language){

        language.onchange =
            () => {

                oobeData.language =
                    language.value;

            };

    }


    const notifications =
        document.getElementById(
            "wincon10Notifications"
        );

    if(notifications){

        notifications.onchange =
            () => {

                oobeData.notifications =
                    notifications.checked;

            };

    }


    document
        .querySelectorAll(
            "[data-startup-mode]"
        )
        .forEach(
            element => {

                element.onclick =
                    () => {

                        oobeData.startupMode =
                            element.dataset
                                .startupMode;

                        document
                            .querySelectorAll(
                                "[data-startup-mode]"
                            )
                            .forEach(
                                item => {

                                    item.classList.toggle(
                                        "selected",
                                        item ===
                                        element
                                    );

                                }
                            );

                    };

            }
        );


    const username =
        document.getElementById(
            "wincon10Username"
        );

    if(username){

        username.oninput =
            () => {

                oobeData.username =
                    username.value.trim();

            };

    }


    const icon =
        document.getElementById(
            "wincon10Icon"
        );

    if(icon){

        icon.onchange =
            () => {

                const file =
                    icon.files &&
                    icon.files[0];

                if(!file){
                    return;
                }

                if(
                    !file.type.startsWith(
                        "image/"
                    )
                ){

                    return;

                }


                const reader =
                    new FileReader();

                reader.onload =
                    event => {

                        oobeData.icon =
                            event.target.result;

                        const preview =
                            document.getElementById(
                                "wincon10OOBEAvatarPreview"
                            );

                        if(preview){

                            preview.innerHTML =
                                `
                                <img
                                    src="${oobeData.icon}"
                                    alt=""
                                >
                                `;

                        }

                    };

                reader.readAsDataURL(
                    file
                );

            };

    }


    const password =
        document.getElementById(
            "wincon10Password"
        );

    const passwordConfirm =
        document.getElementById(
            "wincon10PasswordConfirm"
        );

    const passwordSkip =
        document.getElementById(
            "wincon10PasswordSkip"
        );


    function updatePasswordState(){

        if(!passwordSkip){
            return;
        }

        const disabled =
            passwordSkip.checked;

        if(password){

            password.disabled =
                disabled;

            if(disabled){
                password.value = "";
            }

        }

        if(passwordConfirm){

            passwordConfirm.disabled =
                disabled;

            if(disabled){
                passwordConfirm.value = "";
            }

        }

        oobeData.passwordSkip =
            disabled;

    }


    if(passwordSkip){

        passwordSkip.onchange =
            updatePasswordState;

        updatePasswordState();

    }


    const passkey =
        document.getElementById(
            "wincon10Passkey"
        );

    if(passkey){

        passkey.onchange =
            () => {

                oobeData.passkey =
                    passkey.checked;

            };

    }

}


/* =========================================================
   OOBE VALIDATION
========================================================= */

function validateAsteriaOOBEStep(){

    if(
        oobeStep ===
        4
    ){

        const username =
            String(
                oobeData.username ||
                ""
            ).trim();

        if(!username){

            alert(
                "ユーザー名を入力してください。"
            );

            return false;

        }

        if(
            username.length >
            32
        ){

            alert(
                "ユーザー名は32文字以内にしてください。"
            );

            return false;

        }

    }


    if(
        oobeStep ===
        5
    ){

        if(
            oobeData.passwordSkip
        ){

            oobeData.password =
                "";

            return true;

        }


        const password =
            document.getElementById(
                "wincon10Password"
            );

        const confirm =
            document.getElementById(
                "wincon10PasswordConfirm"
            );


        const p =
            password
            ? password.value
            : "";

        const c =
            confirm
            ? confirm.value
            : "";


        if(!p){

            alert(
                "パスワードを入力してください。"
            );

            return false;

        }


        if(
            p !== c
        ){

            alert(
                "パスワードが一致しません。"
            );

            return false;

        }


        if(
            p.length <
            4
        ){

            alert(
                "パスワードは4文字以上にしてください。"
            );

            return false;

        }


        oobeData.password =
            p;

    }


    return true;

}


/* =========================================================
   OOBE EVENTS
========================================================= */

function setupAsteriaOOBEEvents(){

    renderAsteriaOOBEStep();


    const back =
        document.getElementById(
            "wincon10OOBEBack"
        );

    const next =
        document.getElementById(
            "wincon10OOBENext"
        );


    if(back){

        back.onclick =
            () => {

                if(
                    oobeStep <= 0
                ){
                    return;
                }

                oobeStep--;

                renderAsteriaOOBEStep();

            };

    }


    if(next){

        next.onclick =
            async () => {

                if(
                    !validateAsteriaOOBEStep()
                ){

                    return;

                }


                if(
                    oobeStep <
                    OOBE_TOTAL_STEPS - 1
                ){

                    oobeStep++;

                    renderAsteriaOOBEStep();

                    return;

                }


                await finishAsteriaOOBE();

            };

    }

}


/* =========================================================
   PASSKEY
========================================================= */

async function tryCreateAsteriaPasskey(
    user
){

    if(
        !window.PublicKeyCredential
    ){

        return false;

    }


    try{

        const challenge =
            crypto.getRandomValues(
                new Uint8Array(
                    32
                )
            );


        const userId =
            new TextEncoder().encode(
                user.id
            );


        const credential =
            await navigator.credentials.create({

                publicKey: {

                    challenge:

                        challenge,

                    rp: {

                        name:
                            "Wincon 10 Asteria"

                    },

                    user: {

                        id:
                            userId,

                        name:
                            user.name,

                        displayName:
                            user.name

                    },

                    pubKeyCredParams: [

                        {
                            type:
                                "public-key",

                            alg:
                                -7

                        },

                        {
                            type:
                                "public-key",

                            alg:
                                -257

                        }

                    ],

                    authenticatorSelection: {

                        residentKey:
                            "preferred",

                        userVerification:
                            "preferred"

                    },

                    timeout:
                        60000,

                    attestation:
                        "none"

                }

            });


        if(!credential){

            return false;

        }


        const updated =
            updateAsteriaUser({

                passkey:
                    true,

                passkeyCredentialId:
                    btoa(
                        String.fromCharCode(
                            ...new Uint8Array(
                                credential.rawId
                            )
                        )
                    )

            });


        return !!updated;

    }catch(e){

        console.warn(
            "[Asteria] Passkey setup unavailable or cancelled",
            e
        );

        return false;

    }

}


/* =========================================================
   OOBE FINISH
========================================================= */

async function finishAsteriaOOBE(){

    if(
        !validateAsteriaOOBEStep()
    ){

        return;

    }


    const main =
        document.getElementById(
            "wincon10OOBEMain"
        );

    if(main){

        main.innerHTML = `

<div
    style="
        height:100%;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
    "
>

    <div
        style="
            width:90px;
            height:90px;
            border-radius:50%;
            border:5px solid rgba(255,255,255,.15);
            border-top-color:white;
            animation:spin 1s linear infinite;
        "
    ></div>

    <h2
        style="
            margin-top:25px;
        "
    >
        設定を保存しています
    </h2>

    <p
        style="
            margin-top:10px;
            opacity:.6;
            font-size:13px;
        "
    >
        Wincon 10 Asteria
    </p>

</div>

`;

    }


    const bar =
        document.getElementById(
            "wincon10OOBEApplyBar"
        );

    const text =
        document.getElementById(
            "wincon10OOBEApplyText"
        );


    let progress =
        0;


    const steps = [

        "ユーザー情報を準備しています...",

        "セキュリティ設定を準備しています...",

        "Wincon設定を保存しています...",

        "起動設定を保存しています...",

        "セットアップを完了しています..."

    ];


    for(
        let i = 0;
        i < steps.length;
        i++
    ){

        if(text){

            text.textContent =
                steps[i];

        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    4000
                )
        );


        progress =
            Math.round(
                (
                    (i + 1) /
                    steps.length
                ) *
                100
            );


        if(bar){

            bar.style.width =
                progress + "%";

        }

    }


    let passwordHash =
        null;


    if(
        !oobeData.passwordSkip &&
        oobeData.password
    ){

        passwordHash =
            await createPasswordRecord(
                oobeData.password
            );

    }


    let user =
        getAsteriaUser();


    if(!user){

        user =
            createAsteriaUser(
                oobeData.username,
                passwordHash
            );

    }else{

        user =
            updateAsteriaUser({

                name:
                    oobeData.username,

                passwordHash:
                    passwordHash

            });

    }


    if(
        oobeData.icon
    ){

        user =
            updateAsteriaUser({

                icon:
                    oobeData.icon

            });

    }


    if(
        oobeData.passkey
    ){

        await tryCreateAsteriaPasskey(
            user
        );

        user =
            getAsteriaUser();

    }


    saveAsteriaSettings({

        language:
            oobeData.language,

        notifications:
            oobeData.notifications,

        startupMode:
            oobeData.startupMode

    });


    astWrite(
        ASTERIA_KEYS.oobeCompleted,
        true
    );


    loginAsteria(
        user
    );


    leaveAsteriaIsolation();


    if(oobeWindow){

        oobeWindow.remove();

        oobeWindow =
            null;

    }


    startAsteriaDesktop();

}


/* =========================================================

========================================================= */

    const user =
        getAsteriaUser();


    if(!user){

        startAsteriaDesktop();

        return;

    }


    const overlay =
        document.createElement(
            "div"
        );

    overlay.id =
        "wincon10LoginOverlay";


    const avatar =
        user.icon
        ?
        `
        <img
            src="${user.icon}"
            alt=""
        >
        `

    overlay.innerHTML = `

    class="wincon10-login-card"
>

        class="wincon10-login-avatar"

        ${avatar}
    </div>

    <div

        )}

        user.passwordHash
        ?
        `
        <input
            id="wincon10LoginPassword"
            class="wincon10-login-input"
            type="password"

            autocomplete="current-password"

        ){

                );

            if(!valid){

                if(error){

            }

        }


        loginAsteria(
            user
        );


        continueAsteriaAfterLogin();

    }


    if(button){

        button.onclick =
            doLogin;

    }


    if(password){

        password.addEventListener(
            "keydown",
            event => {

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();

                    doLogin();

                }

            }
        );

        setTimeout(
            () => password.focus(),
            100
        );

    }else if(button){

        setTimeout(
            () => button.focus(),
            100

/* =========================================================
   OPENAPP HOOK
========================================================= */

function installAsteriaCommandHook(){

    if(
        window.__WINCON10_OOBE_COMMAND_HOOK__
    ){

        return;

    }


    if(
        typeof window.openAppCommand !==
        "function"
    ){

        return;

    }


    const original =
        window.openAppCommand;


    window.openAppCommand =
        function(
            args,
            print
        ){

            let appArgs =
                args;


            if(
                typeof args ===
                "string"
            ){

                appArgs =
                    args
                        .trim()
                        .split(/\s+/);

            }


            if(
                Array.isArray(
                    appArgs
                )
            ){

                const name =
                    appArgs
                        .slice(1)
                        .filter(
                            a =>
                                !a.startsWith(
                                    "type="
                                )
                        )
                        .join(" ");


                if(
                    name ===
                    "OOBE"
                ){

                    openAsteriaOOBE(
                        false
                    );


                    if(
                        typeof print ===
                        "function"
                    ){

                        print(
                            "OOBE を起動"
                        );

                    }

                    return;

                }

            }


            return original.apply(
                this,
                arguments
            );

        };


    window.__WINCON10_OOBE_COMMAND_HOOK__ =
        true;

}


/* =========================================================
   PROCESS SCREEN
========================================================= */

function createAsteriaProcessScreen(
    options = {}
){

    const {

        status:
            statusText =
                "Winconを起動しています...",

        substatus:
            substatusText =
                "",

        duration:
            durationValue =
                10000,

        onComplete:
            complete =
                null,

        minimumProgress:
            minimum =
                0,

        maximumProgress:
            maximum =
                100

    } = options;


    const oldProcess =
        document.getElementById(
            "wincon10AsteriaProcess"
        );


    if(oldProcess){

        oldProcess.remove();

    }


    const legacyBoot =
        document.getElementById(
            "bootScreen"
        );


    if(legacyBoot){

        legacyBoot.remove();

    }


    const screen =
        document.createElement(
            "div"
        );


    screen.id =
        "wincon10AsteriaProcess";


    screen.innerHTML = `

<div
    class="wincon10-asteria-process-inner"
>

    <img
        src="wincon.png"
        class="wincon10-asteria-logo"
        draggable="false"
        onerror="
            this.style.display='none';
        "
    >

    <div
        class="wincon10-asteria-brand"
    >
        Wincon
    </div>

    <div
        class="wincon10-asteria-version"
    >
        10 ASTERIA
    </div>

    <div
        class="wincon10-asteria-progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
    >

        <div
            class="wincon10-asteria-progress-bar"
            id="wincon10AsteriaProgressBar"
        ></div>

    </div>

    <div
        class="wincon10-asteria-status"
        id="wincon10AsteriaStatus"
    >
        ${escapeAsteriaHTML(
            statusText
        )}
    </div>

    ${
        substatusText
        ?
        `
        <div
            class="wincon10-asteria-substatus"
        >
            ${escapeAsteriaHTML(
                substatusText
            )}
        </div>
        `
        :
        ""
    }

</div>

`;


    document.body.appendChild(
        screen
    );


    const bar =
        document.getElementById(
            "wincon10AsteriaProgressBar"
        );


    const progressRoot =
        screen.querySelector(
            ".wincon10-asteria-progress"
        );


    const safeDuration =
        Math.max(
            1,
            Number(
                durationValue
            ) || 1
        );


    const min =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    minimum
                ) || 0
            )
        );


    const max =
        Math.max(
            min,
            Math.min(
                100,
                Number(
                    maximum
                ) || 100
            )
        );


    const start =
        performance.now();


    let completed =
        false;


    let frameId =
        null;


    function finish(){

        if(completed){

            return;

        }


        completed =
            true;


        if(
            frameId !== null
        ){

            cancelAnimationFrame(
                frameId
            );

        }


        if(bar){

            bar.style.width =
                max + "%";

        }


        if(progressRoot){

            progressRoot.setAttribute(
                "aria-valuenow",
                String(
                    max
                )
            );

        }


        if(
            typeof complete ===
            "function"
        ){

            complete();

        }

    }


    function update(
        now
    ){

        if(completed){

            return;

        }


        if(
            !screen.isConnected
        ){

            return;

        }


        const elapsed =
            Math.max(
                0,
                now - start
            );


        const ratio =
            Math.min(
                elapsed /
                safeDuration,
                1
            );


        const eased =
            ratio < 1
            ?
            1 -
            Math.pow(
                1 - ratio,
                1.05
            )
            :
            1;


        const value =
            min +
            (
                max - min
            ) *
            eased;


        if(bar){

            bar.style.width =
                value + "%";

        }


        if(progressRoot){

            progressRoot.setAttribute(
                "aria-valuenow",
                String(
                    Math.round(
                        value
                    )
                )
            );

        }


        if(
            ratio < 1
        ){

            frameId =
                requestAnimationFrame(
                    update
                );

        }else{

            finish();

        }

    }


    frameId =
        requestAnimationFrame(
            update
        );


    return screen;

}

  let backgroundObjectURL = null;
  let imageDatabase = null;
  let menuObserver = null;
  let applyObserver = null;
  let originalRenderMenu = null;

  /* ------------------------------
     設定の読み書き
  ------------------------------ */

  function loadSettings() {
    try {
      return {
        ...defaults,
        ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')
      };
    } catch {
      return { ...defaults };
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch (error) {
      console.error('[Wincon Appearance] 設定保存エラー:', error);
    }
  }

  /* ------------------------------
     IndexedDB：画像保存
  ------------------------------ */

  function openImageDB() {
    if (imageDatabase) {
      return Promise.resolve(imageDatabase);
    }

    return new Promise((resolve, reject) => {
      const request = indexedDB.open(IMAGE_DB, 1);

      request.onupgradeneeded = () => {
        const db = request.result;

        if (!db.objectStoreNames.contains(IMAGE_STORE)) {
          db.createObjectStore(IMAGE_STORE);
        }
      };

      request.onsuccess = () => {
        imageDatabase = request.result;
        resolve(imageDatabase);
      };

      request.onerror = () => reject(request.error);
    });
  }

  async function saveBackgroundImage(blob) {
    const db = await openImageDB();

    return new Promise((resolve, reject) => {
      const transaction = db.transaction(IMAGE_STORE, 'readwrite');

      transaction.objectStore(IMAGE_STORE).put(blob, 'desktop');

      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  }

  async function loadBackgroundImage() {
    try {
      const db = await openImageDB();

      const blob = await new Promise((resolve, reject) => {
        const transaction = db.transaction(IMAGE_STORE, 'readonly');
        const request = transaction.objectStore(IMAGE_STORE).get('desktop');

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });

      if (!blob) return;

      if (backgroundObjectURL) {
        URL.revokeObjectURL(backgroundObjectURL);
      }

      backgroundObjectURL = URL.createObjectURL(blob);

      applyBackground();
    } catch (error) {
      console.error('[Wincon Appearance] 背景画像の読み込みエラー:', error);
    }
  }

  async function deleteBackgroundImage() {
    try {
      const db = await openImageDB();

      await new Promise((resolve, reject) => {
        const transaction = db.transaction(IMAGE_STORE, 'readwrite');

        transaction.objectStore(IMAGE_STORE).delete('desktop');

        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });

      if (backgroundObjectURL) {
        URL.revokeObjectURL(backgroundObjectURL);
        backgroundObjectURL = null;
      }

      applyBackground();
    } catch (error) {
      console.error('[Wincon Appearance] 背景画像の削除エラー:', error);
    }
  }

  /* ------------------------------
     背景の作成と適用
  ------------------------------ */

  function ensureBackgroundElements() {
    const desktop = document.getElementById('desktop');
    if (!desktop) return;

    let background = document.getElementById('wincon-aa-background');

    if (!background) {
      background = document.createElement('div');
      background.id = 'wincon-aa-background';

      desktop.prepend(background);
    }

    let overlay = document.getElementById('wincon-aa-overlay');

    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'wincon-aa-overlay';

      background.after(overlay);
    }
  }

  function applyBackground() {
    ensureBackgroundElements();

    const desktop = document.getElementById('desktop');
    const background = document.getElementById('wincon-aa-background');
    const overlay = document.getElementById('wincon-aa-overlay');

    if (!desktop || !background || !overlay) return;

    background.style.filter = 'none';
    background.style.backgroundImage = 'none';
    background.style.backgroundColor = 'transparent';

    overlay.style.opacity = String(
      Math.max(0, Math.min(80, Number(settings.backgroundOverlay) || 0)) / 100
    );

    const blur = Math.max(
      0,
      Math.min(20, Number(settings.backgroundBlur) || 0)
    );

    if (settings.backgroundMode === 'color') {
      background.style.backgroundColor =
        settings.backgroundColor || defaults.backgroundColor;

      background.style.filter = blur ? `blur(${blur}px)` : 'none';

    } else if (
      settings.backgroundMode === 'image' &&
      backgroundObjectURL
    ) {
      background.style.backgroundImage =
        `url("${backgroundObjectURL}")`;

      background.style.filter = blur ? `blur(${blur}px)` : 'none';

    } else {
      /*
       * 元の背景モードでは背景レイヤーを透明にする。
       * 元の#desktopの背景色・グラデーションを維持する。
       */
      background.style.backgroundColor = 'transparent';
      background.style.backgroundImage = 'none';
      background.style.filter = 'none';
    }

    /*
     * 元のデスクトップ背景は変更しない。
     * 画像・単色を選んだ場合だけ背景レイヤーを表示する。
     */
    background.style.visibility =
      settings.backgroundMode === 'original' ? 'hidden' : 'visible';
  }

  /* ------------------------------
     全設定の適用
  ------------------------------ */

  function applySettings() {
    const body = document.body;

    body.classList.toggle(
      'wincon-aa-square',
      settings.cornerMode === 'square'
    );

    body.classList.toggle('wincon-aa-bold', !!settings.boldText);
    body.classList.toggle('wincon-aa-contrast', !!settings.highContrast);
    body.classList.toggle('wincon-aa-focus', !!settings.focusIndicator);

    body.classList.toggle(
      'wincon-aa-reduce-motion',
      !!settings.reduceMotion
    );

    body.classList.toggle('wincon-aa-no-blur', !settings.blur);
    body.classList.toggle('wincon-aa-no-shadow', !settings.shadows);

    body.classList.toggle(
      'wincon-aa-no-transparency',
      !settings.transparency
    );

    const fontScale = Math.max(
      75,
      Math.min(150, Number(settings.fontScale) || 100)
    );

    const iconScale = Math.max(
      75,
      Math.min(150, Number(settings.iconScale) || 100)
    );

    /*
     * ウィンドウ・タスクバー・メニューの文字サイズを適用。
     * inline styleで指定して既存CSSに上書きされにくくする。
     */
    document.querySelectorAll(
      '#desktop .window, #menu, #taskbar, .control-center'
    ).forEach(element => {
      if (
        element.id === 'wincon-aa-background' ||
        element.id === 'wincon-aa-overlay'
      ) return;

      element.style.setProperty(
        'font-size',
        `${fontScale}%`,
        'important'
      );
    });

    /*
     * アイコンは既存レイアウトを壊さないよう、
     * font-sizeを使って拡大する。
     */
    document.querySelectorAll(
      '#desktop .window .title-left > div:first-child, ' +
      '#desktop .window .icon, ' +
      '#menu .menu-item'
    ).forEach(element => {
      element.style.setProperty(
        'font-size',
        `${iconScale}%`,
        'important'
      );
    });

    applyBackground();
    saveSettings();
  }

  /* ------------------------------
     設定画面のHTML
  ------------------------------ */

  function row(label, control) {
    return `
      <div class="aa-row">
        <label>${label}</label>
        ${control}
      </div>
    `;
  }

  function check(id, value) {
    return `
      <input type="checkbox" id="${id}" ${value ? 'checked' : ''}>
    `;
  }

  function slider(id, value, min, max, suffix = '%') {
    return `
      <input type="range" id="${id}"
        min="${min}" max="${max}" value="${value}">
      <span class="aa-value" data-value-for="${id}">
        ${value}${suffix}
      </span>
    `;
  }

  function buildPanelHTML() {
    return `
      <div id="wincon-aa-panel">

        <section class="aa-section">
          <h2>🪟 外観</h2>

          ${row('ウィンドウの角', `
            <select id="cornerMode">
              <option value="original">従来（変更しない）</option>
              <option value="square">角四角</option>
            </select>
          `)}

          ${row('文字サイズ',
            slider('fontScale', settings.fontScale, 75, 150))}

          ${row('アイコンサイズ',
            slider('iconScale', settings.iconScale, 75, 150))}

          ${row('透明効果',
            check('transparency', settings.transparency))}

          ${row('ぼかし効果',
            check('blur', settings.blur))}

          ${row('影の効果',
            check('shadows', settings.shadows))}

          ${row('アニメーションを減らす',
            check('reduceMotion', settings.reduceMotion))}
        </section>

        <section class="aa-section">
          <h2>🖼️ デスクトップ背景</h2>

          ${row('背景の種類', `
            <select id="backgroundMode">
              <option value="original">元の背景</option>
              <option value="color">単色</option>
              <option value="image">アップロード画像</option>
            </select>
          `)}

          ${row('背景色', `
            <input type="color" id="backgroundColor"
              value="${settings.backgroundColor}">
          `)}

          <label class="aa-upload">
            📂 背景画像を選択
            <input type="file" id="backgroundFile"
              accept="image/*">
          </label>

          <div id="backgroundStatus" class="aa-status">
            保存済みの背景画像は、再起動後も利用できます。
          </div>

          <div class="aa-actions">
            <button type="button" id="removeBackgroundImage">
              アップロード画像を削除
            </button>
          </div>

          ${row('背景のぼかし',
            slider('backgroundBlur', settings.backgroundBlur, 0, 20, 'px'))}

          ${row('暗いオーバーレイ',
            slider('backgroundOverlay', settings.backgroundOverlay, 0, 80))}

          <p class="aa-note">
            画像はこのブラウザー内に保存されます。
            画像サイズによっては保存できない場合があります。
          </p>
        </section>

        <section class="aa-section">
          <h2>♿ アクセシビリティ</h2>

          ${row('太字テキスト',
            check('boldText', settings.boldText))}

          ${row('コントラストを強める',
            check('highContrast', settings.highContrast))}

          ${row('フォーカス位置を強調',
            check('focusIndicator', settings.focusIndicator))}
        </section>

        <div class="aa-actions">
          <button type="button" id="aaReset">
            初期設定に戻す
          </button>
        </div>

        <p class="aa-note">
          設定は変更時に自動保存されます。
        </p>

      </div>
    `;
  }

  /* ------------------------------
     設定画面のイベント
  ------------------------------ */

  function bindPanel(panel) {
    if (!panel || panel.dataset.aaBound === 'true') return;

    panel.dataset.aaBound = 'true';

    const ids = [
      'cornerMode',
      'fontScale',
      'iconScale',
      'transparency',
      'blur',
      'shadows',
      'reduceMotion',
      'backgroundMode',
      'backgroundColor',
      'backgroundBlur',
      'backgroundOverlay',
      'boldText',
      'highContrast',
      'focusIndicator'
    ];

    function readFields() {
      ids.forEach(id => {
        const element = panel.querySelector('#' + id);
        if (!element) return;

        if (element.type === 'checkbox') {
          settings[id] = element.checked;
        } else if (element.type === 'range') {
          settings[id] = Number(element.value);
        } else {
          settings[id] = element.value;
        }
      });
    }

    function update() {
      readFields();
      applySettings();
    }

    ids.forEach(id => {
      const element = panel.querySelector('#' + id);
      if (!element) return;

      element.addEventListener('input', () => {
        if (element.type === 'range') {
          const output = panel.querySelector(
            `[data-value-for="${id}"]`
          );

          if (output) {
            output.textContent =
              element.value + (id === 'backgroundBlur' ? 'px' : '%');
          }
        }

        update();
      });

      element.addEventListener('change', update);
    });

    const fileInput = panel.querySelector('#backgroundFile');

    if (fileInput) {
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        const status = panel.querySelector('#backgroundStatus');

        if (!file.type.startsWith('image/')) {
          if (status) status.textContent = '画像ファイルを選択してください。';
          fileInput.value = '';
          return;
        }

        if (status) status.textContent = '画像を保存しています…';

        try {
          await saveBackgroundImage(file);

          if (backgroundObjectURL) {
            URL.revokeObjectURL(backgroundObjectURL);
          }

          backgroundObjectURL = URL.createObjectURL(file);
          settings.backgroundMode = 'image';

          const mode = panel.querySelector('#backgroundMode');
          if (mode) mode.value = 'image';

          applySettings();

          if (status) {
            status.textContent = `保存しました：${file.name}`;
          }
        } catch (error) {
          console.error(error);

          if (status) {
            status.textContent =
              '画像を保存できませんでした。別の画像をお試しください。';
          }
        }

        fileInput.value = '';
      });
    }

    const removeButton = panel.querySelector('#removeBackgroundImage');

    if (removeButton) {
      removeButton.addEventListener('click', async () => {
        await deleteBackgroundImage();

        settings.backgroundMode = 'original';

        const mode = panel.querySelector('#backgroundMode');
        if (mode) mode.value = 'original';

        applySettings();

        const status = panel.querySelector('#backgroundStatus');
        if (status) status.textContent = 'アップロード画像を削除しました。';
      });
    }

    const resetButton = panel.querySelector('#aaReset');

    if (resetButton) {
      resetButton.addEventListener('click', () => {
        settings = { ...defaults };

        /*
         * 初期設定への復帰では画像ファイル自体は削除しない。
         * 背景設定だけ元に戻す。
         */
        applySettings();

        panel.querySelectorAll('input, select').forEach(element => {
          const key = element.id;

          if (!(key in settings)) return;

          if (element.type === 'checkbox') {
            element.checked = !!settings[key];
          } else if (element.type === 'range') {
            element.value = settings[key];

            const output = panel.querySelector(
              `[data-value-for="${key}"]`
            );

            if (output) {
              output.textContent =
                settings[key] + (key === 'backgroundBlur' ? 'px' : '%');
            }
          } else if (element.type !== 'file') {
            element.value = settings[key];
          }
        });
      });
    }

    const mode = panel.querySelector('#backgroundMode');
    if (mode) mode.value = settings.backgroundMode;
  }

  /* ------------------------------
     アプリを開く
  ------------------------------ */

  function openAppearanceAccessibility() {
    if (typeof window.createWindow !== 'function') {
      alert('Winconのウィンドウ機能がまだ起動していません。');
      return;
    }

    const existing = [...document.querySelectorAll('#desktop .window')]
      .find(win => win.dataset.winconAaWindow === 'true');

    if (existing) {
      existing.style.display = '';
      existing.style.zIndex = String(Date.now());
      return;
    }

    const before = new Set(
      document.querySelectorAll('#desktop .window')
    );

    window.createWindow({
      title: MODULE_TITLE,
      icon: '🎨',
      width: 760,
      height: 700,
      content: buildPanelHTML()
    });

    const created = [...document.querySelectorAll('#desktop .window')]
      .find(win => !before.has(win));

    if (!created) {
      console.error(
        '[Wincon Appearance] ウィンドウを作成できませんでした。'
      );
      return;
    }

    created.dataset.winconAaWindow = 'true';

    const content = created.querySelector('.content') || created;

    bindPanel(content);
    applySettings();
  }

  /* ------------------------------
     既存MenuItemへ登録
  ------------------------------ */

  function registerMenuItem() {
    /*
     * menuItemsは元HTMLで定義されている既存の配列を使用する。
     * 別のメニューを作らず、通常のMenuItemとして登録する。
     */
    if (typeof menuItems === 'undefined' || !Array.isArray(menuItems)) {
      return false;
    }

    const alreadyExists = menuItems.some(item =>
      item.type === MODULE_TYPE || item.title === MODULE_TITLE
    );

    if (!alreadyExists) {
      menuItems.push({
        title: MODULE_TITLE,
        icon: '🎨',
        type: MODULE_TYPE,
        system: true
      });
    }

    /*
     * 元のrenderMenu()を利用してボタンを描画し、
     * 対象のボタンのクリック処理だけ差し替える。
     */
    if (typeof renderMenu === 'function' && !originalRenderMenu) {
      originalRenderMenu = renderMenu;

      window.renderMenu = function (...args) {
        const result = originalRenderMenu.apply(this, args);

        setTimeout(patchAppearanceMenuButton, 0);

        return result;
      };

      /*
       * グローバル関数の差し替えが反映されるよう、
       * 元の描画関数も直接実行する。
       */
      try {
        renderMenu();
      } catch (error) {
        console.warn('[Wincon Appearance] メニュー描画:', error);
      }
    }

    patchAppearanceMenuButton();

    return true;
  }

  function patchAppearanceMenuButton() {
    const menu = document.getElementById('menu');
    if (!menu) return;

    const buttons = menu.querySelectorAll('.menu-item');

    buttons.forEach(button => {
      if (!button.textContent.includes(MODULE_TITLE)) return;

      if (button.dataset.aaPatched === 'true') return;

      button.dataset.aaPatched = 'true';

      button.onclick = event => {
        event.preventDefault();
        event.stopPropagation();

        menu.style.display = 'none';

        openAppearanceAccessibility();
      };
    });
  }

  /* ------------------------------
     初期化
  ------------------------------ */

  function initialize() {
    installCSS();

    ensureBackgroundElements();

    applySettings();

    registerMenuItem();

    patchAppearanceMenuButton();

    if (!menuObserver) {
      const menu = document.getElementById('menu');

      if (menu) {
        menuObserver = new MutationObserver(() => {
          patchAppearanceMenuButton();
        });

        menuObserver.observe(menu, {
          childList: true,
          subtree: true
        });
      }
    }

    if (!applyObserver) {
      const desktop = document.getElementById('desktop');

      if (desktop) {
        applyObserver = new MutationObserver(records => {
          const newWindowAdded = records.some(record =>
            [...record.addedNodes].some(node =>
              node.nodeType === Node.ELEMENT_NODE &&
              (
                node.matches?.('.window') ||
                node.querySelector?.('.window')
              )
            )
          );

          if (newWindowAdded) {
            applySettings();
          }
        });

        applyObserver.observe(desktop, {
          childList: true,
          subtree: true
        });
      }
    }
  }

  window.openAppearanceAccessibility = openAppearanceAccessibility;

  window.WinconAppearance = {
    open: openAppearanceAccessibility,
    apply: applySettings,
    getSettings: () => ({ ...settings }),
    reset: () => {
      settings = { ...defaults };
      applySettings();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize, {
      once: true
    });
  } else {
    initialize();
  }

  /*
   * Winconの初期化タイミングに備えて再試行。
   */
  let attempts = 0;

  const retryTimer = setInterval(() => {
    initialize();
    attempts++;

    if (
      typeof menuItems !== 'undefined' &&
      Array.isArray(menuItems) &&
      document.getElementById('menu')
    ) {
      clearInterval(retryTimer);
    }

    if (attempts >= 40) {
      clearInterval(retryTimer);
    }
  }, 500);

  loadBackgroundImage();
})();
</script>
</body>
</html>
