<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script defer src="https://cloud.umami.is/script.js" data-website-id="91b385cc-f385-40f6-919f-2cd4e6d7e2c7"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wincon</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
overflow:hidden;
background:#1e1f22;
color:white;
width:100vw;
height:100vh;
}

#desktop{
position:fixed;
inset:0;
background:linear-gradient(135deg,#1f232a,#17191f);
overflow:hidden;
}

.window{
position:absolute;
background:#2b313b;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 25px 80px rgba(0,0,0,.45);
display:flex;
flex-direction:column;
overflow:hidden;
min-width:320px;
min-height:180px;
animation:openAnim .14s ease;
}

@keyframes openAnim{
from{
opacity:0;
transform:scale(.96);
}
to{
opacity:1;
transform:scale(1);
}
}

.window.maximized{
left:0 !important;
top:0 !important;
width:100vw !important;
height:calc(100vh - 52px) !important;
border-radius:0;
}

.titlebar{
height:42px;
background:#39414d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
cursor:move;
flex-shrink:0;
}

.title-left{
display:flex;
align-items:center;
gap:10px;
}

.window-controls{
display:flex;
gap:6px;
}

.win-btn{
width:32px;
height:32px;
border:none;
border-radius:8px;
background:#4d5767;
color:white;
cursor:pointer;
}

.win-btn:hover{
background:#64748b;
}

.content{
flex:1;
overflow:auto;
padding:14px;
background:#20242b;
}

#taskbar{
position:fixed;
left:0;
right:0;
bottom:0;
height:52px;
background:rgba(20,20,20,.92);
backdrop-filter:blur(12px);
display:flex;
align-items:center;
gap:10px;
padding:0 10px;
z-index:999999;
}

#menuBtn{
height:40px;
padding:0 16px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

#taskIcons{
display:flex;
gap:8px;
}

.task-icon{
width:40px;
height:40px;
border-radius:10px;
background:#3d4654;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.task-icon.minimized{
opacity:.45;
}

#menu{
position:fixed;
left:10px;
bottom:62px;
width:340px;
height:520px;
background:#2d333c;
border-radius:16px;
display:none;
flex-direction:column;
padding:12px;
overflow:auto;
z-index:99999999;
}

.menu-item{
width:100%;
min-height:48px;
border:none;
border-radius:10px;
background:#404a58;
color:white;
text-align:left;
padding:0 12px;
margin-bottom:8px;
cursor:pointer;
}

.menu-item:hover{
background:#556173;
}

/* Wincon 12 Horizon: searchable app menu */
#menu .wincon-menu-search{position:sticky;top:-12px;z-index:2;display:block;width:100%;box-sizing:border-box;margin:-12px 0 12px;padding:12px 13px;border:1px solid #64748b;border-radius:10px;background:#1f2937;color:#fff;font:inherit;outline:none;}
#menu .wincon-menu-search::placeholder{color:#cbd5e1;}
#menu .wincon-menu-search:focus{border-color:#60a5fa;box-shadow:0 0 0 2px #3b82f655;}
#menu .wincon-menu-empty{padding:14px;color:#cbd5e1;text-align:center;font-size:13px;}

#contextMenu{
position:fixed;
width:240px;
background:#2c313b;
border-radius:12px;
overflow:hidden;
display:none;
z-index:999999999;
}

.context-item{
height:42px;
display:flex;
align-items:center;
padding:0 12px;
cursor:pointer;
}

.context-item:hover{
background:#4c5769;
}

.action{
width:100%;
height:42px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

.setting-group{
background:#343b46;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}

input,
select,
textarea{
width:100%;
height:42px;
border:none;
border-radius:10px;
background:#4d5767;
color:white;
padding:0 10px;
margin-top:8px;
}

textarea{
height:260px;
resize:none;
padding:10px;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

.resize-handle{
position:absolute;
right:0;
bottom:0;
width:18px;
height:18px;
cursor:nwse-resize;
}

.spinner{
width:64px;
height:64px;
border:5px solid rgba(255,255,255,.2);
border-top:5px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

#bootScreen{
position:fixed;
inset:0;
background:#121;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:18px;
z-index:999999999;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:999px;
background:#475569;
font-size:12px;
margin-top:8px;
}
#tray{

margin-left:auto;

display:flex;

align-items:center;

gap:8px;

height:100%;

}


#networkStatus,
#batteryStatus,
#clock{

height:40px;

padding:4px 10px;

border-radius:10px;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

background:transparent;

}


#networkStatus:hover,
#batteryStatus:hover,
#clock:hover{

background:#3d4654;

}


#batteryStatus{

gap:4px;

font-size:16px;

}


#clock{

flex-direction:column;

line-height:16px;

min-width:75px;

}


#time{

font-size:15px;

font-weight:600;

}


#date{

font-size:12px;

opacity:.8;

}
#controlCenter{

position:fixed;

right:10px;

bottom:62px;

width:320px;

background:#2d333c;

border-radius:16px;

padding:16px;

display:none;

z-index:999999999;

box-shadow:
0 20px 60px rgba(0,0,0,.5);

}


.cc-card{

background:#39414d;

border-radius:12px;

padding:12px;

margin-bottom:10px;

}


.cc-card p{

margin-top:8px;

opacity:.9;

}
#batteryBar{

width:100%;

height:18px;

background:#444;

border-radius:10px;

overflow:hidden;

margin-top:10px;

}


#batteryFill{

height:100%;

width:0%;

background:#22c55e;

transition:.3s;

}


.icon-toggle{

width:50px;

height:50px;

border:none;

border-radius:14px;

font-size:24px;

cursor:pointer;

background:#2563eb;

color:white;

}


.icon-toggle:hover{

opacity:.8;

}
#winconUACOverlay {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    display: none;

    align-items: center !important;
    justify-content: center !important;

    background:
        rgba(0, 0, 0, 0.7);

    z-index: 2147483647 !important;

    margin: 0 !important;
    padding: 0 !important;

    transform: none !important;
}


#winconUACOverlay.show {

    display: flex !important;

}


#winconUACDialog {

    position:relative !important;

    width:560px !important;
    height:360px !important;

    max-width:calc(100vw - 40px);
    max-height:calc(100vh - 40px);

    min-width:0;
    min-height:0;

    box-sizing:border-box;

}
#winconUACDialog {

    position: relative !important;

    left: auto !important;
    top: auto !important;

    width: 560px !important;
    height: 360px !important;

    max-width: calc(100vw - 40px) !important;
    max-height: calc(100vh - 40px) !important;

    min-width: 0 !important;
    min-height: 0 !important;

    margin: 0 !important;

    display: flex !important;
    flex-direction: column !important;

    box-sizing: border-box !important;

    z-index: 2147483647 !important;

    transform: none !important;

    opacity: 1 !important;
    visibility: visible !important;

    pointer-events: auto !important;
}


#winconUACIcon{
    font-size:42px;
    line-height:1;
}


#winconUACTitle{
    font-size:22px;
    font-weight:600;
    margin-bottom:12px;
}


#winconUACAppName{
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}


#winconUACDescription{
    font-size:14px;
    opacity:.8;
    line-height:1.5;
}


#winconUACButtons{

    margin-top:auto;

    display:flex;
    justify-content:flex-end;
    gap:10px;

}


#winconUACButtons .action{

    min-width:100px;
    height:40px;

}

/* ========================================
   Wincon UAC - Absolute Top Layer
   ======================================== */

#winconUACOverlay {

    position: fixed !important;

    inset: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    display: none !important;

    align-items: center !important;
    justify-content: center !important;

    margin: 0 !important;
    padding: 0 !important;

    background:
        rgba(0, 0, 0, .70) !important;

    z-index: 2147483647 !important;

    transform: none !important;

    isolation: isolate !important;

    pointer-events: auto !important;
}

#winconUACOverlay.show {

    display: flex !important;

}

#winconUACOverlay
#winconUACDialog {

    flex: 0 0 auto !important;

    opacity: 1 !important;
    visibility: visible !important;

    pointer-events: auto !important;

    z-index: 2147483647 !important;

    animation: none !important;
}

#winconUACOverlay
#winconUACDialog .titlebar {

    flex-shrink: 0 !important;

}

#winconUACOverlay
#winconUACDialog .content {

    flex: 1 !important;

    min-height: 0 !important;

    display: flex !important;

    flex-direction: column !important;

    padding: 28px !important;

    box-sizing: border-box !important;

    gap: 16px !important;

    overflow: auto !important;
}

#winconNotificationLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2147483647;

    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;

    padding: 20px;
    gap: 10px;

    box-sizing: border-box;
}

#winconNotificationLayer {
    position: fixed !important;

    top: 20px !important;
    right: 20px !important;

    width: 380px;
    max-width: calc(100vw - 40px);

    display: flex;

    flex-direction: column;
    align-items: flex-end;

    gap: 10px;

    pointer-events: none;

    z-index: 2147483647 !important;

    isolation: isolate;
}

.wincon-notification {
    position: relative;

    pointer-events: auto;

    width: 100%;
    box-sizing: border-box;

    padding: 14px 16px;

    border-radius: 12px;

    background: rgba(32, 32, 32, 0.96);

    color: white;

    border: 1px solid rgba(255, 255, 255, 0.15);

    box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);

    opacity: 0;

    transform: translateX(40px);

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.wincon-notification.visible {
    opacity: 1;
    transform: translateX(0);
}

.wincon-notification.removing {
    opacity: 0;
    transform: translateX(40px);
}

.wincon-notification-title {
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 5px;
}

.wincon-notification-message {
    font-size: 13px;
    line-height: 1.5;

    white-space: pre-line;
}
</style>
</head>
<body>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
        try {
            await navigator.serviceWorker.register("./sw.js");
            console.log("Service Worker登録完了");
        } catch (e) {
            console.error("Service Worker登録失敗", e);
        }
    });
}
const ENTERPRISE_STORAGE_KEY="winconEnterpriseApps";
const ably = new Ably.Realtime({
  token:"YOUR_TOKEN"
});

const ablyChannel =
ably.channels.get(
  "wincon-appcenter"
);
function loadEnterpriseApps(){

try{

const data=JSON.parse(
localStorage.getItem(
ENTERPRISE_STORAGE_KEY
)||"[]"
);

if(Array.isArray(data)){
window.__WINCON_ENTERPRISE_APPS__=data;
}

}catch(e){

window.__WINCON_ENTERPRISE_APPS__=[];

}

}

function saveEnterpriseApps(){

localStorage.setItem(
ENTERPRISE_STORAGE_KEY,
JSON.stringify(
window.__WINCON_ENTERPRISE_APPS__
)
);

}

const desktop=document.getElementById("desktop");
const menu=document.getElementById("menu");
const contextMenu=document.getElementById("contextMenu");
const taskIcons=document.getElementById("taskIcons");

let zIndexCounter=100;

window.__WINCON_ENTERPRISE_APPS__=
window.__WINCON_ENTERPRISE_APPS__||[];
loadEnterpriseApps();
let menuItems=JSON.parse(
localStorage.getItem("winconMenuItems")||"null"
)||[
{
title:"テストウィンドウ",
icon:"🪟",
type:"window"
},
{
title:"テストポップアップ",
icon:"⚠️",
type:"popup"
},
{
  title:"Sail Browser",
  icon:"🌐",
  type:"browser",
  system:true
},
{
title:"ファイル",
icon:"📁",
type:"file",
system:true
},
{
  title:"Module Center",
  icon:"📦",
  type:"appcenter",
  system:true
},
{
  title:"Module Center Developer",
  icon:"🛠️",
  type:"appcenterdev",
  system:true
},
{
title:"タスクマネージャ",
icon:"📊",
type:"task",
system:true
},
{
id: "wincon-assistant",
title: "Wincon Assistant",
icon: "🤖",
type: "assistant",
system: true,
hidden:true
},
{
title:"システム設定",
icon:"⚙️",
type:"settings",
system:true
},
{
title:"リカバリ",
icon:"🛠️",
type:"recovery",
system:true,
hidden:true
},
{
title:"電源を切る",
icon:"⏻",
type:"shutdown",
system:true
},
{
title:"お引越し",
icon:"📦",
type:"transfer",
system:true,
hidden:true
},

{
  title:"ターミナル",
  icon:"⌨️",
  type:"terminal",
  system:true
},
,{
  title:"Wincon Core Service",
  icon:"⚙️",
  type:"coreservice",
  system:true,
  hidden:false
},

{
  title:"Wincon Reset Center",
  icon:"🧹",
  type:"reset",
  system:true,
  hidden:true
}
 ];

// Module Center Gameはデスクトップからも起動できる独立アプリ。
if (!menuItems.some(item => item && item.type === "gamecenter")) {
    menuItems.push({ title:"Module Center Game", icon:"🎮", type:"gamecenter", system:true });
}

function mergeEnterpriseApps(){

if(
!Array.isArray(
window.__WINCON_ENTERPRISE_APPS__
)
){
window.__WINCON_ENTERPRISE_APPS__=[];
}

menuItems=
menuItems.filter(
m=>!m.enterprise
);

window.__WINCON_ENTERPRISE_APPS__
.forEach(app=>{

menuItems.unshift({
...app,
enterprise:true
});

});

}

function boot(){

mergeEnterpriseApps();

renderMenu();

restoreState();

setupSecurityShortcut();

startTutorial();

}

setTimeout(()=>{

const bootScreen=document.getElementById("bootScreen");

if(bootScreen){
bootScreen.remove();
}

boot();

},1200);

function setupSecurityShortcut(){

window.addEventListener("keydown",e=>{

if(e.ctrlKey&&e.shiftKey){
openSecurityOptions();
}

if(e.key==="Escape"){
openSystemSettings(true);
}

});

}
function fullFactoryReset(){
    if(typeof window.Wincon10HorizonFactoryReset==="function"){
        return window.Wincon10HorizonFactoryReset();
    }
    if(!confirm("Winconを完全初期化しますか？"))return;
    localStorage.clear();
    sessionStorage.clear();
    location.reload();
}
let hiddenCommand="";

window.addEventListener(
"keydown",
e=>{

hiddenCommand+=e.key;

hiddenCommand=
hiddenCommand.slice(-20);

if(
hiddenCommand
.toLowerCase()
.includes("fullreset")
){

fullFactoryReset();

}

}
);
document.getElementById("menuBtn").onclick=()=>{

menu.style.display=
menu.style.display==="flex"
?"none"
:"flex";

};

function renderMenu(){

menu.innerHTML="";
const search=document.createElement("input");
search.type="search";
search.className="wincon-menu-search";
search.placeholder="アプリを検索...";
search.setAttribute("aria-label","アプリを検索");
search.autocomplete="off";
menu.appendChild(search);
const empty=document.createElement("div");
empty.className="wincon-menu-empty";
empty.textContent="一致するアプリがありません";
empty.hidden=true;
menu.appendChild(empty);
const appButtons=[];

menuItems.forEach(item=>{

if(item.hidden)return;

const btn=document.createElement("button");

btn.className="menu-item";

btn.innerHTML=
`${item.icon} ${item.title}`;

btn.onclick=()=>{

menu.style.display="none";

switch(item.type){

case "window":
openTestWindow();
break;
case "coreservice":
openCoreService();
break;
case "popup":
openTestPopup();
break;

case "file":
case "diskutility":
openDiskUtility();
break;
case "horizon-directory":
openHorizonDirectory();
break;
case "horizon-note":
openHorizonNote();
break;
case "miniapps-builder":
openWinconMiniAppsBuilder();
break;
case "miniapps-utility":
openWinconMiniAppsUtility();
break;
case "wincon-native-app":
openWinconNativeApp(item);
break;

case "task":
openTaskManager();
break;

case "settings":
openSystemSettings(false);
break;

case "recovery":
openRecovery();
break;

case "shutdown":
shutdownSystem();
break;
        
case "assistant":
toggleWinconAssistant();
break;
        
case "wincon-intelligence":
    if (
        window.WinconIntelligence &&
        typeof window.WinconIntelligence.open === "function"
    ) {

function ensureWinconSystemWindowLayer(){
    let layer=document.getElementById("winconSystemWindowLayer");
    if(!layer){
        layer=document.createElement("div");
        layer.id="winconSystemWindowLayer";
        document.body.appendChild(layer);
    }
    return layer;

window.Wincon12SystemWindow={
    open(options={}){
        return createWindow({...options,systemLayer:true,noTaskbar:true});
    },
    run(callback){
        const previous=!!window.__WINCON12_FORCE_SYSTEM_WINDOW_LAYER__;
        window.__WINCON12_FORCE_SYSTEM_WINDOW_LAYER__=true;
        try{
            const result=callback();
            if(result&&typeof result.finally==="function"){
                return result.finally(()=>{window.__WINCON12_FORCE_SYSTEM_WINDOW_LAYER__=previous;});
            }
            window.__WINCON12_FORCE_SYSTEM_WINDOW_LAYER__=previous;
            return result;
        }catch(error){
            window.__WINCON12_FORCE_SYSTEM_WINDOW_LAYER__=previous;
            throw error;
        }
    },
    getLayer(){
        return ensureWinconSystemWindowLayer();
    }
};

function createWindow(options){

const {
title="Window",
icon="🪟",
content="",
width=700,
height=450,
popup=false,
safe=false,
systemLayer=false,
noTaskbar=false
}=options;

const win=document.createElement("div");
win.dataset.popup = popup ? "true" : "false";
win.className="window"+(systemLayer?" wincon-system-window":"");

win.style.width=(popup?560:width)+"px";
win.style.height=(popup?360:height)+"px";

win.style.left=
Math.random()*240+80+"px";

win.style.top=
Math.random()*120+60+"px";

win.style.zIndex=++zIndexCounter;

win.dataset.title=title;

win.innerHTML=`

<div class="titlebar">

<div class="title-left">
<div>${icon}</div>
<div>${title}</div>
</div>

<div class="window-controls">

${popup?"":`
<button class="win-btn min-btn">
<i class="fa-solid fa-minus"></i>
</button>
`}

${popup||safe?"":`
<button class="win-btn max-btn">
<i class="fa-regular fa-square"></i>
</button>
`}

${safe?"":`
<button class="win-btn close-btn">
<i class="fa-solid fa-xmark"></i>
</button>
`}

</div>

</div>

<div class="content">
${content}
</div>

${popup?"":"<div class='resize-handle'></div>"}

`;

const useSystemLayer=systemLayer||!!window.__WINCON12_FORCE_SYSTEM_WINDOW_LAYER__;
if(useSystemLayer)win.classList.add("wincon-system-window");
const targetLayer=useSystemLayer?ensureWinconSystemWindowLayer():desktop;
targetLayer.appendChild(win);

const task=noTaskbar?null:document.createElement("div");

if(task){
    task.className="task-icon";
    task.innerHTML=icon;
    task.title=title;
    taskIcons.appendChild(task);
    task.onclick=()=>{
        win.style.display="flex";
        task.classList.remove("minimized");
        win.style.zIndex=++zIndexCounter;
    };
}

const titlebar=win.querySelector(".titlebar");

let dragging=false;
let offsetX=0;
let offsetY=0;

titlebar.addEventListener("mousedown",e=>{

dragging=true;

offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;

win.style.zIndex=++zIndexCounter;

});

window.addEventListener("mousemove",e=>{

if(!dragging)return;

if(win.classList.contains("maximized"))
return;

win.style.left=
e.clientX-offsetX+"px";

win.style.top=
e.clientY-offsetY+"px";

});

window.addEventListener("mouseup",()=>{
dragging=false;
});

const resize=win.querySelector(".resize-handle");

if(resize){

let resizing=false;
let startX,startY,startW,startH;

resize.addEventListener("mousedown",e=>{

resizing=true;

startX=e.clientX;
startY=e.clientY;

startW=win.offsetWidth;
startH=win.offsetHeight;

e.preventDefault();

});

window.addEventListener("mousemove",e=>{

if(!resizing)return;

win.style.width=
startW+(e.clientX-startX)+"px";

win.style.height=
startH+(e.clientY-startY)+"px";

});

window.addEventListener("mouseup",()=>{
resizing=false;
});

}

const closeBtn=win.querySelector(".close-btn");
const maxBtn=win.querySelector(".max-btn");
const minBtn=win.querySelector(".min-btn");

if(closeBtn){

closeBtn.onclick=()=>{

if(task)task.remove();
win.remove();

saveState();

};

}

if(maxBtn){

maxBtn.onclick=()=>{

win.classList.toggle("maximized");

};

}

if(minBtn){

minBtn.onclick=()=>{

win.style.display="none";

if(task)task.classList.add("minimized");

};

}

saveState();

return win;

}

    // 操作不能化

function normalizeGitHubPages(url){

if(url.includes("github.com")){

const parts=url
.replace("https://github.com/","")
.split("/");

return `https://${parts[0]}.github.io/${parts[1]}/`;

}

return url;

}

        return;

    }


    const app = {

        "Supabaseに送信しています...";


    try{

        const res = await fetch(

            MODULE_API,

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify(app)

            }

        );


        if(!res.ok){

            throw new Error("HTTP " + res.status);

        }


        const json = await res.json();

console.log("[Module Center] Response:", json);

if (
    json.error ||
    json.success === false ||
    json.result === "error"
) {
    throw new Error(
        typeof json.error === "object"
            ? JSON.stringify(json.error, null, 2)
            : String(
                json.error ||
                json.message ||
                "Supabaseへの保存に失敗しました"
            )
    );
}

alert("サーバーから応答がありました。");


    }catch(error){

        console.error(error);

        status.textContent =
            "公開失敗: " + error.message;

        alert("公開に失敗しました。\n" + error.message);

    }

}

function renderStore(apps){

    const list =
        document.getElementById("appCenterList");

    if(!list) return;

    list.innerHTML = "";

    if (window.__WINCON_GAME_CENTER_VIEW__ === true) {
        apps = (apps || []).filter(app => app && app.isGame === true);
    }

    // 検索欄

    const search = document.createElement("input");

    search.id = "appCenterSearch";

    search.placeholder = "🔍 アプリを検索...";

    search.style.cssText = `
        width:calc(100% - 20px);
        padding:10px;
        margin:10px;
        box-sizing:border-box;
    `;

    list.appendChild(search);


    const results = document.createElement("div");

    list.appendChild(results);


    function drawApps(keyword = ""){

        results.innerHTML = "";

        const filtered = apps.filter(app => {

            const text = (
                (app.title || "") + " " +
                (app.description || "")
            ).toLowerCase();

            return text.includes(keyword.toLowerCase());

        });


        if(filtered.length === 0){

            results.textContent = "アプリが見つかりません。";

            return;

        }


        filtered.forEach(app => {

            const card = document.createElement("div");

            card.style.cssText = `
                border:1px solid #666;
                padding:12px;
                margin:8px;
                border-radius:10px;
            `;


            // アイコンとタイトル

            const heading = document.createElement("h3");

            heading.style.cssText = `
                display:flex;
                align-items:center;
                gap:12px;
            `;


            if(app.iconImage){

                const img = document.createElement("img");

                img.src = app.iconImage;

                img.style.cssText = `
                    width:48px;
                    height:48px;
                    object-fit:contain;
                    border-radius:8px;
                `;

                img.onerror = () => {

                    img.replaceWith(
                        document.createTextNode(app.icon || "📦")
                    );

                };

                heading.appendChild(img);

            }else{

                heading.appendChild(
                    document.createTextNode(app.icon || "📦")
                );

            }


            const title = document.createElement("span");

            title.textContent = app.title || "無題";

            heading.appendChild(title);

            card.appendChild(heading);


            // ゲーム表示

            if(app.isGame === true){

                const badge = document.createElement("span");

                badge.textContent = "🎮 GAME";

                badge.style.cssText = `
                    display:inline-block;
                    padding:4px 9px;
                    background:#345b91;
                    color:white;
                    border-radius:5px;
                    font-size:12px;
                `;

                card.appendChild(badge);

            }


            // 説明

            const desc = document.createElement("p");

            desc.textContent = app.description || "";

            card.appendChild(desc);


            // インストール

            const button = document.createElement("button");

            button.className = "action";

            button.textContent = "インストール";

            button.onclick = () => {

                installApp(app.id);

            };

            card.appendChild(button);


            results.appendChild(card);

        });

    }


    search.addEventListener("input",() => {

        drawApps(search.value);

    });


    drawApps();

}

function cancelPower(){

    pendingPowerAction = null;

    const box =
        document.getElementById("powerConfirm");

    if(!box){
        return;
    }

    box.style.display = "none";

}
function executePower(){

    const action = pendingPowerAction;

    // 先に状態を解除
    pendingPowerAction = null;

    if(action === "shutdown"){

        shutdownSystem();

        // shutdownSystem() 後はDOMが全置換されるので
        // cancelPower() を絶対に呼ばない
        return;

    }

    if(action === "restart"){

        restartSystem();

        return;

    }

    cancelPower();

}

const WINCON_API_ALLOWED_ORIGIN =
    "https://ayatocraft.github.io";

const winconAPIWindows = new Map();


// ----------------------------------------
// API初期化
// ----------------------------------------

function initWinconAppAPI() {

    window.addEventListener(
        "message",
        handleWinconAppMessage
    );

    console.log(
        "[Wincon API] Ready"
    );
}


// ----------------------------------------
// Message受信
// ----------------------------------------

function handleWinconAppMessage(event) {

    if (
        event.origin !==
        WINCON_API_ALLOWED_ORIGIN
    ) {
        return;
    }

    const data = event.data;

    if (
        !data ||
        data.type !== "wincon"
    ) {
        return;
    }

    switch (data.action) {

        case "getApps":

            winconAPIGetApps(event);

            break;


        case "searchApps":

            winconAPISearchApps(
                event,
                data
            );

            break;


        case "openWindow":

            winconAPIOpenWindow(
                event,
                data
            );

            break;


        case "launchApp":

            winconAPILaunchApp(
                event,
                data
            );

            break;


        case "closeWindow":

            winconAPICloseWindow(
                event,
                data
            );

            break;


        case "setWindowTitle":

            winconAPISetWindowTitle(
                event,
                data
            );

            break;


        default:

            winconAPISend(
                event,
                "error",
                {
                    message:
                        "Unknown API action",
                    action:
                        data.action
                }
            );

    }

}


// ----------------------------------------
// APIレスポンス
// ----------------------------------------

function winconAPISend(
    event,
    action,
    data = {}
) {

    if (
        !event.source ||
        !event.source.postMessage
    ) {
        return;
    }

    event.source.postMessage(

        {
            type: "wincon",
            action,
            ...data
        },

        event.origin

    );

}


// ----------------------------------------
// App情報を作る
// ----------------------------------------

function winconAPIFormatApp(
    app,
    index
) {

    return {

        id:
            app.id ||
            app.appId ||
            app.title ||
            "app-" + index,

        title:
            app.title || "",

        icon:
            app.icon || "🌐",

        type:
            app.type || "app",

        popup:
            !!app.popup,

        system:
            !!app.system,

        enterprise:
            !!app.enterprise

    };

}


// ----------------------------------------
// App一覧
// ----------------------------------------

function winconAPIGetApps(event) {

    const apps =
        menuItems.map(
            winconAPIFormatApp
        );

    winconAPISend(
        event,
        "apps",
        {
            apps
        }
    );

}


// ----------------------------------------
// App検索
// ----------------------------------------

function winconAPISearchApps(
    event,
    data
) {

    const query =
        String(
            data.query || ""
        )
        .trim()
        .toLowerCase();


    const apps =
        menuItems

        .filter(app => {

            const title =
                String(
                    app.title || ""
                ).toLowerCase();

            const type =
                String(
                    app.type || ""
                ).toLowerCase();

            return (
                title.includes(query) ||
                type.includes(query)
            );

        })

        .map(
            winconAPIFormatApp
        );


    winconAPISend(
        event,
        "searchResults",
        {
            query,
            apps
        }
    );

}


// ----------------------------------------
// App起動
// ----------------------------------------

function winconAPILaunchApp(
    event,
    data
) {

    if (!data.appId) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "appId is required"
            }
        );

        return;

    }


    const app =
        menuItems.find(
            (item, index) => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id ===
                    data.appId
                );

            }
        );


    if (!app) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "App not found",

                appId:
                    data.appId
            }
        );

        return;

    }


    winconOpenAppAPI(app);


    winconAPISend(
        event,
        "launchResult",
        {
            success: true,

            appId:
                data.appId,

            title:
                app.title
        }
    );

}


// ----------------------------------------
// 既存Winconアプリを起動

function winconOpenAppAPI(app) {

    switch (app.type) {

        case "window":

            openTestWindow();

            break;


        case "popup":

            openTestPopup();

            break;


        case "file":

            openFileManager();

            break;


        case "task":

            openTaskManager();

            break;


        case "settings":

            openSystemSettings(false);

            break;


        case "recovery":

            openRecovery();

            break;


        case "shutdown":

            shutdownSystem();

            break;


        case "externalHTML":

            openExternalHTML(app);

            break;


        case "transfer":

            openTransferApp();

            break;


        case "terminal":

            openTerminal();

            break;


        case "reset":

            openResetCenter();

            break;


        case "browser":

            openBrowser();

            break;


        case "appcenter":

            openAppCenter();

            break;

        case "gamecenter":
            openGameCenter();
            break;


        case "appcenterdev":

            openAppCenterDeveloper();

            break;


        case "coreservice":

            openCoreService();

            break;


        default:

            if (app.source) {

                openExternalHTML(app);

            }

            break;

    }

}


// ----------------------------------------
// 外部HTML Windowを開く
// ----------------------------------------

function winconAPIOpenWindow(event, data) {

    if (!data.url) {

        winconAPISend(
            event,
            "error",
            {
                message: "url is required"
            }
        );

        return;
    }


    const windowId =
        "wincon-" +
        crypto.randomUUID();


    const separator =
        data.url.includes("?")
            ? "&"
            : "?";


    const finalURL =
        data.url +
        separator +
        "winconWindowId=" +
        encodeURIComponent(windowId);


    const win =
        createWindow({

            title:
                data.title ||
                "Wincon App",

            icon:
                data.icon ||
                "🌐",

            width:
                Number(data.width) ||
                800,

            height:
                Number(data.height) ||
                600,

            popup:
                data.popup === true ||
                data.windowType === "popup",

            content: `
                <iframe
                    src="${finalURL}"
                    style="
                        width:100%;
                        height:100%;
                        border:0;
                    "
                ></iframe>
            `

        });


    win.dataset.apiWindowId =
        windowId;


    winconAPIWindows.set(
        windowId,
        win
    );


    winconAPISend(
        event,
        "windowOpened",
        {
            success: true,
            windowId: windowId
        }
    );

}


// ----------------------------------------
// Windowを閉じる
// ----------------------------------------

function winconAPICloseWindow(
    event,
    data
) {

    const win =
        winconAPIWindows.get(
            data.windowId
        );


    if (!win) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "Window not found",

                windowId:
                    data.windowId
            }
        );

        return;

    }


    win.remove();


    winconAPIWindows.delete(
        data.windowId
    );


    winconAPISend(
        event,
        "windowClosed",
        {
            success: true,

            windowId:
                data.windowId
        }
    );

}


// ----------------------------------------
// Windowタイトル変更
// ----------------------------------------

function winconAPISetWindowTitle(
    event,
    data
) {

    const win =
        winconAPIWindows.get(
            data.windowId
        );


    if (!win) {

        winconAPISend(
            event,
            "error",
            {
                message:
                    "Window not found",

                windowId:
                    data.windowId
            }
        );

        return;

    }


    const title =
        data.title ||
        "Wincon App";


    win.dataset.title =
        title;


    const titleElement =
        win.querySelector(
            ".title-left div:last-child"
        );


    if (titleElement) {

        titleElement.textContent =
            title;

    }


    /*
     * タスクバーアイコンのタイトルも更新
     */

    const taskIcon =
        [...document.querySelectorAll(
            ".task-icon"
        )]
        .find(
            icon =>
                icon.title ===
                win.dataset.title
        );


    if (taskIcon) {

        taskIcon.title =
            title;

    }


    winconAPISend(
        event,
        "titleChanged",
        {
            success: true,

            windowId:
                data.windowId,

            title
        }
    );

}


// ----------------------------------------
// Wincon Windowが閉じられたときの後処理
// ----------------------------------------

function winconAPIForgetWindow(
    win
) {

    for (
        const [
            windowId,
            storedWindow
        ]
        of winconAPIWindows
    ) {

        if (
            storedWindow ===
            win
        ) {

            winconAPIWindows.delete(
                windowId
            );

            break;

        }

    }

}

  searchApps: function (query) {
    var q = String(query || "").trim().toLowerCase();

    if (!Array.isArray(window.menuItems)) {
      return [];
    }

    return window.menuItems.filter(function (app) {
      var text = [
        app.title || "",
        app.name || "",
        app.description || "",
        app.type || ""
      ].join(" ").toLowerCase();

      return !q || text.includes(q);
    });
  },

  getApps: function () {
    return Array.isArray(window.menuItems)
      ? window.menuItems.slice()
      : [];
  },

  launchApp: function (app) {
    if (typeof window.winconOpenAppAPI === "function") {
      window.winconOpenAppAPI(app);
      return true;
    }

    return false;
  }
};

// ----------------------------------------
// Moduleインストール
// ----------------------------------------

async function winconInstallModule(
    module
) {

    // ------------------------------------
    // モジュール情報チェック
    // ------------------------------------

    if (
        !module ||
        typeof module !== "object"
    ) {

        return {
            success: false,
            reason: "invalid-module"
        };

    }


    if (!module.id) {

        return {
            success: false,
            reason: "missing-id"
        };

    }


    // ------------------------------------
    // 既にインストールされているか確認
    // ------------------------------------

    const alreadyInstalled =
        menuItems.some(
            item => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id === module.id
                );

            }
        );


    if (alreadyInstalled) {

        return {
            success: false,
            reason: "already-installed"
        };

    }


    // ------------------------------------
    // UAC
    // ------------------------------------

    const allowed =
        await requestWinconUAC({

            title:
                module.title ||
                module.name ||
                "不明なアプリ",

            icon:
                module.icon ||
                "📦",

            description:
                module.description ||
                "このモジュールをWinconにインストールします。"

        });


    // ------------------------------------
    // UAC拒否
    // ------------------------------------

    if (!allowed) {

        return {
            success: false,
            reason: "uac-denied"
        };

    }


    // ------------------------------------
    // Module作成
    // ------------------------------------

    const newModule = {

        id:
            module.id,

        title:
            module.title ||
            module.name ||
            "名称未設定",

        icon:
            module.icon ||
            "📦",

        type:
            module.type ||
            "window",

        content:
            module.content ||
            "",

        source:
            module.source ||
            "",

        version:
            module.version ||
            "1.0.0",

        description:
            module.description ||
            "",

        system:
            false,

        thirdParty:
            true

    };


    // ------------------------------------
    // menuItemsへ追加
    // ------------------------------------

    menuItems.push(
        newModule
    );


    // ------------------------------------
    // 保存
    // ------------------------------------

    localStorage.setItem(
        "winconMenuItems",
        JSON.stringify(
            menuItems
        )
    );


    saveState();


    // ------------------------------------
    // メニュー更新
    // ------------------------------------

    if (
        typeof renderMenu ===
        "function"
    ) {

        renderMenu();

    }


    console.log(
        "[Wincon Module API] Module installed:",
        newModule.id
    );


    return {

        success:
            true,

        module:
            winconAPIFormatApp(
                newModule,
                menuItems.length - 1
            )

    };

}


// ----------------------------------------
// Moduleインストール確認
// ----------------------------------------

function winconIsModuleInstalled(
    id
) {

    if (!id) {

        return false;

    }


    return menuItems.some(
        item => {

            const itemId =
                item.id ||
                item.appId ||
                item.title;

            return (
                itemId === id
            );

        }
    );

}


// ----------------------------------------
// Third-party Module一覧
// ----------------------------------------

function winconGetInstalledModules() {
    return menuItems
        .filter(item => item.thirdParty === true)
        .map((item, index) => winconAPIFormatApp(item, index));
}

// ----------------------------------------

function requestWinconUAC(options = {}) {

    const overlay =
        document.getElementById(
            "winconUACOverlay"
        );

    if (!overlay) {

        console.error(
            "[Wincon UAC] Overlay not found"
        );

        return Promise.resolve(false);
    }


    // 既に表示中なら拒否
    if (winconUACActive) {

        return Promise.resolve(false);
    }


    winconUACActive = true;


    const appName =
        document.getElementById(
            "winconUACAppName"
        );

    const appIcon =
        document.getElementById(
            "winconUACIcon"
        );

    const description =
        document.getElementById(
            "winconUACDescription"
        );


    if (appName) {

        appName.textContent =
            options.title ||
            "不明なアプリ";

    }


    if (appIcon) {

        appIcon.textContent =
            options.icon ||
            "🛡️";

    }


    if (description) {

        description.textContent =
            options.description ||
            "このアプリはWinconに変更を加えようとしています。";

    }


    overlay.classList.add(
        "show"
    );


    return new Promise(resolve => {

        winconUACResolve =
            resolve;

    });

}


// ----------------------------------------
// UACを閉じる
// ----------------------------------------

function closeWinconUAC(result = false) {

    const overlay =
        document.getElementById(
            "winconUACOverlay"
        );


    if (overlay) {

        overlay.classList.remove(
            "show"
        );

    }


    winconUACActive = false;


    if (typeof winconUACResolve === "function") {

        const resolve =
            winconUACResolve;


        winconUACResolve =
            null;


        resolve(
            result
        );

    }

}

// ----------------------------------------
// Moduleインストール
// ----------------------------------------

async function winconInstallModule(
    module
) {

    // ------------------------------------
    // モジュール情報チェック
    // ------------------------------------

    if (
        !module ||
        typeof module !== "object"
    ) {

        return {
            success: false,
            reason: "invalid-module"
        };

    }


    if (!module.id) {

        return {
            success: false,
            reason: "missing-id"
        };

    }


    // ------------------------------------
    // 既にインストールされているか確認
    // ------------------------------------

    const alreadyInstalled =
        menuItems.some(
            item => {

                const id =
                    item.id ||
                    item.appId ||
                    item.title;

                return (
                    id === module.id
                );

            }
        );


    if (alreadyInstalled) {

        return {
            success: false,
            reason: "already-installed"
        };

    }


    // ------------------------------------
    // UAC
    // ------------------------------------

    const allowed =
        await requestWinconUAC({

            title:
                module.title ||
                module.name ||
                "不明なアプリ",

            icon:
                module.icon ||
                "📦",

            description:
                module.description ||
                "このモジュールをWinconにインストールします。"

        });


    // ------------------------------------
    // UAC拒否
    // ------------------------------------

    if (!allowed) {

        return {
            success: false,
            reason: "uac-denied"
        };

    }


    // ------------------------------------
    // Module作成
    // ------------------------------------

    const newModule = {

        id:
            module.id,

        title:
            module.title ||
            module.name ||
            "名称未設定",

        icon:
            module.icon ||
            "📦",

        type:
            module.type ||
            "window",

        content:
            module.content ||
            "",

        source:
            module.source ||
            "",

        version:
            module.version ||
            "1.0.0",

        description:
            module.description ||
            "",

        system:
            false,

        thirdParty:
            true

    };


    // ------------------------------------
    // menuItemsへ追加
    // ------------------------------------

    menuItems.push(
        newModule
    );


    // ------------------------------------
    // 保存
    // ------------------------------------

    localStorage.setItem(
        "winconMenuItems",
        JSON.stringify(
            menuItems
        )
    );


    saveState();


    // ------------------------------------
    // メニュー更新
    // ------------------------------------

    if (
        typeof renderMenu ===
        "function"
    ) {

        renderMenu();

    }


    console.log(
        "[Wincon Module API] Module installed:",
        newModule.id
    );


    return {

        success:
            true,

        module:
            winconAPIFormatApp(
                newModule,
                menuItems.length - 1
            )

    };

}


// ----------------------------------------
// Moduleインストール確認
// ----------------------------------------

function winconIsModuleInstalled(
    id
) {

    if (!id) {

        return false;

    }


    return menuItems.some(
        item => {

            const itemId =
                item.id ||
                item.appId ||
                item.title;

            return (
                itemId === id
            );

        }
    );

}


// ----------------------------------------
// Third-party Module一覧
// ----------------------------------------

function winconGetInstalledModules() {
    return menuItems
        .filter(item => item.thirdParty === true)
        .map((item, index) => winconAPIFormatApp(item, index));
}

   /* =====================================================
   TV APP LIST
===================================================== */

function getTVApps() {

    return menuItems.filter(item => {

        if (!item) {
            return false;
        }

        /* 非表示項目 */
        if (item.hidden) {
            return false;
        }

        /* TV自身はTVアプリ一覧に出さない */
        if (item.type === "tv") {
            return false;
        }

        /* PopupはTVアプリ一覧に出さない */
        if (
            item.type === "popup" ||
            item.popup === true
        ) {
            return false;
        }

        /* shutdownはTVモードでは利用不可 */
        if (item.type === "shutdown") {
            return false;
        }

        /*
         * TV起動テストで失敗したアプリは
         * 現在のTVセッション中だけ除外
         */
        if (
            tvState.failedApps &&
            tvState.failedApps.has(item.title)
        ) {
            return false;
        }

        return true;
    });
}

/* =====================================================
   TV APP EXCLUSION NOTICE
===================================================== */

function notifyTVAppExcluded(appTitle, reason) {

    const name = appTitle || "このアプリ";

    const message =
        name +
        "はTVモードでは利用できないため、除外されました。" +
        (reason ? "\n" + reason : "");

    console.warn(
        "[Wincon TV] " + message
    );

    /*
     * Wincon標準通知がある場合はそれを優先
     */
    if (
        typeof window.showWinconNotification ===
        "function"
    ) {
        try {
            window.showWinconNotification(
                "Wincon TV",
                message
            );
            return;
        } catch (e) {
            console.warn(
                "[Wincon TV] 通知表示失敗",
                e
            );
        }
    }

    /*
     * 標準通知がない場合
     * TV画面内に一時表示
     */
    const page =
        document.getElementById("winconTVPage");

    if (!page) {
        return;
    }

    const notice =
        document.createElement("div");

    notice.className =
        "wincon-tv-exclusion-notice";

    notice.textContent =
        "⚠ " + message;

    page.prepend(notice);

    setTimeout(() => {

        if (notice.parentNode) {
            notice.remove();
        }

    }, 3000);
}

    function openTVMode() {

    if (tvState.active) {
        return;
    }

    installCSS();
    createTVRoot();

    tvState.active = true;
    tvState.page = "home";
    tvState.selectedIndex = 0;
    tvState.currentAppTitle = null;

    document.body.classList.add(
        "wincon-tv-active"
    );

    /*
     * 通常UIを隠す
     */
    const taskbar =
        document.getElementById("taskbar");

    if (taskbar) {
        taskbar.style.display = "none";
    }

    const menuElement =
        document.getElementById("menu");

    if (menuElement) {
        menuElement.style.display = "none";
    }

    /*
     * 既存WindowをTV開始時点で隠す。
     *
     * Popupは完全除外。
     * PopupはTVモード中でも常に表示する。
     */
    document
        .querySelectorAll(".window")
        .forEach(win => {

            /*
             * UACは絶対に触らない
             */
            if (
                win.id ===
                "winconUACDialog"
            ) {
                return;
            }

            /*
             * PopupはTV管理対象外
             */
            if (
                win.dataset.popup === "true"
            ) {
                win.style.display = "flex";
                win.style.zIndex =
                    "2147483646";
                return;
            }

            /*
             * TV開始前の状態を保存
             */
            if (
                !Object.prototype.hasOwnProperty.call(
                    win.dataset,
                    "winconTVOriginalDisplay"
                )
            ) {
                win.dataset.winconTVOriginalDisplay =
                    win.style.display || "";
            }

            win.style.display = "none";

        });

    /*
     * タスクアイコンも隠す
     */
    const taskIcons =
        document.getElementById("taskIcons");

    if (taskIcons) {
        taskIcons.style.display = "none";
    }

    /*
     * TV UI
     */
    const root =
        document.getElementById(
            "winconTVRoot"
        );

    if (root) {
        root.classList.add("active");
    }

    renderTVHome();
}

    function closeTVMode() {

        if (!tvState.active) {
            return;
        }

        closeCurrentTVApp();

        tvState.active = false;
        tvState.page = "home";
        tvState.currentAppTitle = null;
		if (tvState.failedApps) {
    tvState.failedApps.clear();
}

        }

        document.body.classList.remove(

        document.body.classList.remove(

            document.getElementById("taskbar");

        if (taskbar) {
            taskbar.style.display = "";

        const taskIcons =
            document.getElementById("taskIcons");

        if (taskIcons) {
            taskIcons.style.display = "";

        /*

        document
            .querySelectorAll(
                ".window[data-wincon-tv-original-display]"

            .forEach(win => {

                win.style.display =
                    win.dataset.winconTVOriginalDisplay;

                delete win.dataset

    /* =====================================================
       Launch selected app
    ===================================================== */

   function launchSelectedTVApp() {

    const apps = getTVApps();

    const app =
        apps[tvState.selectedIndex];

    if (!app) {
        return;
    }
 if (app.type === "shutdown") {

        notifyTVAppExcluded(
            app.title,
            "シャットダウンはTVモードから実行できません。"
        );

        renderTVHome();

        return;
    }
    /*
     * 現在のTVアプリを閉じる。
     * Popup / UACには触れない。
     */
    closeCurrentTVApp();

    tvState.currentAppTitle =
        app.title;

    tvState.page = "app";

    /*
     * shutdownはWindowを生成しない。
     *
     * そのためWindow待ちをせず、
     * そのまま通常のopenAppCommandへ渡す。
     */
    if (app.type === "shutdown") {

        try {

            openAppCommand(
                ["openapp", app.title],
                console.log
            );

        } catch (e) {

            console.error(
                "[Wincon TV] shutdown起動失敗",
                e
            );

        }

        return;
    }

    /*
     * 起動前のWindowを記録
     */
    const beforeWindows =
        [
            ...document.querySelectorAll(
                ".window"
            )
        ];

    let launchFailed = false;

    try {

        openAppCommand(
            ["openapp", app.title],
            console.log
        );

    } catch (e) {

        console.error(
            "[Wincon TV] アプリ起動失敗:",
            app.title,
            e
        );

        launchFailed = true;

    }

    /*
     * 同期的に例外が発生した場合
     */
    if (launchFailed) {

        markTVAppFailed(
            app.title
        );

        return;
    }

    /*
     * Window生成待ち
     *
     * 50ms × 60回
     * = 最大3秒
     */
    let attempts = 0;

    const maxAttempts = 60;

    const waitForWindow =
        setInterval(() => {

            /*
             * TVモード自体が終了していたら
             * 待機を終了。
             */
            if (!tvState.active) {

                clearInterval(
                    waitForWindow
                );

                return;
            }

            const windows =
                [
                    ...document.querySelectorAll(
                        ".window"
                    )
                ];

            /*
             * 起動前には存在しなかったWindow
             */
            const newWindows =
                windows.filter(
                    win =>
                        !beforeWindows.includes(
                            win
                        )
                );

            /*
             * PopupはTV対象外
             */
            const tvWindows =
                newWindows.filter(
                    win =>
                        win.dataset.popup !==
                        "true"
                );

            /*
             * 通常Windowが生成された
             */
            if (tvWindows.length) {

                clearInterval(
                    waitForWindow
                );

                const target =
                    tvWindows[
                        tvWindows.length - 1
                    ];

                promoteWindowToTV(
                    target
                );

                return;
            }

            /*
             * Popupだけ生成された場合
             *
             * Popupは正常なので、
             * 起動失敗にはしない。
             */
            if (
                newWindows.length &&
                newWindows.every(
                    win =>
                        win.dataset.popup ===
                        "true"
                )
            ) {

                clearInterval(
                    waitForWindow
                );

                newWindows.forEach(
                    win => {

                        win.style.display =
                            "flex";

                        win.style.zIndex =
                            "2147483646";

                    }
                );

                /*
                 * Popupを開いただけなので
                 * TVアプリ画面としては終了。
                 */
                tvState.page = "home";
                tvState.currentAppTitle =
                    null;

                renderTVHome();

                return;
            }

            attempts++;

            /*
             * 3秒経過
             */
           if (attempts >= maxAttempts) {

    clearInterval(
        waitForWindow
    );

    console.warn(
        "[Wincon TV] Window生成待ちがタイムアウト:",
        app.title
    );

    if (!tvState.failedApps) {
        tvState.failedApps = new Set();
    }

    tvState.failedApps.add(
        app.title
    );

    showWinconNotification(
        "Wincon TV",
        `「${app.title}」はTVモードでは利用できないため、除外されました。`
    );

    tvState.currentAppTitle = null;
    tvState.page = "home";

    document.body.classList.remove(
        "wincon-tv-app-active"
    );

    setTimeout(() => {
        renderTVHome();
    }, 1200);
}

        }, 50);
}

function markTVAppFailed(appTitle) {

    if (!appTitle) {
        return;
    }

    if (!tvState.failedApps) {
        tvState.failedApps =
            new Set();
    }

    tvState.failedApps.add(
        appTitle
    );

    console.warn(
        "[Wincon TV] TVでは利用できないアプリとして一時除外:",
        appTitle
    );

    tvState.currentAppTitle =
        null;

    tvState.page =
        "home";

    document.body.classList.remove(
        "wincon-tv-app-active"
    );

    /*
     * 一覧を再生成。
     * failedAppsに入ったアプリは消える。
     */
    renderTVHome();

}


    /* =====================================================
       TV Window
    ===================================================== */

    function promoteWindowToTV(current) {

    if (!current) {
        return;
    }

    /*
     * Popupは絶対にTV化しない
     */
    if (
        current.dataset.popup === "true"
    ) {

        current.classList.remove(
            "wincon-tv-app-window"
        );

        current.style.display =
            "flex";

        current.style.zIndex =
            "2147483646";

        return;
    }

    /*
     * 他の通常Windowを非表示
     *
     * PopupとUACは除外。
     */
    document
        .querySelectorAll(".window")
        .forEach(win => {

            if (win === current) {
                return;
            }

            /*
             * Popup
             */
            if (
                win.dataset.popup ===
                "true"
            ) {

                win.style.display =
                    "flex";

                win.style.zIndex =
                    "2147483646";

                return;
            }

            /*
             * UAC
             */
            if (
                win.id ===
                "winconUACDialog"
            ) {
                return;
            }

            win.style.display =
                "none";
        });

    current.style.display =
        "flex";

    current.classList.add(
        "wincon-tv-app-window"
    );

    current.style.zIndex =
        "2147483200";

       TV Back
       ===================================================== */

    function tvBack() {

        /*
         * アプリ → TVホーム
         */

        if (tvState.page === "app") {

            closeCurrentTVApp();

            renderTVHome();

            return;
        }

         */

    /* =====================================================
       Selection
    ===================================================== */

    function moveSelection(dx, dy) {

        if (tvState.page !== "home") {
            return;
        }

        const apps = getTVApps();

        if (!apps.length) return;

        const grid =
            document.getElementById(
                "winconTVGrid"
            );

        if (!grid) return;

        const cards =
            [
                ...grid.querySelectorAll(
                    ".wincon-tv-card"
                )
            ];

        /*
         * 最後のカードはTV終了。
         */

        const total = cards.length;

        /*
         * 実際のグリッド列数を取得
         */

        let columns = 1;

        if (cards.length > 1) {

            const firstTop =
                cards[0]
                    .getBoundingClientRect()
                    .top;

            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                const top =
                    cards[i]
                        .getBoundingClientRect()
                        .top;

                if (
                    Math.abs(
                        top - firstTop
                    ) < 5
                ) {
                    columns++;
                } else {
                    break;
                }

            }

        }

        columns = Math.max(
            1,
            columns - 1
        );

        let next =
            tvState.selectedIndex;

        if (dx !== 0) {
            next += dx;
        }

        if (dy !== 0) {
            next += dy * columns;
        }

        next = Math.max(
            0,
            Math.min(
                total - 1,
                next
            )
        );

        if (
            next ===
            tvState.selectedIndex
        ) {
            return;
        }

        tvState.selectedIndex = next;

        renderTVHome();

        const selected =
            document.querySelector(
                `.wincon-tv-card[data-index="${next}"]`
            );

        if (selected) {

            selected.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

        }

    }


    /* =====================================================
       Key Handling
    ===================================================== */

    function handleTVKey(event) {

        if (!tvState.active) {
            return;
        }

        /*
         * キーマップ設定中は
         * キーマップモジュール側へ渡す。
         */

        if (tvState.waitingForKey) {
            return;
        }

        const key = event.key;

        if (key === tvKeyMap.up) {

            event.preventDefault();

            moveSelection(0, -1);

            return;
        }

        if (key === tvKeyMap.down) {

            event.preventDefault();

            moveSelection(0, 1);

            return;
        }

        if (key === tvKeyMap.left) {

            event.preventDefault();

            moveSelection(-1, 0);

            return;
        }

        if (key === tvKeyMap.right) {

            event.preventDefault();

            moveSelection(1, 0);

            return;
        }

        if (key === tvKeyMap.select) {

            event.preventDefault();

            if (
                tvState.page === "home"
            ) {

                const apps =
                    getTVApps();

                /*
                 * TV終了カード
                 */

                const grid =
                    document.getElementById(
                        "winconTVGrid"
                    );

                const cards =
                    grid
                        ? [
                            ...grid.querySelectorAll(
                                ".wincon-tv-card"
                            )
                        ]
                        : [];

                if (
                    tvState.selectedIndex >=
                    apps.length
                ) {

                    closeTVMode();

                    return;
                }

                launchSelectedTVApp();
            }

            return;
        }

        if (key === tvKeyMap.back) {

            event.preventDefault();

            /*
             * BackspaceはTVモード終了ではない。
             *
             * アプリ → ホーム
             */

            tvBack();

            return;
        }

    }

    document.addEventListener(
        "keydown",
        handleTVKey,
        true
    );

    /* =====================================================
       Key Capture
    ===================================================== */

    function beginKeyCapture(
        action,
        button
    ) {

        if (tvState.waitingForKey) {
            return;
        }

        tvState.waitingForKey = true;
        tvState.selectedKeyAction = action;

        button.classList.add(
            "waiting"
        );

        button.textContent =
            "ボタンを押してください…";

        function capture(event) {

            /*
             * キーマップ画面自身を操作するための
             * Escapeなども登録可能にする。
             */

            event.preventDefault();
            event.stopPropagation();

            const key = event.key;

            tvKeyMap[action] = key;

            saveKeyMap();

            tvState.waitingForKey = false;
            tvState.selectedKeyAction = null;

            document.removeEventListener(
                "keydown",
                capture,
                true
            );

            renderKeyMapList();
        }

        document.addEventListener(
            "keydown",
            capture,
            true
        );

    }

            ArrowRight: "→ 右",

            Enter: "Enter",

            Backspace: "Backspace",

            Escape: "Esc",

            " ": "Space"

        };

        return names[key] || key;

    }


    /* =====================================================
       WebHID
    ===================================================== */

    async function refreshHIDDevices() {

        const status =
            document.getElementById(
                "winconHIDStatus"
            );

        if (!status) return;

        if (!("hid" in navigator)) {

            status.textContent =
                "このブラウザはWebHIDに対応していません。キーボードとして認識されたBluetooth機器は通常のキー入力として利用できます。";

            return;

        }

        try {

            const devices =
                await navigator.hid.getDevices();

            tvState.hidDevices =
                devices;

            if (!devices.length) {

                status.textContent =
                    "登録済みのHIDデバイスはありません。";

                return;
            }

            status.textContent =
                devices
                    .map(device => {

                        return (
                            device.productName ||
                            "名称不明のHIDデバイス"
                        );

                    })
                    .join(" / ");

        } catch (e) {

            console.error(
                "[Wincon TV] HID取得失敗",
                e
            );

            status.textContent =
                "HIDデバイス情報を取得できませんでした。";

        }

    }


    /* =====================================================
       Connect HID
    ===================================================== */

    async function connectHIDDevice() {

        if (!("hid" in navigator)) {

            alert(
                "このブラウザはWebHIDに対応していません。"
            );

            return;
        }

        try {

            const devices =
                await navigator.hid.requestDevice({
                    filters: []
                });

            tvState.hidDevices =
                devices;

            await refreshHIDDevices();

        } catch (e) {

            if (
                e.name !==
                "NotFoundError"
            ) {

                console.error(
                    "[Wincon TV] HID接続失敗",
                    e
                );

            }

        }

    }

        if (connect) {

            connect.onclick =
                connectHIDDevice;

        }

        if (refresh) {

            refresh.onclick =
                refreshHIDDevices;

        }

        refreshHIDDevices();

    }
