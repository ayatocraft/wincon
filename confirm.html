
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>App起動確認</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: transparent;

}

.confirm {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}

.card {

    width: 100%;

    max-width: 380px;

    text-align: center;

}

.icon {

    font-size: 48px;

    margin-bottom: 10px;

}

.title {

    font-size: 21px;

    font-weight: 600;

    margin-bottom: 8px;

}

.message {

    color: #666;

    font-size: 14px;

    margin-bottom: 22px;

}

.buttons {

    display: flex;

    justify-content: center;

    gap: 10px;

}

button {

    border: 0;

    border-radius: 8px;

    padding: 10px 24px;

    font-size: 14px;

    cursor: pointer;

}

.cancel {

    background: #eee;

}

.open {

    background: #0078d4;

    color: white;

}

</style>

</head>


<body>


<div class="confirm">

    <div class="card">

        <div
            class="icon"
            id="icon"
        >
            🌐
        </div>


        <div
            class="title"
            id="title"
        >
            App
        </div>


        <div class="message">
            このアプリを開きますか？
        </div>


        <div class="buttons">

            <button
                class="cancel"
                onclick="cancel()"
            >
                キャンセル
            </button>


            <button
                class="open"
                onclick="openApp()"
            >
                開く
            </button>

        </div>

    </div>

</div>


<script>

const windowId =
    params.get("winconWindowId");
const WINCON_ORIGIN =
    "https://ayatocraft.github.io";


const params =
    new URLSearchParams(
        location.search
    );


const appId =
    params.get(
        "appId"
    );


const appTitle =
    params.get(
        "title"
    ) ||
    "App";


const appIcon =
    params.get(
        "icon"
    ) ||
    "🌐";


document.getElementById(
    "title"
).textContent =
    appTitle;


document.getElementById(
    "icon"
).textContent =
    appIcon;


/*
==================================================
 Appを起動
==================================================
*/

function closeConfirm() {

    if (!windowId) return;

    window.parent.postMessage(

        {
            type: "wincon",
            action: "closeWindow",
            windowId: windowId
        },

        WINCON_ORIGIN

    );

}


function openApp() {

    window.parent.postMessage(

        {
            type: "wincon",
            action: "launchApp",
            appId: appId
        },

        WINCON_ORIGIN

    );

    closeConfirm();

}


function cancel() {

    closeConfirm();

}

</script>


</body>

</html>
