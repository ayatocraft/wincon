<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト用アプリ</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: #20242b;
    color: white;
}

.message {
    text-align: center;
}

.icon {
    font-size: 52px;
    margin-bottom: 14px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

p {
    margin-top: 10px;
    opacity: .7;
}
</style>
</head>

<body>

<div class="message">
    <div class="icon">🧪</div>

    <h1>テスト用アプリです</h1>

    <p>Third-partyインストールのテストモジュール</p>
</div>

</body>
</html>
